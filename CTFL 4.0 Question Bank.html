 into given/when/then format", "Regression tests are automated"], "a": [2, 4], "e": "Exit criteria: đạt defect density ước tính (c) và regression test đã được tự động hóa (e). Test environment sẵn sàng, đăng nhập được, yêu cầu ở dạng Given/When/Then là entry criteria.", "vq": "HAI lựa chọn nào sau đây là exit criteria khi test một hệ thống?", "vo": ["Test environment đã sẵn sàng", "Tester có thể đăng nhập vào test object", "Đạt được defect density ước tính", "Yêu cầu đã được chuyển sang định dạng given/when/then", "Regression test đã được tự động hóa"]}, {"id": "OFF-A32", "set": "A", "n": 32, "c": 5, "lo": "FL-5.1.4", "k": "K3", "b": [["p", "Your team uses the three-point estimation technique to estimate the test effort for a new high-risk feature. The following estimates were made:"], ["list", ["• Most optimistic estimation: 2 person-hours", "• Most likely estimation: 11 person-hours", "• Most pessimistic estimation: 14 person-hours"]], ["p", "What is the final estimate?"]], "fig": null, "after": null, "o": ["9 person-hours", "14 person-hours", "11 person-hours", "10 person-hours"], "a": [3], "e": "E = (a + 4m + b) / 6 = (2 + 4×11 + 14) / 6 = 60 / 6 = 10 người-giờ.", "vq": "Team của bạn dùng kỹ thuật three-point estimation để ước lượng test effort cho một tính năng mới có rủi ro cao. Các ước lượng như sau:\n• Lạc quan nhất: 2 người-giờ\n• Khả năng cao nhất: 11 người-giờ\n• Bi quan nhất: 14 người-giờ\n\nƯớc lượng cuối cùng là bao nhiêu?", "vo": ["9 người-giờ", "14 người-giờ", "11 người-giờ", "10 người-giờ"]}, {"id": "OFF-A33", "set": "A", "n": 33, "c": 5, "lo": "FL-5.1.5", "k": "K3", "b": [["p", "You are testing a mobile application that allows users to find a nearby restaurant based on the type of food they want to eat. Consider the following list of test cases, priorities (i.e., a smaller number means a higher priority), and dependencies:"], ["table", [["Test case number", "Test condition covered", "Priority", "Logical dependency"], ["TC 001", "Select type of food", "3", "none"], ["TC 002", "Select restaurant", "2", "TC 001"], ["TC 003", "Get direction", "1", "TC 002"], ["TC 004", "Call restaurant", "2", "TC 002"], ["TC 005", "Make reservation", "3", "TC 002"]]], ["p", "Which of the following test cases should be executed as the third one?"]], "fig": null, "after": null, "o": ["TC 003", "TC 005", "TC 002", "TC 001"], "a": [0], "e": "Do phụ thuộc, TC 001 chạy đầu, rồi TC 002. Sau đó chọn theo priority: TC 003 (priority 1) là test thứ ba, rồi TC 004, TC 005.", "vq": "Bạn đang test ứng dụng di động giúp người dùng tìm nhà hàng gần đó theo loại món ăn họ muốn. Xét danh sách test case, mức ưu tiên (số càng nhỏ thì ưu tiên càng cao) và các phụ thuộc như bảng.\n\nTest case nào nên được chạy thứ ba?", "vo": ["TC 003", "TC 005", "TC 002", "TC 001"]}, {"id": "OFF-A34", "set": "A", "n": 34, "c": 5, "lo": "FL-5.1.7", "k": "K2", "b": [["p", "Consider the following test categories (1-4) and agile testing quadrants (A-D):"], ["list", ["1. Usability testing", "2. Component testing", "3. Functional testing", "4. Reliability testing"]], ["list", ["A. Agile testing quadrant Q1: technology facing, supporting the development team", "B. Agile testing quadrant Q2: business facing, supporting the development team", "C. Agile testing quadrant Q3: business facing, critique the product", "D. Agile testing quadrant Q4: technology facing, critique the product"]], ["p", "How do the following test categories map onto the agile testing quadrants?"]], "fig": null, "after": null, "o": ["1C, 2A, 3B, 4D", "1D, 2A, 3C, 4B", "1C, 2B, 3D, 4A", "1D, 2B, 3C, 4A"], "a": [0], "e": "Usability → Q3 (1C); component testing → Q1 (2A); functional testing → Q2 (3B); reliability (non-functional) → Q4 (4D).", "vq": "Xét các loại test (1-4) và các agile testing quadrant (A-D):\n1. Usability testing\n2. Component testing\n3. Functional testing\n4. Reliability testing\n\nA. Q1: hướng công nghệ, hỗ trợ team phát triển\nB. Q2: hướng nghiệp vụ, hỗ trợ team phát triển\nC. Q3: hướng nghiệp vụ, phản biện sản phẩm\nD. Q4: hướng công nghệ, phản biện sản phẩm\n\nCác loại test được ánh xạ vào các quadrant như thế nào?", "vo": ["1C, 2A, 3B, 4D", "1D, 2A, 3C, 4B", "1C, 2B, 3D, 4A", "1D, 2B, 3C, 4A"]}, {"id": "OFF-A35", "set": "A", "n": 35, "c": 5, "lo": "FL-5.2.4", "k": "K2", "b": [["p", "During a risk analysis the following risk was identified and assessed:"], ["list", ["• Risk: Response time is too long to generate a report", "• Risk likelihood: medium; risk impact: high", "• Response to risk:", "o An independent test team performs performance efficiency testing during system testing", "o A selected sample of end users performs alpha testing and beta testing before the release"]], ["p", "What measure is proposed to be taken in response to this analyzed risk?"]], "fig": null, "after": null, "o": ["Risk acceptance", "Contingency plan", "Risk mitigation", "Risk transfer"], "a": [2], "e": "Hành động đề xuất đều là testing (performance testing, alpha/beta testing) → risk mitigation. Không phải chấp nhận, không có contingency plan, không chuyển rủi ro.", "vq": "Trong phân tích rủi ro, rủi ro sau được xác định và đánh giá:\n• Rủi ro: thời gian phản hồi khi tạo báo cáo quá lâu\n• Khả năng xảy ra: trung bình; mức ảnh hưởng: cao\n• Phản ứng với rủi ro:\n  – Một đội test độc lập thực hiện performance efficiency testing trong system testing\n  – Một nhóm end user được chọn thực hiện alpha testing và beta testing trước khi release\n\nBiện pháp nào được đề xuất để phản ứng với rủi ro đã phân tích này?", "vo": ["Chấp nhận rủi ro (risk acceptance)", "Kế hoạch dự phòng (contingency plan)", "Giảm thiểu rủi ro (risk mitigation)", "Chuyển giao rủi ro (risk transfer)"]}, {"id": "OFF-A36", "set": "A", "n": 36, "c": 5, "lo": "FL-5.3.3", "k": "K2", "b": [["p", "Which work product can be used by an agile team to show the amount of work that has been completed and the amount of total work remaining for a given iteration?"]], "fig": null, "after": null, "o": ["Acceptance criteria", "Defect report", "Test completion report", "Burndown chart"], "a": [3], "e": "Burndown chart thể hiện công việc còn lại so với thời gian, cập nhật hằng ngày trong iteration. Test completion report chỉ lập sau khi iteration kết thúc.", "vq": "Work product nào có thể được agile team dùng để thể hiện khối lượng công việc đã hoàn thành và tổng công việc còn lại trong một iteration?", "vo": ["Acceptance criteria", "Defect report", "Test completion report", "Burndown chart"]}, {"id": "OFF-A37", "set": "A", "n": 37, "c": 5, "lo": "FL-5.4.1", "k": "K2", "b": [["p", "You need to update one of the automated test scripts to be in line with a new requirement. Which process indicates that you create a new version of the test script in the test repository?"]], "fig": null, "after": null, "o": ["Traceability management", "Maintenance testing", "Configuration management", "Requirements engineering"], "a": [2], "e": "Tạo phiên bản mới của test script trong repository là việc của configuration management (version control các test item). Traceability là quan hệ giữa các work product khác nhau.", "vq": "Bạn cần cập nhật một automated test script cho phù hợp với yêu cầu mới. Quy trình nào quy định việc bạn tạo một phiên bản mới của test script trong test repository?", "vo": ["Quản lý traceability", "Maintenance testing", "Configuration management", "Requirements engineering"]}, {"id": "OFF-A38", "set": "A", "n": 38, "c": 5, "lo": "FL-5.5.1", "k": "K3", "b": [["p", "You received the following defect report from the developers stating that the anomaly described in this test report is not reproducible."], ["quote", "Application hangs up\n2022-May-03 – John Doe – Rejected\nThe application hangs up after entering “Test input: $ä” in the Name field on the new user creation screen. Tried to log off, log in with test_admin01 account, same issue. Tried with other test admin accounts, same issue. No error message received; log (see attached) contains fatal error notification. Based on the test case TC-1305, the application should accept the provided input and create the user. Please fix with high priority, this feature is related to REQ-0012, which is a critical new business requirement."], ["p", "What critical information is MISSING from this test report that would have been useful for the developers?"]], "fig": null, "after": null, "o": ["Expected result and actual result", "References and defect status", "Test environment and test item", "Priority and severity"], "a": [2], "e": "Báo cáo thiếu test environment và test item (ứng dụng nào, phiên bản nào), nên developer không tái hiện được. Expected/actual result, reference, priority đều đã có.", "vq": "Bạn nhận được defect report sau từ developer, với nội dung rằng anomaly mô tả trong báo cáo không tái hiện được.\n\n[Báo cáo] Ứng dụng bị treo — 2022-May-03 — John Doe — Bị từ chối (Rejected). Ứng dụng bị treo sau khi nhập \"Test input: $ä\" vào trường Name trên màn hình tạo người dùng mới. Đã thử đăng xuất, đăng nhập bằng tài khoản test_admin01, vẫn lỗi. Đã thử với các tài khoản test admin khác, vẫn lỗi. Không có thông báo lỗi; log (đính kèm) có thông báo fatal error. Theo test case TC-1305, ứng dụng phải chấp nhận input này và tạo người dùng. Vui lòng sửa với ưu tiên cao, tính năng này liên quan đến REQ-0012, một yêu cầu nghiệp vụ mới quan trọng.\n\nThông tin quan trọng nào BỊ THIẾU trong báo cáo này mà lẽ ra sẽ hữu ích cho developer?", "vo": ["Kết quả mong đợi và kết quả thực tế", "Tham chiếu (references) và trạng thái defect", "Test environment và test item", "Priority và severity"]}, {"id": "OFF-A39", "set": "A", "n": 39, "c": 6, "lo": "FL-6.1.1", "k": "K2", "b": [["p", "Which test activity does a data preparation tool support?"]], "fig": null, "after": null, "o": ["Test monitoring and test control", "Test analysis", "Test design and test implementation", "Test completion"], "a": [2], "e": "Công cụ chuẩn bị dữ liệu hỗ trợ test design và test implementation, nơi tạo hoặc thu thập testware như test data.", "vq": "Công cụ chuẩn bị dữ liệu (data preparation tool) hỗ trợ hoạt động test nào?", "vo": ["Test monitoring và test control", "Test analysis", "Test design và test implementation", "Test completion"]}, {"id": "OFF-A40", "set": "A", "n": 40, "c": 6, "lo": "FL-6.2.1", "k": "K1", "b": [["p", "Which item correctly identifies a potential risk of performing test automation?"]], "fig": null, "after": null, "o": ["It may introduce unknown regressions in production", "Sufficient efforts to maintain testware may not be properly allocated", "Testing tools and associated testware may not be sufficiently relied upon", "It may reduce the time allocated for manual testing"], "a": [1], "e": "Rủi ro của automation: không phân bổ đủ công sức để bảo trì testware. Giảm manual testing là lợi ích; tool phải được chọn sao cho có thể tin cậy.", "vq": "Lựa chọn nào xác định đúng một rủi ro tiềm ẩn khi thực hiện test automation?", "vo": ["Có thể gây ra các regression không lường trước trên production", "Có thể không phân bổ đủ công sức để bảo trì testware", "Công cụ test và testware đi kèm có thể không được tin cậy đầy đủ", "Có thể làm giảm thời gian dành cho manual testing"]}, {"id": "OFF-AX1", "set": "AX", "n": 1, "c": 1, "lo": "FL-1.1.2", "k": "K2", "b": [["p", "You were given a task to analyze and fix causes of failures in a new system to be released."], ["p", "Which activity are you performing?"]], "fig": null, "after": null, "o": ["Debugging", "Software testing", "Requirement elicitation", "Defect management"], "a": [0], "e": "Debugging là tìm, phân tích và loại bỏ nguyên nhân gây failure. Testing không bao gồm việc sửa nguyên nhân failure.", "vq": "Bạn được giao nhiệm vụ phân tích và sửa nguyên nhân gây failure trong một hệ thống mới sắp release.\n\nBạn đang thực hiện hoạt động nào?", "vo": ["Debugging", "Kiểm thử phần mềm (software testing)", "Thu thập yêu cầu (requirement elicitation)", "Quản lý defect (defect management)"]}, {"id": "OFF-AX2", "set": "AX", "n": 2, "c": 1, "lo": "FL-1.2.2", "k": "K1", "b": [["p", "In many software organizations the test department is called the Quality Assurance (QA) department. Is this sentence correct or not and why?"]], "fig": null, "after": null, "o": ["It is correct. Testing and QA mean exactly the same thing", "It is correct. These names can be used interchangeably because both testing and QA focus their activities on the same quality issues", "It is not correct. Testing is something more; testing includes all activities with regard to quality. QA focuses on quality-related processes", "It is not correct. QA is focused on quality-related processes while testing concentrates on demonstrating that a component or system is fit for purpose and to detect defects"], "a": [3], "e": "Testing và QA không giống nhau. QA tập trung vào quy trình liên quan chất lượng; testing chứng minh hệ thống phù hợp mục đích và phát hiện defect.", "vq": "Ở nhiều tổ chức phần mềm, bộ phận test được gọi là bộ phận Quality Assurance (QA). Câu này đúng hay sai, và tại sao?", "vo": ["Đúng. Testing và QA hoàn toàn giống nhau", "Đúng. Hai tên này dùng thay thế cho nhau được vì cả testing và QA đều tập trung vào cùng các vấn đề chất lượng", "Sai. Testing rộng hơn; testing bao gồm mọi hoạt động liên quan đến chất lượng. QA tập trung vào các quy trình liên quan đến chất lượng", "Sai. QA tập trung vào các quy trình liên quan đến chất lượng, còn testing tập trung vào việc chứng minh component hoặc hệ thống phù hợp mục đích và phát hiện defect"]}, {"id": "OFF-AX3", "set": "AX", "n": 3, "c": 1, "lo": "FL-1.2.3", "k": "K2", "b": [["p", "A phone ringing in a neighboring cubicle distracts a programmer causing him to improperly program the logic that checks the upper boundary of an input variable. Later, during system testing, a tester notices that this input field accepts invalid input values."], ["p", "Which of the following correctly describes an incorrectly coded upper bound?"]], "fig": null, "after": null, "o": ["The root cause", "A failure", "An error", "A defect"], "a": [3], "e": "Upper bound bị code sai là defect (nằm trong code). Tiếng chuông điện thoại gây mất tập trung là root cause; suy nghĩ sai của lập trình viên là error; chấp nhận input không hợp lệ là failure.", "vq": "Tiếng chuông điện thoại ở bàn bên làm một lập trình viên mất tập trung, khiến anh ta lập trình sai logic kiểm tra cận trên của một biến input. Sau đó, trong system testing, tester nhận thấy trường input này chấp nhận giá trị không hợp lệ.\n\nĐiều nào mô tả đúng về cận trên bị code sai?", "vo": ["Root cause (nguyên nhân gốc)", "Một failure", "Một error", "Một defect"]}, {"id": "OFF-AX4", "set": "AX", "n": 4, "c": 1, "lo": "FL-1.4.3", "k": "K2", "b": [["p", "Consider the following testware."], ["pre", "Test Charter #04.018        Session time: 1h\nExplore:      Registration page\nWith:         Different sets of incorrect input data\nTo discover:  Defects related to accepting the registration\n              process with the incorrect input"], ["p", "Which test activity produces this testware as an output?"]], "fig": null, "after": null, "o": ["Test planning", "Test monitoring and test control", "Test analysis", "Test design"], "a": [3], "e": "Testware này là test charter, và test charter là output của test design.", "vq": "Xét testware sau (Test Charter #04.018, thời lượng session: 1 giờ — Khám phá: trang Đăng ký — Với: các bộ dữ liệu input sai khác nhau — Để phát hiện: defect liên quan đến việc chấp nhận quá trình đăng ký với input sai).\n\nHoạt động test nào tạo ra testware này như một output?", "vo": ["Test planning", "Test monitoring và test control", "Test analysis", "Test design"]}, {"id": "OFF-AX5", "set": "AX", "n": 5, "c": 1, "lo": "FL-1.4.4", "k": "K2", "b": [["p", "Which of the following is the BEST example of how traceability supports testing?"]], "fig": null, "after": null, "o": ["Performing the impact analysis of a change will give information about the completion of the tests", "Analyzing the traceability between test cases and test results will give information about the estimated level of residual risk", "Performing the impact analysis of a change will help selecting the right test cases for regression testing", "Analyzing the traceability between the test basis, the test objects and the test cases will help in selecting test data to achieve the assumed coverage of the test object"], "a": [2], "e": "Phân tích impact của thay đổi nhờ traceability giúp chọn đúng test case cho regression testing. Traceability không tự cho biết residual risk nếu test chưa được truy về rủi ro.", "vq": "Đâu là ví dụ TỐT NHẤT về cách traceability hỗ trợ testing?", "vo": ["Phân tích impact của một thay đổi sẽ cho biết thông tin về mức độ hoàn thành của các test", "Phân tích traceability giữa test case và kết quả test sẽ cho biết mức residual risk ước tính", "Phân tích impact của một thay đổi giúp chọn đúng test case cho regression testing", "Phân tích traceability giữa test basis, test object và test case giúp chọn test data để đạt coverage mong muốn của test object"]}, {"id": "OFF-AX6", "set": "AX", "n": 6, "c": 1, "lo": "FL-1.5.3", "k": "K2", "b": [["p", "Which of the following BEST explains a benefit of independence of testing?"]], "fig": null, "after": null, "o": ["The use of an independent test team allows project management to assign responsibility for the quality of the final deliverable to the test team", "If a test team external to the organization can be afforded, then there are distinct benefits in terms of this external team not being so easily swayed by the delivery concerns of project management and the need to meet strict delivery deadlines", "An independent test team can work separately from the developers, need not be distracted with project requirement changes, and can restrict communication with the developers to defect reporting through the defect management system", "When specifications contain ambiguities and inconsistencies, assumptions are made on their interpretation, and an independent tester can be useful in questioning those assumptions and the interpretation made by the developer"], "a": [3], "e": "Đặc tả luôn có điểm mơ hồ, developer phải tự giả định; tester độc lập có thể chất vấn và kiểm chứng các giả định đó. Chất lượng là trách nhiệm của mọi người; làm việc tách biệt hoàn toàn là thực hành xấu.", "vq": "Điều nào sau đây giải thích TỐT NHẤT một lợi ích của independence of testing (kiểm thử độc lập)?", "vo": ["Dùng một đội test độc lập cho phép ban quản lý dự án giao trách nhiệm về chất lượng sản phẩm cuối cùng cho đội test", "Nếu có thể thuê đội test bên ngoài tổ chức thì có lợi ích rõ rệt là đội này không dễ bị chi phối bởi áp lực giao hàng của ban quản lý dự án và hạn chót nghiêm ngặt", "Một đội test độc lập có thể làm việc tách biệt với developer, không bị phân tâm bởi thay đổi yêu cầu, và chỉ giao tiếp với developer qua việc báo defect trong hệ thống quản lý defect", "Khi đặc tả có điểm mơ hồ và mâu thuẫn, người ta phải đưa ra giả định về cách hiểu; tester độc lập có thể hữu ích trong việc chất vấn các giả định và cách hiểu của developer"]}, {"id": "OFF-AX7", "set": "AX", "n": 7, "c": 2, "lo": "FL-2.1.1", "k": "K2", "b": [["p", "You are working as a tester in the team that follows the V-model. Which of the following activities CAN be performed in the initial phases of the SDLC?"]], "fig": null, "after": null, "o": ["Dynamic test execution", "Static testing", "Test planning", "Acceptance test execution", "Maintenance testing"], "a": [1, 2], "e": "Giai đoạn đầu của V-model chưa có code, nên có thể làm static testing (review yêu cầu) và test planning. Dynamic test, acceptance test execution và maintenance testing cần có sản phẩm chạy được.", "vq": "Bạn là tester trong team theo V-model. Những hoạt động nào sau đây CÓ THỂ thực hiện ở các giai đoạn đầu của SDLC?", "vo": ["Thực thi dynamic test", "Static testing", "Test planning", "Thực thi acceptance test", "Maintenance testing"]}, {"id": "OFF-AX8", "set": "AX", "n": 8, "c": 2, "lo": "FL-2.1.4", "k": "K2", "b": [["p", "Which of the following are advantages of DevOps?"], ["list", ["i. Faster product release and faster time to market", "ii. Increases the need for repetitive manual testing", "iii. Constant availability of executable software", "iv. Reduction in the number of regression tests associated with code refactoring", "v. Setting up the test automation framework is inexpensive since everything is automated"]]], "fig": null, "after": null, "o": ["i, ii, iv are advantages", "iii, v are advantages", "i, iii are advantages", "ii, iv, v are advantages"], "a": [2], "e": "Lợi ích DevOps: release nhanh hơn (i), luôn có phần mềm chạy được (iii). DevOps giảm test thủ công lặp lại, cần nhiều regression test hơn, và dựng framework tự động hóa thì tốn kém.", "vq": "Những điều nào sau đây là ưu điểm của DevOps?\n\ni. Release sản phẩm nhanh hơn, đưa ra thị trường nhanh hơn\nii. Tăng nhu cầu manual testing lặp lại\niii. Luôn có sẵn phần mềm chạy được\niv. Giảm số lượng regression test liên quan đến refactor code\nv. Dựng test automation framework không tốn kém vì mọi thứ đều tự động", "vo": ["i, ii, iv là ưu điểm", "iii, v là ưu điểm", "i, iii là ưu điểm", "ii, iv, v là ưu điểm"]}, {"id": "OFF-AX9", "set": "AX", "n": 9, "c": 2, "lo": "FL-2.2.2", "k": "K2", "b": [["p", "You work as a tester on a project on a mobile application for food ordering for one of your clients. The client sent you a list of requirements. One of them, with high priority, says"], ["quote", "“The order must be processed in less than 10 seconds in 95% of the cases”."], ["p", "You created a set of test cases in which a number of random orders were made, the processing time measured, and the test results were checked against the requirements."], ["p", "What test type did you perform?"]], "fig": null, "after": null, "o": ["Functional, because the test cases cover the user’s business requirement for the system", "Non-functional, because they measure the system’s performance", "Functional, because the test cases interact with the user interface", "White-box, because we need to know the internal structure of the program to measure the order processing time"], "a": [1], "e": "Đo thời gian xử lý đơn hàng là kiểm tra hệ thống hoạt động \"tốt thế nào\" → non-functional (performance efficiency). Yêu cầu đến từ khách hàng không làm nó thành functional.", "vq": "Bạn là tester cho dự án ứng dụng di động đặt đồ ăn của khách hàng. Khách hàng gửi danh sách yêu cầu, trong đó một yêu cầu ưu tiên cao là: \"Đơn hàng phải được xử lý trong dưới 10 giây ở 95% trường hợp\".\n\nBạn tạo một bộ test case đặt nhiều đơn hàng ngẫu nhiên, đo thời gian xử lý và so kết quả với yêu cầu.\n\nBạn đã thực hiện loại test (test type) nào?", "vo": ["Functional, vì các test case bao phủ yêu cầu nghiệp vụ của người dùng đối với hệ thống", "Non-functional, vì chúng đo hiệu năng của hệ thống", "Functional, vì các test case tương tác với giao diện người dùng", "White-box, vì cần biết cấu trúc bên trong chương trình để đo thời gian xử lý đơn hàng"]}, {"id": "OFF-AX10", "set": "AX", "n": 10, "c": 2, "lo": "FL-2.3.1", "k": "K2", "b": [["p", "Your organization’s test strategy suggests that once a system is going to be retired, data migration shall be tested. As part of what test type is this testing MOST likely to be performed?"]], "fig": null, "after": null, "o": ["Maintenance testing", "Regression testing", "Reliability testing", "Integration testing"], "a": [0], "e": "Kiểm thử chuyển dữ liệu khi ngừng (retire) hệ thống là maintenance testing.", "vq": "Test strategy của tổ chức bạn đề xuất rằng khi một hệ thống sắp ngừng hoạt động (retire), việc chuyển đổi dữ liệu (data migration) phải được test. Việc test này CÓ KHẢ NĂNG NHẤT được thực hiện như một phần của loại test nào?", "vo": ["Maintenance testing", "Regression testing", "Reliability testing", "Integration testing"]}, {"id": "OFF-AX11", "set": "AX", "n": 11, "c": 3, "lo": "FL-3.1.1", "k": "K1", "b": [["p", "The following is a list of the work products produced in the SDLC."], ["list", ["i. Business requirements", "ii. Schedule", "iii. Test budget", "iv. Third-party executable code", "v. User stories and their acceptance criteria"]], ["p", "Which of them can be reviewed?"]], "fig": null, "after": null, "o": ["i and iv can be reviewed", "i, ii, iii and iv can be reviewed", "i, ii, iii, and v can be reviewed", "iii, iv, v can be reviewed"], "a": [2], "e": "Mọi work product đọc hiểu được đều review được, trừ mã thực thi của bên thứ ba → i, ii, iii, v.", "vq": "Dưới đây là danh sách các work product được tạo ra trong SDLC:\ni. Yêu cầu nghiệp vụ\nii. Lịch trình\niii. Ngân sách test\niv. Mã thực thi của bên thứ ba\nv. User story và acceptance criteria\n\nNhững thứ nào có thể được review?", "vo": ["i và iv có thể review", "i, ii, iii và iv có thể review", "i, ii, iii và v có thể review", "iii, iv, v có thể review"]}, {"id": "OFF-AX12", "set": "AX", "n": 12, "c": 3, "lo": "FL-3.1.3", "k": "K2", "b": [["p", "Decide which of the following statements (i-v) are true for static testing."], ["list", ["i. Abnormal external behaviors are easier to identify with this testing", "ii. Discrepancies from a coding standard are easier to find with this testing", "iii. It identifies failures caused by defects when the software is run", "iv. Its test objective is to identify defects as early as possible", "v. Missing coverage for critical security requirements is easier to find and fix"]]], "fig": null, "after": null, "o": ["i, iv, v are true for static testing", "i, iii, iv are true for static testing", "ii, iii are true for static testing", "ii, iv, v are true for static testing"], "a": [3], "e": "Đúng cho static testing: tìm vi phạm coding standard (ii), mục tiêu tìm defect sớm (iv), phát hiện thiếu coverage cho yêu cầu bảo mật (v). Hành vi bất thường và failure khi chạy phần mềm là của dynamic testing.", "vq": "Xác định những phát biểu (i-v) nào đúng với static testing:\ni. Các hành vi bên ngoài bất thường dễ nhận biết hơn với loại test này\nii. Sai lệch so với coding standard dễ tìm hơn với loại test này\niii. Nó xác định các failure do defect gây ra khi phần mềm chạy\niv. Mục tiêu của nó là xác định defect càng sớm càng tốt\nv. Việc thiếu coverage cho các yêu cầu bảo mật quan trọng dễ tìm và sửa hơn", "vo": ["i, iv, v đúng với static testing", "i, iii, iv đúng với static testing", "ii, iii đúng với static testing", "ii, iv, v đúng với static testing"]}, {"id": "OFF-AX13", "set": "AX", "n": 13, "c": 3, "lo": "FL-3.2.2", "k": "K2", "b": [["p", "Which of the following statements about formal reviews is TRUE?"]], "fig": null, "after": null, "o": ["Some reviews do not require more than one role", "The review process has several activities", "Documentation to be reviewed is not distributed before the review meeting, with the exception of the work product for specific review types", "Defects found during the review are not reported since they are not found by dynamic testing"], "a": [1], "e": "Formal review có nhiều hoạt động (planning, initiation, individual review, communication & analysis, fixing & reporting). Mọi loại review đều có nhiều hơn một vai trò; tài liệu nên được phân phát sớm; defect tìm được phải được báo cáo.", "vq": "Phát biểu nào về formal review là ĐÚNG?", "vo": ["Một số review không cần quá một vai trò", "Quy trình review có nhiều hoạt động", "Tài liệu cần review không được phân phát trước buổi họp, trừ work product đối với một số loại review cụ thể", "Defect tìm được trong review không được báo cáo vì chúng không được tìm bằng dynamic testing"]}, {"id": "OFF-AX14", "set": "AX", "n": 14, "c": 3, "lo": "FL-3.2.3", "k": "K1", "b": [["p", "What task may management take on during a formal review?"]], "fig": null, "after": null, "o": ["Taking overall responsibility for the review", "Deciding what is to be reviewed", "Ensuring the effective running of review meetings, and moderating, if necessary", "Recording review information such as review decisions"], "a": [1], "e": "Manager quyết định review cái gì và cấp nguồn lực. Trách nhiệm tổng thể là review leader; điều phối cuộc họp là moderator; ghi chép là scribe.", "vq": "Management có thể đảm nhận nhiệm vụ nào trong một formal review?", "vo": ["Chịu trách nhiệm tổng thể cho buổi review", "Quyết định cái gì sẽ được review", "Đảm bảo các buổi họp review diễn ra hiệu quả và điều phối nếu cần", "Ghi lại thông tin review như các quyết định"]}, {"id": "OFF-AX15", "set": "AX", "n": 15, "c": 4, "lo": "FL-4.2.2", "k": "K3", "b": [["p", "A wine storage system uses a control device that measures the wine cell temperature T (measured in °C, rounded to the nearest degree) and alarms the user if it deviates from the optimal value of 12, according to the following rules:"], ["list", ["• if T = 12, the system says, “optimal temperature”", "• if T < 12, the system says, “temperature is too low!”", "• if T > 12, the system says, “temperature is too high!”"]], ["p", "You want to use the 3-point boundary value analysis (BVA) to verify the behavior of the control device. A test input is a temperature in °C provided by the device."], ["p", "What is the MINIMAL set of test inputs that achieves 100% of the desired coverage?"]], "fig": null, "after": null, "o": ["11, 12, 13", "10, 12, 14", "10, 11, 12, 13, 14", "10, 11, 13, 14"], "a": [2], "e": "Có 3 partition: ≤11, 12, ≥13; các biên là 11, 12, 13. 3-value BVA lấy biên và hai giá trị kề: 10, 11, 12, 13, 14.", "vq": "Một hệ thống bảo quản rượu dùng thiết bị điều khiển đo nhiệt độ hầm T (°C, làm tròn đến độ gần nhất) và báo cho người dùng nếu lệch khỏi giá trị tối ưu 12, theo quy tắc:\n• nếu T = 12: \"nhiệt độ tối ưu\"\n• nếu T < 12: \"nhiệt độ quá thấp!\"\n• nếu T > 12: \"nhiệt độ quá cao!\"\n\nBạn muốn dùng 3-point boundary value analysis (BVA) để kiểm tra hành vi của thiết bị. Mỗi test input là một nhiệt độ °C do thiết bị cung cấp.\n\nTập test input TỐI THIỂU đạt 100% coverage mong muốn là gì?", "vo": ["11, 12, 13", "10, 12, 14", "10, 11, 12, 13, 14", "10, 11, 13, 14"]}, {"id": "OFF-AX16", "set": "AX", "n": 16, "c": 4, "lo": "FL-4.3.2", "k": "K2", "b": [["p", "Which of the following statements about branch testing is CORRECT?"]], "fig": null, "after": null, "o": ["If a program includes only unconditional branches, then 100% branch coverage can be achieved without executing any test cases", "If the test cases exercise all unconditional branches in the code, then 100% branch coverage is achieved", "If 100% statement coverage is achieved, then 100% branch coverage is also achieved", "If 100% branch coverage is achieved, then all decision outcomes in each decision statement in the code are exercised"], "a": [3], "e": "Mỗi decision outcome là một conditional branch, nên 100% branch coverage đồng nghĩa mọi outcome của mọi decision đều được chạy. 100% statement không kéo theo 100% branch.", "vq": "Phát biểu nào về branch testing là ĐÚNG?", "vo": ["Nếu chương trình chỉ có các branch không điều kiện thì có thể đạt 100% branch coverage mà không cần chạy test case nào", "Nếu các test case chạy qua mọi branch không điều kiện trong code thì đạt 100% branch coverage", "Nếu đạt 100% statement coverage thì cũng đạt 100% branch coverage", "Nếu đạt 100% branch coverage thì mọi kết quả (outcome) của mỗi câu lệnh quyết định trong code đều đã được chạy"]}, {"id": "OFF-AX17", "set": "AX", "n": 17, "c": 4, "lo": "FL-4.4.3", "k": "K2", "b": [["p", "You are testing a mobile application that allows customers to access and manage their bank accounts. You are running a test suite that involves evaluating each screen, and each field on each screen, against a general list of user interface best practices derived from a popular book on the topic that maximizes usability for such applications. Which of the following options BEST categorizes the test technique you are using?"]], "fig": null, "after": null, "o": ["Black-box", "Exploratory", "Checklist-based", "Error guessing"], "a": [2], "e": "Danh sách best practices UI là tập test condition cần kiểm tra có hệ thống → checklist-based testing.", "vq": "Bạn đang test ứng dụng di động cho phép khách hàng truy cập và quản lý tài khoản ngân hàng. Bạn chạy một bộ test đánh giá từng màn hình, và từng trường trên mỗi màn hình, theo một danh sách chung các best practice về giao diện người dùng lấy từ một cuốn sách nổi tiếng về tối ưu usability cho loại ứng dụng này. Lựa chọn nào phân loại TỐT NHẤT kỹ thuật test bạn đang dùng?", "vo": ["Black-box", "Exploratory", "Checklist-based", "Error guessing"]}, {"id": "OFF-AX18", "set": "AX", "n": 18, "c": 4, "lo": "FL-4.5.1", "k": "K2", "b": [["p", "Which of the following BEST describe the collaborative approach to user story writing?"]], "fig": null, "after": null, "o": ["User stories are created by testers and developers and then accepted by business representatives", "User stories are created by business representatives, developers, and testers together", "User stories are created by business representatives and verified by developers and testers", "User stories are created in a way that they are independent, negotiable, valuable, estimable, small, and testable"], "a": [1], "e": "Viết user story theo cách cộng tác nghĩa là business, developer và tester cùng viết để có tầm nhìn chung. INVEST là các tính chất của một user story tốt, không phải mô tả cách cộng tác.", "vq": "Điều nào mô tả TỐT NHẤT cách tiếp cận cộng tác trong việc viết user story?", "vo": ["User story do tester và developer viết rồi được đại diện nghiệp vụ chấp nhận", "User story do đại diện nghiệp vụ, developer và tester cùng nhau viết", "User story do đại diện nghiệp vụ viết và được developer, tester kiểm tra", "User story được viết sao cho độc lập, có thể thương lượng, có giá trị, ước lượng được, nhỏ và kiểm thử được"]}, {"id": "OFF-AX19", "set": "AX", "n": 19, "c": 5, "lo": "FL-5.1.1", "k": "K2", "b": [["p", "Consider the following part of a test plan."], ["quote", "Testing will be performed using component testing and component integration testing. The regulations require to demonstrate that 100% branch coverage is achieved for each component classified as critical."], ["p", "Which part of the test plan does this part belong to?"]], "fig": null, "after": null, "o": ["Communication", "Risk register", "Context of testing", "Test approach"], "a": [3], "e": "Đoạn này nói về test level và exit criteria (100% branch coverage) → thuộc test approach trong test plan.", "vq": "Xét một đoạn trong test plan: \"Việc test sẽ được thực hiện bằng component testing và component integration testing. Quy định pháp lý yêu cầu chứng minh đạt 100% branch coverage cho mỗi component được phân loại là quan trọng.\"\n\nĐoạn này thuộc phần nào của test plan?", "vo": ["Giao tiếp (Communication)", "Risk register", "Bối cảnh test (Context of testing)", "Test approach"]}, {"id": "OFF-AX20", "set": "AX", "n": 20, "c": 5, "lo": "FL-5.1.4", "k": "K3", "b": [["p", "Your team uses planning poker to estimate the test effort for a newly required feature. There is a rule in your team that if there is no time to reach full agreement and the variation in the results is small, rules like “accept the number with the most votes” can be applied."], ["p", "After two rounds, the consensus was not reached, so the third round was initiated. You can see the test estimation results in the table below."], ["table", [["", "Estimations of 7 team members", "", "", "", "", "", ""], ["Round 1", "21", "2", "5", "34", "13", "8", "2"], ["Round 2", "13", "8", "8", "34", "13", "8", "5"], ["Round 3", "13", "8", "13", "13", "13", "13", "8"]]], ["p", "Which of the following is the BEST example of the next step?"]], "fig": null, "after": null, "o": ["The product owner has to step in and make a final decision", "Accept 13 as the final test estimate as this has most of the votes", "No further action is needed. Consensus has been reached", "Remove the new feature from the current release because consensus has not been reached"], "a": [1], "e": "Kết quả vòng 3 chênh lệch nhỏ (8 và 13) và team có quy tắc chọn số được nhiều phiếu nhất → chấp nhận 13. Chưa đạt đồng thuận hoàn toàn nên cần áp dụng quy tắc này.", "vq": "Team của bạn dùng planning poker để ước lượng test effort cho một tính năng mới. Team có quy tắc: nếu không kịp đạt đồng thuận hoàn toàn và độ chênh lệch kết quả nhỏ, có thể áp dụng quy tắc như \"chấp nhận con số được nhiều phiếu nhất\".\n\nSau hai vòng chưa đạt đồng thuận, vòng ba được thực hiện. Kết quả ước lượng như bảng.\n\nĐâu là ví dụ TỐT NHẤT cho bước tiếp theo?", "vo": ["Product owner phải can thiệp và đưa ra quyết định cuối cùng", "Chấp nhận 13 là ước lượng test cuối cùng vì nó được nhiều phiếu nhất", "Không cần làm gì thêm. Đã đạt đồng thuận", "Loại tính năng mới khỏi release hiện tại vì chưa đạt đồng thuận"]}, {"id": "OFF-AX21", "set": "AX", "n": 21, "c": 5, "lo": "FL-5.1.6", "k": "K1", "b": [["p", "Which of the following is TRUE regarding the test pyramid?"]], "fig": null, "after": null, "o": ["It emphasizes having far more tests at the lower test levels", "It suggests that each low-level test checks a large part of the functionality", "It describes distribution of test types across the SDLC", "It has no impact on the construction of automated tests"], "a": [0], "e": "Test pyramid nhấn mạnh có nhiều test hơn ở các level thấp. Test tầng thấp nhỏ và tập trung, không kiểm tra phần lớn chức năng; mô hình này hỗ trợ việc tự động hóa.", "vq": "Điều nào sau đây ĐÚNG về test pyramid?", "vo": ["Nó nhấn mạnh việc có nhiều test hơn hẳn ở các test level thấp", "Nó gợi ý mỗi test ở tầng thấp kiểm tra một phần lớn chức năng", "Nó mô tả sự phân bố các test type trong SDLC", "Nó không ảnh hưởng đến việc xây dựng automated test"]}, {"id": "OFF-AX22", "set": "AX", "n": 22, "c": 5, "lo": "FL-5.2.1", "k": "K1", "b": [["p", "During risk analysis the team considered the following risk: “The system allows too high a discount for a customer”. The team estimated the risk impact to be very high."], ["p", "What can one say about the risk likelihood?"]], "fig": null, "after": null, "o": ["It is also very high. High risk impact always implies high risk likelihood", "It is very low. High risk impact always implies low risk likelihood", "One cannot say anything about risk likelihood. Risk impact and risk likelihood are independent.", "Risk likelihood is not important with such a high-risk impact. One does not need to define it."], "a": [2], "e": "Risk impact và risk likelihood độc lập nhau, nên không thể suy ra likelihood từ impact. Cả hai đều cần để xác định risk level.", "vq": "Trong phân tích rủi ro, team xem xét rủi ro: \"Hệ thống cho phép giảm giá quá cao cho khách hàng\". Team ước lượng risk impact là rất cao.\n\nCó thể nói gì về risk likelihood?", "vo": ["Cũng rất cao. Impact cao luôn kéo theo likelihood cao", "Rất thấp. Impact cao luôn kéo theo likelihood thấp", "Không thể nói gì về likelihood. Risk impact và risk likelihood độc lập nhau", "Likelihood không quan trọng khi impact cao như vậy. Không cần xác định nó"]}, {"id": "OFF-AX23", "set": "AX", "n": 23, "c": 5, "lo": "FL-5.2.2", "k": "K2", "b": [["p", "The following list contains risks that have been identified for a new software product to be developed:"], ["list", ["i. Management moves two experienced testers to another project", "ii. The system does not comply with security standards", "iii. System response time exceeds user requirements", "iv. Stakeholders have inaccurate expectations", "v. Disabled people have problems when using the system"]], ["p", "Which of them are project risks?"]], "fig": null, "after": null, "o": ["i, iv are project risks", "iv, v are project risks", "i, iii are project risks", "ii, v are project risks"], "a": [0], "e": "Project risk: rút tester khỏi dự án (i), stakeholder kỳ vọng không chính xác (iv). Không đạt chuẩn bảo mật, thời gian phản hồi, khó dùng với người khuyết tật là product risk.", "vq": "Danh sách sau gồm các rủi ro được xác định cho một sản phẩm phần mềm mới sắp phát triển:\ni. Ban quản lý chuyển hai tester có kinh nghiệm sang dự án khác\nii. Hệ thống không tuân thủ các tiêu chuẩn bảo mật\niii. Thời gian phản hồi của hệ thống vượt yêu cầu người dùng\niv. Stakeholder có kỳ vọng không chính xác\nv. Người khuyết tật gặp khó khăn khi dùng hệ thống\n\nNhững rủi ro nào là project risk?", "vo": ["i, iv là project risk", "iv, v là project risk", "i, iii là project risk", "ii, v là project risk"]}, {"id": "OFF-AX24", "set": "AX", "n": 24, "c": 5, "lo": "FL-5.2.3", "k": "K2", "b": [["p", "Which of the following is an example of how product risk analysis influences thoroughness and scope of testing?"]], "fig": null, "after": null, "o": ["The test manager monitors and reports the level of all known risks on a daily basis so the stakeholders can make an informed decision on the release date", "One of the identified risks was \"Lack of support of open-source databases\", so the team decided to integrate the system with an open-source database", "During the quantitative risk analysis, the team estimated the total level of all identified risks and reported it as the total residual risk before testing", "Risk assessment revealed a very high level of performance risks, so it was decided to perform detailed performance efficiency testing early in the SDLC"], "a": [3], "e": "Rủi ro hiệu năng rất cao dẫn đến quyết định test hiệu năng chi tiết và sớm → risk analysis ảnh hưởng đến độ kỹ lưỡng và phạm vi test. Các lựa chọn khác là risk monitoring, quyết định kiến trúc, hay báo cáo tổng rủi ro.", "vq": "Đâu là ví dụ về cách product risk analysis ảnh hưởng đến độ kỹ lưỡng và phạm vi test?", "vo": ["Test manager theo dõi và báo cáo mức của mọi rủi ro đã biết hằng ngày để stakeholder quyết định ngày release", "Một rủi ro được xác định là \"Thiếu hỗ trợ database mã nguồn mở\", nên team quyết định tích hợp hệ thống với một database mã nguồn mở", "Trong phân tích rủi ro định lượng, team ước tính tổng mức của mọi rủi ro đã xác định và báo cáo nó như tổng residual risk trước khi test", "Đánh giá rủi ro cho thấy rủi ro hiệu năng rất cao, nên quyết định thực hiện performance efficiency testing chi tiết từ sớm trong SDLC"]}, {"id": "OFF-AX25", "set": "AX", "n": 25, "c": 5, "lo": "FL-5.3.1", "k": "K1", "b": [["p", "Which TWO of the following options are common metrics used for reporting on the quality level of the test object?"]], "fig": null, "after": null, "o": ["Number of defects found during system testing", "Total effort on test design divided by the number of designed test cases", "Number of executed test procedures", "Number of defects found divided by the size of a work product", "Time needed to repair a defect"], "a": [0, 3], "e": "Metric về chất lượng test object: số defect tìm được (a) và defect density (d). Effort/test case là hiệu suất test; số test procedure đã chạy không nói lên chất lượng; thời gian sửa lỗi là metric quy trình.", "vq": "HAI lựa chọn nào sau đây là metric phổ biến để báo cáo mức chất lượng của test object?", "vo": ["Số defect tìm được trong system testing", "Tổng effort thiết kế test chia cho số test case đã thiết kế", "Số test procedure đã thực thi", "Số defect tìm được chia cho kích thước của work product", "Thời gian cần để sửa một defect"]}, {"id": "OFF-AX26", "set": "AX", "n": 26, "c": 5, "lo": "FL-5.3.2", "k": "K2", "b": [["p", "Which of the following pieces of information contained in a test progress report is the LEAST useful for business representatives?"]], "fig": null, "after": null, "o": ["Impediments to testing", "Branch coverage achieved", "Test progress", "New risks within the test cycle"], "a": [1], "e": "Branch coverage là metric kỹ thuật, ít giá trị với business. Trở ngại, tiến độ và rủi ro mới đều hữu ích cho họ.", "vq": "Thông tin nào trong test progress report ÍT hữu ích NHẤT đối với đại diện nghiệp vụ?", "vo": ["Các trở ngại đối với việc test", "Branch coverage đã đạt", "Tiến độ test", "Các rủi ro mới trong chu kỳ test"]}, {"id": "OFF-B1", "set": "B", "n": 1, "c": 1, "lo": "FL-1.2.1", "k": "K2", "b": [["p", "Which of the following is an example of why testing is necessary?"]], "fig": null, "after": null, "o": ["Dynamic testing increases quality by causing test objects to fail in ways that could never be achieved by the users", "Static testing is used by developers to identify failures in their code earlier than can be achieved through dynamic testing", "Static analysis provides evidence to customers that the elements of the system that provide no outputs are fit for release", "Reviews increase the quality of requirements specifications and lead to fewer changes being needed in derived work products"], "a": [3], "e": "Review giúp nâng chất lượng đặc tả yêu cầu từ sớm, nhờ đó các work product dẫn xuất (thiết kế, code) ít phải sửa. Static testing tìm defect, không tìm failure (b sai vì chữ \"failures\").", "vq": "Điều nào sau đây là ví dụ cho lý do vì sao testing là cần thiết?", "vo": ["Dynamic testing nâng cao chất lượng bằng cách làm test object fail theo những cách mà người dùng không bao giờ gặp", "Static testing được developer dùng để xác định failure trong code sớm hơn so với dynamic testing", "Static analysis cung cấp bằng chứng cho khách hàng rằng các phần của hệ thống không tạo output nào đã sẵn sàng để release", "Review nâng cao chất lượng đặc tả yêu cầu và giúp các work product dẫn xuất ít phải thay đổi hơn"]}, {"id": "OFF-B2", "set": "B", "n": 2, "c": 1, "lo": "FL-1.2.2", "k": "K1", "b": [["p", "Which of the following statements about quality assurance (QA) and/or quality control (QC) is correct?"]], "fig": null, "after": null, "o": ["QA is performed as part of testing", "Testing is performed as part of QC", "Testing is another term for QC", "Testing is performed as part of QA"], "a": [1], "e": "Testing là một phần của QC (hướng sản phẩm, tìm defect). QA hướng quy trình, phòng ngừa. QC còn gồm các kỹ thuật khác ngoài testing, nên testing không phải là tên khác của QC.", "vq": "Phát biểu nào sau đây về quality assurance (QA) và/hoặc quality control (QC) là đúng?", "vo": ["QA được thực hiện như một phần của testing", "Testing được thực hiện như một phần của QC", "Testing là một tên gọi khác của QC", "Testing được thực hiện như một phần của QA"]}, {"id": "OFF-B3", "set": "B", "n": 3, "c": 1, "lo": "FL-1.3.1", "k": "K2", "b": [["p", "One of the ‘principles of testing’ states that exhaustive testing is impossible. Which of the following is an example of addressing this principle in practice?"]], "fig": null, "after": null, "o": ["Creating test cases that cover every possible specified output", "Documenting all possible test input variations and prioritizing these based on importance", "Starting testing as early as possible with reviews and other static testing approaches", "Using equivalence partitioning and boundary value analysis to generate test cases"], "a": [3], "e": "Dùng EP và BVA là cách có hệ thống để chọn một tập con hữu hạn trong vô số test case có thể → xử lý nguyên tắc \"exhaustive testing is impossible\". Liệt kê mọi biến thể input là bất khả thi.", "vq": "Một trong các nguyên tắc kiểm thử nói rằng không thể test toàn bộ (exhaustive testing is impossible). Đâu là ví dụ về cách áp dụng nguyên tắc này trong thực tế?", "vo": ["Tạo test case bao phủ mọi output có thể được đặc tả", "Ghi lại mọi biến thể input có thể có và ưu tiên chúng theo mức độ quan trọng", "Bắt đầu test càng sớm càng tốt bằng review và các cách static testing khác", "Dùng equivalence partitioning và boundary value analysis để tạo test case"]}, {"id": "OFF-B4", "set": "B", "n": 4, "c": 1, "lo": "FL-1.4.1", "k": "K2", "b": [["p", "Which test activity involves working with test data requirements, test conditions, test environment requirements and test cases?"]], "fig": null, "after": null, "o": ["Test design", "Test execution", "Test analysis", "Test implementation"], "a": [0], "e": "Test design dùng test condition để tạo test case, đồng thời xác định test data requirements và test environment requirements.", "vq": "Hoạt động test nào làm việc với test data requirements, test condition, test environment requirements và test case?", "vo": ["Test design", "Test execution", "Test analysis", "Test implementation"]}, {"id": "OFF-B5", "set": "B", "n": 5, "c": 1, "lo": "FL-1.4.2", "k": "K2", "b": [["p", "Which of the following is MOST likely to impact how testing is performed for a given test object?"]], "fig": null, "after": null, "o": ["The average level of experience of the organization’s marketing team", "The knowledge of users that a new system is being developed for them", "The number of years’ experience of the members of the test team", "The end user’s organizational structure for a commercial music streaming application"], "a": [2], "e": "Số năm kinh nghiệm của đội test ảnh hưởng trực tiếp đến năng lực và kiến thức họ áp dụng khi test. Các yếu tố còn lại hầu như không ảnh hưởng đến cách test.", "vq": "Yếu tố nào sau đây CÓ KHẢ NĂNG NHẤT ảnh hưởng đến cách test được thực hiện cho một test object?", "vo": ["Mức kinh nghiệm trung bình của đội marketing trong tổ chức", "Việc người dùng biết rằng một hệ thống mới đang được phát triển cho họ", "Số năm kinh nghiệm của các thành viên đội test", "Cơ cấu tổ chức của end user đối với một ứng dụng nghe nhạc trực tuyến thương mại"]}, {"id": "OFF-B6", "set": "B", "n": 6, "c": 1, "lo": "FL-1.4.4", "k": "K2", "b": [["p", "Which of the following statements is a CORRECT example of the value of traceability?"]], "fig": null, "after": null, "o": ["Traceability between the mitigated risks and test cases that passed provides a means of determining the level of residual risk", "Traceability between user requirements and test results provides a means of measuring project progress against business goals", "Traceability between testers and test cases that failed provides a means of determining the skill level of the testers", "Traceability between the identified risks and written test conditions provides a means of determining which risks are worth testing"], "a": [1], "e": "Traceability giữa yêu cầu người dùng và kết quả test cho biết yêu cầu nào đã được test → đo tiến độ so với mục tiêu kinh doanh. Để đánh giá residual risk cần traceability giữa TẤT CẢ rủi ro và kết quả test.", "vq": "Phát biểu nào sau đây là ví dụ ĐÚNG về giá trị của traceability?", "vo": ["Traceability giữa các rủi ro đã giảm thiểu và các test case đã pass là phương tiện để xác định mức residual risk", "Traceability giữa yêu cầu người dùng và kết quả test là phương tiện để đo tiến độ dự án so với mục tiêu kinh doanh", "Traceability giữa tester và các test case bị fail là phương tiện để xác định trình độ kỹ năng của tester", "Traceability giữa các rủi ro đã xác định và các test condition đã viết là phương tiện để xác định rủi ro nào đáng để test"]}, {"id": "OFF-B7", "set": "B", "n": 7, "c": 1, "lo": "FL-1.5.1", "k": "K2", "b": [["p", "Which of the following is MOST likely to be an example of a tester using a generic skill when testing?"]], "fig": null, "after": null, "o": ["The tester’s deep knowledge of a variety of computer games meant that they got on well with one of the developers who was also into gaming", "The tester was a former pilot and was better able to understand the acceptance criteria for the helicopter control system", "The tester previously worked as a programmer and used their skills in this area to better communicate with the business analysts", "The tester was very careful not to make mistakes when they methodically generated test cases prior to starting their exploratory testing session"], "a": [1], "e": "Domain knowledge là kỹ năng chung (generic skill) giúp tester hiểu người dùng và business. Cựu phi công hiểu tốt hơn acceptance criteria của hệ thống điều khiển trực thăng.", "vq": "Đâu CÓ KHẢ NĂNG NHẤT là ví dụ về một tester dùng kỹ năng chung (generic skill) khi test?", "vo": ["Hiểu biết sâu về nhiều trò chơi điện tử giúp tester thân thiết với một developer cũng mê game", "Tester từng là phi công nên hiểu tốt hơn các acceptance criteria của hệ thống điều khiển trực thăng", "Tester từng là lập trình viên và dùng kỹ năng đó để giao tiếp tốt hơn với business analyst", "Tester rất cẩn thận để không mắc lỗi khi tạo test case một cách có phương pháp trước khi bắt đầu session exploratory testing"]}, {"id": "OFF-B8", "set": "B", "n": 8, "c": 1, "lo": "FL-1.5.2", "k": "K1", "b": [["p", "Which of the following is an advantage of the whole-team approach?"]], "fig": null, "after": null, "o": ["It allows team members to take on any role at any time", "It only needs a single team to support the complete development project", "It embeds business representatives alongside developers in the same team", "It generates a team synergy that benefits the entire project"], "a": [3], "e": "Whole-team approach tạo sức mạnh tổng hợp (synergy) có lợi cho cả dự án. Không có nghĩa ai cũng đảm nhận mọi vai trò bất cứ lúc nào.", "vq": "Điều nào sau đây là ưu điểm của whole-team approach?", "vo": ["Cho phép các thành viên đảm nhận bất kỳ vai trò nào vào bất kỳ lúc nào", "Chỉ cần một team duy nhất để hỗ trợ toàn bộ dự án phát triển", "Đưa đại diện nghiệp vụ vào làm cùng developer trong một team", "Tạo ra sức mạnh tổng hợp (synergy) của team, có lợi cho toàn bộ dự án"]}, {"id": "OFF-B9", "set": "B", "n": 9, "c": 2, "lo": "FL-2.1.1", "k": "K2", "b": [["p", "Which of the following statements about the chosen software development lifecycle is CORRECT?"]], "fig": null, "after": null, "o": ["If agile software development is used, automation of system tests replaces the need for regression testing", "If a sequential development model is used, then the dynamic testing is typically restricted to later in the lifecycle", "If an iterative development model is used, then component testing is typically performed manually by developers", "If an incremental development model is used, then static testing is done in early increments and dynamic testing in later increments"], "a": [1], "e": "Trong mô hình tuần tự, giai đoạn đầu chưa có code nên dynamic testing thường diễn ra muộn hơn. Tự động hóa system test không thay thế regression testing.", "vq": "Phát biểu nào sau đây về mô hình SDLC được chọn là ĐÚNG?", "vo": ["Nếu dùng agile, tự động hóa system test sẽ thay thế nhu cầu regression testing", "Nếu dùng mô hình tuần tự, dynamic testing thường chỉ diễn ra ở giai đoạn sau của vòng đời", "Nếu dùng mô hình lặp, component testing thường được developer thực hiện thủ công", "Nếu dùng mô hình tăng dần, static testing được làm ở các increment đầu và dynamic testing ở các increment sau"]}, {"id": "OFF-B10", "set": "B", "n": 10, "c": 2, "lo": "FL-2.1.2", "k": "K1", "b": [["p", "Which of the following is a good testing practice that applies to all software development lifecycles?"]], "fig": null, "after": null, "o": ["Testers should review work products as part of the next development phase", "Testers should review work products as soon as drafts are available", "Testers should review work products before test analysis and test design begin", "Testers should review work products immediately after they are published"], "a": [1], "e": "Tester nên review work product ngay khi có bản nháp để hỗ trợ shift-left, tránh làm tiếp trên tài liệu có lỗi.", "vq": "Đâu là một good practice về testing áp dụng cho mọi vòng đời phát triển phần mềm?", "vo": ["Tester nên review work product như một phần của giai đoạn phát triển tiếp theo", "Tester nên review work product ngay khi có bản nháp", "Tester nên review work product trước khi bắt đầu test analysis và test design", "Tester nên review work product ngay sau khi chúng được công bố"]}, {"id": "OFF-B11", "set": "B", "n": 11, "c": 2, "lo": "FL-2.1.3", "k": "K1", "b": [["p", "Which of the following is an example of a test-first approach to development?"]], "fig": null, "after": null, "o": ["Test-Driven Development", "Coverage-Driven Development", "Quality-Driven Development", "Feature-Driven Development"], "a": [0], "e": "TDD là ví dụ điển hình của test-first. Coverage-Driven và Quality-Driven Development không tồn tại như cách tiếp cận test-first; Feature-Driven Development là phương pháp agile.", "vq": "Đâu là ví dụ về cách tiếp cận phát triển test-first?", "vo": ["Test-Driven Development", "Coverage-Driven Development", "Quality-Driven Development", "Feature-Driven Development"]}, {"id": "OFF-B12", "set": "B", "n": 12, "c": 2, "lo": "FL-2.1.4", "k": "K2", "b": [["p", "Which of the following statements about DevOps is CORRECT?"]], "fig": null, "after": null, "o": ["To speed up releases, continuous integration is used to encourage developers to submit code quickly without the need to complete component testing", "To be able to update and release systems on a more frequent basis, many automated regression tests are required to reduce the risk of regression", "To treat both developers and operations equally, the testers will allocate more effort to release testing by operations using a shift-right approach", "To create increased synergy between testers, developers and operations, the testing must become fully automated with no manual testing"], "a": [1], "e": "Để release thường xuyên hơn, cần nhiều regression test tự động để giảm rủi ro hồi quy. CI yêu cầu developer nộp code kèm component test; manual testing vẫn cần.", "vq": "Phát biểu nào sau đây về DevOps là ĐÚNG?", "vo": ["Để tăng tốc release, continuous integration được dùng để khuyến khích developer nộp code nhanh mà không cần hoàn thành component testing", "Để có thể cập nhật và release hệ thống thường xuyên hơn, cần nhiều automated regression test để giảm rủi ro regression", "Để đối xử công bằng giữa developer và operations, tester sẽ dành nhiều công sức hơn cho release testing bởi operations theo cách tiếp cận shift-right", "Để tăng sức mạnh tổng hợp giữa tester, developer và operations, testing phải được tự động hóa hoàn toàn, không còn manual testing"]}, {"id": "OFF-B13", "set": "B", "n": 13, "c": 2, "lo": "FL-2.2.1", "k": "K2", "b": [["p", "Which of the following is MOST likely to be performed as part of system testing?"]], "fig": null, "after": null, "o": ["Security testing of a credit management system by an independent test team", "Testing the interface of a currency exchange system with an external banking system", "Beta testing of a remote learning system by courseware developers", "Testing interactions between the user interface and database of a human resources system"], "a": [0], "e": "Security testing do đội test độc lập thực hiện là non-functional testing ở system testing. Interface với hệ thống ngân hàng bên ngoài là system integration; UI và database là component integration; beta testing là acceptance testing.", "vq": "Hoạt động nào sau đây CÓ KHẢ NĂNG NHẤT được thực hiện như một phần của system testing?", "vo": ["Security testing của hệ thống quản lý tín dụng bởi một đội test độc lập", "Test giao diện giữa hệ thống đổi ngoại tệ với một hệ thống ngân hàng bên ngoài", "Beta testing hệ thống học trực tuyến bởi những người phát triển học liệu", "Test tương tác giữa giao diện người dùng và database của hệ thống nhân sự"]}, {"id": "OFF-B14", "set": "B", "n": 14, "c": 2, "lo": "FL-2.2.3", "k": "K2", "b": [["p", "Which of the following statements is CORRECT?"]], "fig": null, "after": null, "o": ["Regression tests increase in number as the project progresses, whereas the number of confirmation tests decreases as the project progresses", "Regression tests are created and run when the test object is fixed, whereas confirmation tests are run whenever the test object is enhanced", "Regression testing is concerned with checking that the operational environment remains unchanged, whereas confirmation testing is concerned with testing changes to the test object", "Regression testing is concerned with adverse effects in unchanged code, whereas confirmation testing is concerned with testing changed code"], "a": [3], "e": "Regression testing kiểm tra ảnh hưởng xấu lên phần code không đổi; confirmation testing kiểm tra phần code đã thay đổi (bản sửa). Cả hai loại đều tăng theo thời gian dự án.", "vq": "Phát biểu nào sau đây là ĐÚNG?", "vo": ["Regression test tăng về số lượng khi dự án tiến triển, còn số confirmation test thì giảm dần", "Regression test được tạo và chạy khi test object được sửa, còn confirmation test được chạy mỗi khi test object được nâng cấp", "Regression testing kiểm tra môi trường vận hành không thay đổi, còn confirmation testing kiểm tra các thay đổi của test object", "Regression testing quan tâm đến ảnh hưởng xấu lên phần code không thay đổi, còn confirmation testing kiểm tra phần code đã thay đổi"]}, {"id": "OFF-B15", "set": "B", "n": 15, "c": 3, "lo": "FL-3.1.3", "k": "K2", "b": [["p", "Which of the following is an example of a defect that can be found by static testing but NOT by dynamic testing?"]], "fig": null, "after": null, "o": ["Lack of usability provided through the user interface", "Code with no path that reaches it", "Poor response times for most of the expected users", "Required features that are not implemented in the code"], "a": [1], "e": "Code không có đường nào chạy tới (unreachable) chỉ phát hiện được bằng static testing (review/static analysis). Dynamic test chỉ chạy được code có thể chạy tới.", "vq": "Đâu là ví dụ về defect có thể tìm được bằng static testing nhưng KHÔNG thể bằng dynamic testing?", "vo": ["Giao diện người dùng thiếu tính dễ dùng (usability)", "Đoạn code không có đường đi nào dẫn tới", "Thời gian phản hồi kém với phần lớn người dùng dự kiến", "Các tính năng bắt buộc chưa được hiện thực trong code"]}, {"id": "OFF-B16", "set": "B", "n": 16, "c": 3, "lo": "FL-3.2.1", "k": "K1", "b": [["p", "Which of the following is a benefit of early and frequent stakeholder feedback?"]], "fig": null, "after": null, "o": ["Managers are aware of which developers are less productive", "It allows project managers to prioritize their stakeholder interactions", "It facilitates early communication of potential quality issues", "End users better understand why the delivery of the work product is delayed"], "a": [2], "e": "Feedback sớm và thường xuyên từ stakeholder giúp trao đổi sớm về vấn đề chất lượng tiềm ẩn.", "vq": "Điều nào sau đây là lợi ích của phản hồi sớm và thường xuyên từ stakeholder?", "vo": ["Quản lý biết developer nào làm việc kém năng suất", "Giúp project manager ưu tiên việc tương tác với các stakeholder", "Tạo điều kiện trao đổi sớm về các vấn đề chất lượng tiềm ẩn", "End user hiểu rõ hơn vì sao việc giao work product bị chậm"]}, {"id": "OFF-B17", "set": "B", "n": 17, "c": 3, "lo": "FL-3.2.2", "k": "K2", "b": [["p", "Given the following task descriptions:"], ["list", ["1. The quality characteristics to be evaluated and the exit criteria are selected", "2. Everyone has access to the work product", "3. Anomalies are identified in the work product", "4. Anomalies are discussed"]], ["p", "And the following review activities"], ["list", ["A. Individual review", "B. Review initiation", "C. Planning", "D. Communication and analysis"]], ["p", "Which of the following BEST matches the task descriptions and activities?"]], "fig": null, "after": null, "o": ["1B, 2C, 3D, 4A", "1B, 2D, 3C, 4A", "1C, 2A, 3B, 4D", "1C, 2B, 3A, 4D"], "a": [3], "e": "Chọn đặc tính chất lượng và exit criteria → Planning (1C). Mọi người có quyền truy cập work product → Review initiation (2B). Tìm anomaly → Individual review (3A). Thảo luận anomaly → Communication and analysis (4D).", "vq": "Cho các mô tả công việc:\n1. Chọn các đặc tính chất lượng cần đánh giá và exit criteria\n2. Mọi người đều có quyền truy cập work product\n3. Xác định các anomaly trong work product\n4. Thảo luận các anomaly\n\nVà các hoạt động review:\nA. Individual review\nB. Review initiation\nC. Planning\nD. Communication and analysis\n\nLựa chọn nào ghép đúng NHẤT mô tả công việc với hoạt động?", "vo": ["1B, 2C, 3D, 4A", "1B, 2D, 3C, 4A", "1C, 2A, 3B, 4D", "1C, 2B, 3A, 4D"]}, {"id": "OFF-B18", "set": "B", "n": 18, "c": 3, "lo": "FL-3.2.3", "k": "K1", "b": [["p", "Given the following roles in reviews:"], ["list", ["1. Scribe", "2. Review leader", "3. Facilitator", "4. Manager"]], ["p", "And the following responsibilities in reviews:"], ["list", ["A. Ensures the effective running of review meetings and the setting up a safe review environment", "B. Records review information, such as decisions and new anomalies found during the review meeting", "C. Decides what is to be reviewed and provides resources, such as staff and time for the review", "D. Takes overall responsibility for the review such as organizing when and where the review will take place"]], ["p", "Which of the following BEST matches the roles and responsibilities?"]], "fig": null, "after": null, "o": ["1A, 2B, 3D, 4C", "1A, 2C, 3B, 4D", "1B, 2D, 3A, 4C", "1B, 2D, 3C, 4A"], "a": [2], "e": "Scribe ghi thông tin (1B); review leader chịu trách nhiệm tổng thể (2D); facilitator đảm bảo cuộc họp hiệu quả, an toàn (3A); manager quyết định review gì và cấp nguồn lực (4C).", "vq": "Cho các vai trò trong review:\n1. Scribe\n2. Review leader\n3. Facilitator\n4. Manager\n\nVà các trách nhiệm:\nA. Đảm bảo các buổi họp review diễn ra hiệu quả và tạo môi trường review an toàn\nB. Ghi lại thông tin review, như các quyết định và anomaly mới tìm thấy trong buổi họp\nC. Quyết định cái gì được review và cung cấp nguồn lực như nhân sự, thời gian\nD. Chịu trách nhiệm tổng thể cho buổi review, như tổ chức thời gian và địa điểm\n\nLựa chọn nào ghép đúng NHẤT vai trò với trách nhiệm?", "vo": ["1A, 2B, 3D, 4C", "1A, 2C, 3B, 4D", "1B, 2D, 3A, 4C", "1B, 2D, 3C, 4A"]}, {"id": "OFF-B19", "set": "B", "n": 19, "c": 4, "lo": "FL-4.1.1", "k": "K2", "b": [["p", "Which of the following statements BEST describes the difference between decision table testing and branch testing?"]], "fig": null, "after": null, "o": ["In decision table testing, the test cases are derived from the decision statements in the code. In branch testing, the test cases are derived from knowledge of the control flow of the test object.", "In decision table testing, the test cases are derived from the specification that describes the business logic. In branch testing the test cases are based on anticipation of potential defects in the source code.", "In decision table testing, the test cases are derived from knowledge of the control flow of the test object. In branch testing, test cases are derived from the specification that describes the business logic.", "In decision table testing, the test cases are independent of how the software is implemented. In branch testing, test cases can be created only after the design or implementation of the code."], "a": [3], "e": "Decision table testing là black-box nên độc lập với cách hiện thực. Branch testing là white-box nên chỉ tạo test được khi đã có thiết kế hoặc code.", "vq": "Phát biểu nào mô tả TỐT NHẤT sự khác biệt giữa decision table testing và branch testing?", "vo": ["Trong decision table testing, test case được suy ra từ các câu lệnh quyết định trong code. Trong branch testing, test case được suy ra từ hiểu biết về luồng điều khiển của test object.", "Trong decision table testing, test case được suy ra từ đặc tả mô tả logic nghiệp vụ. Trong branch testing, test case dựa trên việc dự đoán các defect tiềm ẩn trong source code.", "Trong decision table testing, test case được suy ra từ hiểu biết về luồng điều khiển của test object. Trong branch testing, test case được suy ra từ đặc tả mô tả logic nghiệp vụ.", "Trong decision table testing, test case không phụ thuộc vào cách phần mềm được hiện thực. Trong branch testing, test case chỉ tạo được sau khi đã có thiết kế hoặc code."]}, {"id": "OFF-B20", "set": "B", "n": 20, "c": 4, "lo": "FL-4.2.1", "k": "K3", "b": [["p", "Customers of the TestWash car wash chain have cards with a record of the number of washes they have bought so far. The initial value is 0. After entering the car wash, the system increases the number on the card by one. This value represents the number of the current wash. Based on this number the system decides what discount the customer is entitled to."], ["p", "For every tenth wash the system gives a 10% discount, and for every twentieth wash, the system gives a further 40% discount (i.e., a 50% discount in total)."], ["p", "Which of the following sets of input data (understood as the numbers of the current wash) achieves the highest equivalence partition coverage?"]], "fig": null, "after": null, "o": ["19, 20, 30", "11, 12, 20", "1, 10, 50", "10, 29, 30, 31"], "a": [0], "e": "Có 3 partition: không giảm, giảm 10% (lần thứ 10, 30…), giảm 50% (lần thứ 20, 40…). Bộ 19, 20, 30 phủ cả 3. Lưu ý 50 là lần thứ 50 → chỉ giảm 10%.", "vq": "Khách hàng của chuỗi rửa xe TestWash có thẻ ghi số lần rửa đã mua. Giá trị ban đầu là 0. Khi xe vào rửa, hệ thống tăng số trên thẻ thêm 1. Giá trị này là số thứ tự của lần rửa hiện tại. Dựa vào số này, hệ thống quyết định mức giảm giá khách được hưởng.\n\nCứ mỗi lần rửa thứ mười, hệ thống giảm 10%; cứ mỗi lần rửa thứ hai mươi, hệ thống giảm thêm 40% (tức tổng cộng 50%).\n\nBộ dữ liệu input nào (hiểu là số thứ tự của lần rửa hiện tại) đạt equivalence partition coverage cao nhất?", "vo": ["19, 20, 30", "11, 12, 20", "1, 10, 50", "10, 29, 30, 31"]}, {"id": "OFF-B21", "set": "B", "n": 21, "c": 4, "lo": "FL-4.2.2", "k": "K3", "b": [["p", "You are testing a form that verifies the correctness of the length of the password given as input. The form accepts a password with the correct length and rejects a password that is too short or too long. The password length is correct if it has between 6 and 12 characters inclusive. Otherwise, it is considered incorrect."], ["p", "At first, the form is empty (password length = 0). You apply boundary value analysis to the “password length” variable."], ["p", "Your set of test cases achieves 100% 2-value boundary value coverage. The team decided that due to the high risk of this component, test cases should be added to ensure 100% 3-value boundary value coverage."], ["p", "Which additional password lengths should be tested to achieve this?"]], "fig": null, "after": null, "o": ["4, 5, 13, 14", "7, 11", "1, 5, 13", "1, 4, 7, 11, 14"], "a": [3], "e": "Partition: 0–5, 6–12, ≥13. 3-value BVA cần 0, 1, 4, 5, 6, 7, 11, 12, 13, 14. 2-value đã có 0, 5, 6, 12, 13 → cần thêm 1, 4, 7, 11, 14.", "vq": "Bạn đang test một form kiểm tra độ dài mật khẩu. Form chấp nhận mật khẩu có độ dài đúng và từ chối mật khẩu quá ngắn hoặc quá dài. Độ dài đúng là từ 6 đến 12 ký tự (tính cả hai đầu). Ngoài khoảng đó là sai.\n\nBan đầu form trống (độ dài = 0). Bạn áp dụng boundary value analysis cho biến \"độ dài mật khẩu\".\n\nBộ test case của bạn đã đạt 100% 2-value boundary value coverage. Do component này có rủi ro cao, team quyết định bổ sung test case để đạt 100% 3-value boundary value coverage.\n\nCần test thêm những độ dài mật khẩu nào?", "vo": ["4, 5, 13, 14", "7, 11", "1, 5, 13", "1, 4, 7, 11, 14"]}, {"id": "OFF-B22", "set": "B", "n": 22, "c": 4, "lo": "FL-4.2.3", "k": "K3", "b": [["p", "The following decision table contains the rules for determining the risk of atherosclerosis."]], "fig": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABCQAAAEsCAAAAAA+lj0fAAA8+UlEQVR42u2dd0BWZfvHPw/bCSpDRRTEhaCImrm3OVJzZbkyrV4balb+0uxt26uV2bBhqWWKlmlKmkrlIPfKPXAh7lQUVFRA4Pr9cZ4HHoYGyBC4Pn/Ava9z3+ec73Ovc45JUBRFuTM22gSKoqhIKIqiIqEoioqEoigqEoqiqEgoiqIioSiKioSiKMUEO+OfSVtCUfKdwrGV0a5QHW1+YBK1rbbzybYONxRFKQKoSCiKoiKhKIqKhKIoKhKKoqhIKIqiIqEoioqEoihFCDttguywu7fZ4eLb5IVSGaLfmjPu2bvk/mbR7zYFYvvsgl0x3vWGlCgI27tXHIqr3aZTQbU5J0Y0e6cAbC+ONjt6ly/8l72IiIj5n/IvTbHFquU8/s4QPZLJd8tdm8QCsT3buLy9w/LfdvJYWwA6xxRQmye2oFdBtLlris7k1Pb9g/YkssveskDShbBJFwbvcsxWzo8PF4zttcOTWw4PPDjxcN/9FfPb9twpvNDNbd27v784u0DanP9tLJA2vxpl19JwldbhRvGjqjNA9WaeQw9tb5n1bCv3Ld1YQLYnJrdf7kTDPg0Pvz4rv22P56Ox8ECd7j+875nvbQ5sfbdg2vw4NdbqxGWxp5+JfXcexB0/kZQ2pNu4jQVk++oaPnICSr7Ghvy2feZ8ydEAD5djb/63OcQOth9YIOf7GDVRkSj2lHAEWOD3KgB7/HqmRp3rXb5GdZcxl62TBwcHf1gwts9g1wCAOhxLymfbh+2qOZg73Vdyrd4n/Noa3kC/mLu2Obx47IO6udrmWbV9XEVCgfA4giAm/DwAceEnUmI2NgiRdkFxn7U8Z5V80KBBPQvGdoWZs42zfBRP23
