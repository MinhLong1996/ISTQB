nsitions coverage?"]], "o": ["Add, Remove, Add, Add, Add", "Add, Add, Add, Add, Remove, Remove", "Add, Add, Add, Remove, Remove", "Add, Add, Add, Remove, Add"], "a": [2], "e": "Có 5 valid transition. Chuỗi c: Add (START→NOT FULL), Add (N<2, tự lặp), Add (N=2 → FULL), Remove (FULL→NOT FULL), Remove (N>0, tự lặp) → phủ đủ 5/5. Chuỗi b không khả thi vì không thể Add khi FULL.", "vq": "Một hệ thống lưu trữ chứa tối đa ba phần tử và được mô hình hóa bằng state transition diagram ở hình. Biến N là số phần tử đang được lưu.\n\nTest case nào dưới đây (biểu diễn dưới dạng chuỗi sự kiện) đạt mức valid transitions coverage cao nhất?", "vo": ["Add, Remove, Add, Add, Add", "Add, Add, Add, Add, Remove, Remove", "Add, Add, Add, Remove, Remove", "Add, Add, Add, Remove, Add"]}, {"id": "OFF-B24", "set": "B", "n": 24, "c": 4, "lo": "FL-4.3.1", "k": "K2", "b": [["p", "You run two test cases, T1 and T2, on the same code. Test T1 achieved 40% statement coverage and test T2 achieved 65% statement coverage."], ["p", "Which of the following sentences must be necessarily true?"]], "fig": null, "after": null, "o": ["The test suite composed of tests T1 and T2 achieves 105% statement coverage", "There exists at least one statement that must have been executed by both T1 and T2", "At least 5% of the statements in the code that was tested are non-executable", "The test suite composed of tests T1 and T2 achieves full branch coverage"], "a": [1], "e": "Coverage tối đa là 100%. Nếu T1 và T2 không chung statement nào thì tổng sẽ là 105%, điều không thể → phải có ít nhất một statement được cả hai chạy.", "vq": "Bạn chạy hai test case T1 và T2 trên cùng một đoạn code. T1 đạt 40% statement coverage và T2 đạt 65% statement coverage.\n\nCâu nào sau đây chắc chắn đúng?", "vo": ["Bộ test gồm T1 và T2 đạt 105% statement coverage", "Có ít nhất một statement đã được cả T1 và T2 thực thi", "Ít nhất 5% statement trong đoạn code được test là không thực thi được", "Bộ test gồm T1 và T2 đạt full branch coverage"]}, {"id": "OFF-B25", "set": "B", "n": 25, "c": 4, "lo": "FL-4.3.2", "k": "K2", "b": [["p", "Let the branch coverage metric be defined as BCov = (X / Y) * 100%."], ["p", "What do X and Y represent in this formula?"]], "fig": null, "after": null, "o": ["X = number of decision outcomes exercised by the test cases Y = total number of decision outcomes in the code", "X = number of conditional branches exercised by the test cases Y = total number of branches in the code", "X = number of branches exercised by the test cases Y = total number of branches in the code", "X = number of conditional branches exercised by the test cases Y = total number of decision outcomes in the code"], "a": [2], "e": "Branch coverage = số branch đã chạy / tổng số branch (tính cả branch có điều kiện và không điều kiện).", "vq": "Cho công thức branch coverage: BCov = (X / Y) * 100%.\n\nX và Y trong công thức là gì?", "vo": ["X = số decision outcome được test case chạy qua; Y = tổng số decision outcome trong code", "X = số branch có điều kiện được test case chạy qua; Y = tổng số branch trong code", "X = số branch được test case chạy qua; Y = tổng số branch trong code", "X = số branch có điều kiện được test case chạy qua; Y = tổng số decision outcome trong code"]}, {"id": "OFF-B26", "set": "B", "n": 26, "c": 4, "lo": "FL-4.4.2", "k": "K2", "b": [["p", "Which TWO of the following statements provide the BEST rationale for using exploratory testing?"]], "fig": null, "after": null, "o": ["Testers have not been allocated enough time for test design and test execution", "The existing test strategy requires that testers use formal, black-box test techniques", "The specification is written in a formal language that can be processed by a tool", "Testers are the members of an agile team and have good programming skills", "Testers are experienced in the business domain and have good analytical skills"], "a": [0, 4], "e": "Exploratory testing phù hợp khi thiếu thời gian (a) và khi tester có kinh nghiệm, domain knowledge, kỹ năng phân tích (e). Nó không phải kỹ thuật black-box formal; kỹ năng lập trình không liên quan.", "vq": "HAI phát biểu nào sau đây là lý do TỐT NHẤT để dùng exploratory testing?", "vo": ["Tester không được phân bổ đủ thời gian cho test design và test execution", "Test strategy hiện tại yêu cầu tester dùng các kỹ thuật black-box chính thức", "Đặc tả được viết bằng ngôn ngữ hình thức mà tool có thể xử lý", "Tester là thành viên agile team và có kỹ năng lập trình tốt", "Tester có kinh nghiệm trong lĩnh vực nghiệp vụ và có kỹ năng phân tích tốt"]}, {"id": "OFF-B27", "set": "B", "n": 27, "c": 4, "lo": "FL-4.4.3", "k": "K2", "b": [["p", "Which of the following BEST fits as an element of the checklist used in checklist-based testing?"]], "fig": null, "after": null, "o": ["“The developer made an error when implementing the code”", "“The achieved statement coverage exceeds 85%”", "“The program works correctly regarding functional and non-functional requirements”", "“The error messages are written in language that the user can understand”"], "a": [3], "e": "Checklist nên chứa test condition cụ thể, người kiểm tra được, như \"thông báo lỗi dễ hiểu với người dùng\". Mô tả lỗi của dev, exit criteria hay mục tiêu quá chung không phù hợp.", "vq": "Mục nào sau đây phù hợp NHẤT để làm một phần tử trong checklist của checklist-based testing?", "vo": ["\"Developer đã mắc lỗi khi hiện thực code\"", "\"Statement coverage đạt được vượt quá 85%\"", "\"Chương trình hoạt động đúng với các yêu cầu functional và non-functional\"", "\"Thông báo lỗi được viết bằng ngôn ngữ người dùng hiểu được\""]}, {"id": "OFF-B28", "set": "B", "n": 28, "c": 4, "lo": "FL-4.5.2", "k": "K2", "b": [["p", "Consider the following acceptance criteria for a user story written from the perspective of an online store owner."], ["quote", "Given that the user is logged in and on the homepage, When the user clicks on the \"Add Item\" button, Then the \"Create Item\" form should appear, And the user should be able to input a name and price for the new item."], ["p", "In what format is this acceptance criteria written?"]], "fig": null, "after": null, "o": ["Rule-oriented", "Scenario-oriented", "Product-oriented", "Process-oriented"], "a": [1], "e": "Given/When/Then là định dạng scenario-oriented. Rule-oriented là dạng danh sách hoặc bảng input–output; \"product-oriented\", \"process-oriented\" không tồn tại.", "vq": "Xét acceptance criteria sau của một user story viết từ góc nhìn chủ cửa hàng online:\nGiả sử người dùng đã đăng nhập và đang ở trang chủ,\nKhi người dùng nhấn nút \"Add Item\",\nThì form \"Create Item\" phải xuất hiện,\nVà người dùng có thể nhập tên và giá cho mặt hàng mới.\n\nAcceptance criteria này được viết theo định dạng nào?", "vo": ["Rule-oriented (hướng quy tắc)", "Scenario-oriented (hướng kịch bản)", "Product-oriented (hướng sản phẩm)", "Process-oriented (hướng quy trình)"]}, {"id": "OFF-B29", "set": "B", "n": 29, "c": 4, "lo": "FL-4.5.3", "k": "K3", "b": [["p", "Your team analyzes the following user story in order to define the acceptance criteria:"], ["quote", "As a registered customer, I want to be able to view my previous orders on the company's website, so that I can keep track of my purchases."], ["p", "Which of the following test cases will NOT be relevant for this user story?"]], "fig": null, "after": null, "o": ["Input: the customer logs into their account on the website and clicks the “see order history” button Expected result: the system shows a list of all the customer’s previous orders, including the date, order number, and total cost", "Input: the customer clicks on an order from the order list Expected result: the system displays the individual items purchased, along with their prices and quantities", "Input: the customer clicks “Sort ascending” button on the order history screen Expected result: the system shows the order history sorted by order number in ascending order", "Input: an unregistered customer registers as a new customer with a valid e-mail address that does not already exist in the customer database Expected result: the system accepts the registration and creates the account"], "a": [3], "e": "User story nói về xem lịch sử đơn hàng; test đăng ký tài khoản mới không liên quan.", "vq": "Team của bạn phân tích user story sau để xác định acceptance criteria:\n\"Là khách hàng đã đăng ký, tôi muốn xem các đơn hàng trước đây trên website của công ty để theo dõi việc mua hàng của mình.\"\n\nTest case nào sau đây KHÔNG liên quan đến user story này?", "vo": ["Input: khách hàng đăng nhập tài khoản trên website và nhấn nút \"xem lịch sử đơn hàng\". Kết quả mong đợi: hệ thống hiển thị danh sách mọi đơn hàng trước đây, gồm ngày, mã đơn và tổng tiền", "Input: khách hàng nhấn vào một đơn trong danh sách. Kết quả mong đợi: hệ thống hiển thị các mặt hàng đã mua kèm giá và số lượng", "Input: khách hàng nhấn nút \"Sắp xếp tăng dần\" trên màn hình lịch sử đơn hàng. Kết quả mong đợi: lịch sử đơn hàng được sắp xếp tăng dần theo mã đơn", "Input: một khách chưa đăng ký đăng ký tài khoản mới với email hợp lệ chưa có trong database. Kết quả mong đợi: hệ thống chấp nhận và tạo tài khoản"]}, {"id": "OFF-B30", "set": "B", "n": 30, "c": 5, "lo": "FL-5.1.3", "k": "K2", "b": [["p", "Your team follows the process that uses the DevOps delivery pipeline. The first three steps of this process are:"], ["list", ["(1) Code development", "(2) Submit code into a version control system and merge it into the “test” branch", "(3) Perform component testing for the submitted code"]], ["p", "Which of the following is BEST suited to be the entry criterion for step (2) of this pipeline?"]], "fig": null, "after": null, "o": ["Static analysis returns no high severity warnings for the submitted code", "System version control reports no conflicts when merging code into the “test” branch", "Component tests are compiled and ready to be executed", "Statement coverage is at least 80%"], "a": [0], "e": "Static analysis không có cảnh báo nghiêm trọng có thể và nên kiểm tra trước khi nộp code vào version control → entry criterion cho bước 2. Merge conflict chỉ biết sau khi nộp; c là entry của bước 3; d là exit của bước 3.", "vq": "Team của bạn làm theo quy trình dùng DevOps delivery pipeline. Ba bước đầu tiên là:\n(1) Phát triển code\n(2) Nộp code vào hệ thống version control và merge vào nhánh \"test\"\n(3) Thực hiện component testing cho code đã nộp\n\nĐâu là entry criterion phù hợp NHẤT cho bước (2)?", "vo": ["Static analysis không trả về cảnh báo mức nghiêm trọng cao nào cho code được nộp", "Version control không báo xung đột khi merge code vào nhánh \"test\"", "Các component test đã được biên dịch và sẵn sàng chạy", "Statement coverage đạt ít nhất 80%"]}, {"id": "OFF-B31", "set": "B", "n": 31, "c": 5, "lo": "FL-5.1.4", "k": "K3", "b": [["p", "You want to estimate the test effort for the new project using estimation based on ratios. You calculate the test-to-development effort ratio using averaged data for both development effort and test effort from four historical projects similar to the new one. The table shows this historical data."], ["table", [["Project", "Development effort ($)", "Test effort ($)"], ["P1", "800,000", "40,000"], ["P2", "1,200,000", "130,000"], ["P3", "600,000", "70,000"], ["P4", "1,000,000", "120,000"]]], ["p", "The estimated development effort for the new project is $800,000. What is your estimate of the test effort in this project?"]], "fig": null, "after": null, "o": ["$40,000", "$80,000", "$81,250", "$82,500"], "a": [1], "e": "Trung bình dev = 900.000$, test = 90.000$ → tỉ lệ test/dev = 10%. Dự án mới: 10% × 800.000$ = 80.000$.", "vq": "Bạn muốn ước lượng test effort cho dự án mới bằng estimation based on ratios. Bạn tính tỉ lệ effort test/phát triển dựa trên dữ liệu trung bình về effort phát triển và effort test của bốn dự án cũ tương tự như bảng.\n\nEffort phát triển ước tính cho dự án mới là $800,000. Ước lượng test effort của bạn cho dự án này là bao nhiêu?", "vo": ["$40,000", "$80,000", "$81,250", "$82,500"]}, {"id": "OFF-B32", "set": "B", "n": 32, "c": 5, "lo": "FL-5.1.5", "k": "K3", "b": [["p", "You are testing a web application that allows users to SEARCH for products, VIEW product details, ADD products to a shopping cart, and place an ORDER. You have prepared the following seven test cases, all of which you want to execute. The tests should be executed in the best order, based on test priority."], ["table", [["Test", "", "Priority (1 = higher priority)"], ["TC1", "SEARCH for product A", "4"], ["TC2", "SEARCH for product B", "4"], ["TC3", "VIEW product A details", "3"], ["TC4", "VIEW product B details", "2"], ["TC5", "ADD product A to a shopping cart", "3"], ["TC6", "ADD product B to a shopping cart", "1"], ["TC7", "place an ORDER", "5"]]], ["p", "You also identified the following logical dependencies between test cases:"], ["list", ["• SEARCH functionality must be tested before VIEW functionality can be tested.", "• VIEW functionality must be tested before ADD functionality.", "• ADD functionality must be tested before ORDER functionality."]], ["p", "Which test case should be executed as the fourth one?"]], "fig": null, "after": null, "o": ["TC3", "TC1", "TC7", "TC2"], "a": [1], "e": "Thứ tự tối ưu: TC2 → TC4 → TC6 (flow sản phẩm B có priority cao hơn) → TC1 → TC3 → TC5 → TC7. Test thứ tư là TC1.", "vq": "Bạn đang test một web app cho phép người dùng TÌM sản phẩm (SEARCH), XEM chi tiết (VIEW), THÊM vào giỏ hàng (ADD) và ĐẶT HÀNG (ORDER). Bạn có bảy test case như bảng và muốn chạy tất cả theo thứ tự tốt nhất dựa trên mức ưu tiên.\n\nCác phụ thuộc logic:\n• SEARCH phải được test trước khi test VIEW\n• VIEW phải được test trước ADD\n• ADD phải được test trước ORDER\n\nTest case nào nên được chạy thứ tư?", "vo": ["TC3", "TC1", "TC7", "TC2"]}, {"id": "OFF-B33", "set": "B", "n": 33, "c": 5, "lo": "FL-5.1.7", "k": "K2", "b": [["p", "According to the testing quadrants model, which of the following falls into quadrant Q1 (“technology facing” and “support the team”)?"]], "fig": null, "after": null, "o": ["Usability testing", "Functional testing", "User acceptance testing", "Component integration testing"], "a": [3], "e": "Q1 (technology-facing, support the team) gồm component test và component integration test. Usability và UAT thuộc Q3; functional testing thuộc Q2.", "vq": "Theo mô hình testing quadrants, loại test nào thuộc quadrant Q1 (\"hướng công nghệ\" và \"hỗ trợ team\")?", "vo": ["Usability testing", "Functional testing", "User acceptance testing", "Component integration testing"]}, {"id": "OFF-B34", "set": "B", "n": 34, "c": 5, "lo": "FL-5.2.4", "k": "K2", "b": [["p", "Given the following risks:"], ["list", ["1. Ineffective loop implementation causes long system responses", "2. Consumers change their preferences", "3. Flooding of the server room", "4. Patients above a certain age receive inaccurate reports"]], ["p", "And the following mitigation activities:"], ["list", ["A. Risk acceptance", "B. Testing for performance efficiency", "C. Using boundary value analysis as the test technique", "D. Risk transfer"]], ["p", "Which of the following BEST matches the risks with the mitigation activities?"]], "fig": null, "after": null, "o": ["1C,       2D,        3A,        4B", "1B,       2D,        3A,        4C", "1B,       2A,        3D,        4C", "1C,       2A,        3D,        4B"], "a": [2], "e": "Phản hồi chậm → performance testing (1B); sở thích khách hàng thay đổi → chấp nhận (2A); ngập phòng server → chuyển rủi ro, vd. bảo hiểm (3D); báo cáo sai với bệnh nhân trên một độ tuổi → vấn đề biên → BVA (4C).", "vq": "Cho các rủi ro:\n1. Hiện thực vòng lặp kém hiệu quả gây phản hồi hệ thống chậm\n2. Người tiêu dùng thay đổi sở thích\n3. Phòng server bị ngập nước\n4. Bệnh nhân trên một độ tuổi nhất định nhận báo cáo không chính xác\n\nVà các biện pháp:\nA. Chấp nhận rủi ro\nB. Test performance efficiency\nC. Dùng boundary value analysis làm kỹ thuật test\nD. Chuyển giao rủi ro\n\nLựa chọn nào ghép đúng NHẤT rủi ro với biện pháp?", "vo": ["1C, 2D, 3A, 4B", "1B, 2D, 3A, 4C", "1B, 2A, 3D, 4C", "1C, 2A, 3D, 4B"]}, {"id": "OFF-B35", "set": "B", "n": 35, "c": 5, "lo": "FL-5.3.1", "k": "K1", "b": [["p", "Which of the following is a product quality metric?"]], "fig": null, "after": null, "o": ["Mean time to failure", "Number of defects found", "Requirements coverage", "Defect detection percentage"], "a": [0], "e": "Mean time to failure đo maturity → product quality metric. Số defect tìm được và defect detection percentage là defect metric; requirements coverage là coverage metric.", "vq": "Đâu là một product quality metric (metric chất lượng sản phẩm)?", "vo": ["Thời gian trung bình đến khi xảy ra failure (MTTF)", "Số defect tìm được", "Requirements coverage", "Defect detection percentage"]}, {"id": "OFF-B36", "set": "B", "n": 36, "c": 5, "lo": "FL-5.3.3", "k": "K2", "b": [["p", "You are a member of a test team located in North America, developing a product for a client located in Europe. The team is agile and follows the DevOps approach and uses a continuous integration/continuous delivery pipeline."], ["p", "Which of the following is the LEAST effective way to communicate test progress to the customer?"]], "fig": null, "after": null, "o": ["Face-to-face", "Dashboards", "Email", "Video conferencing"], "a": [0], "e": "Khách hàng ở châu Âu, đội ở Bắc Mỹ → gặp mặt trực tiếp là kém hiệu quả nhất. Dashboard, email, video call đều thuận tiện hơn.", "vq": "Bạn là thành viên đội test ở Bắc Mỹ, phát triển sản phẩm cho khách hàng ở châu Âu. Team làm agile, theo DevOps và dùng pipeline CI/CD.\n\nCách nào KÉM hiệu quả NHẤT để báo cáo tiến độ test cho khách hàng?", "vo": ["Gặp mặt trực tiếp", "Dashboard", "Email", "Họp video"]}, {"id": "OFF-B37", "set": "B", "n": 37, "c": 5, "lo": "FL-5.4.1", "k": "K2", "b": [["p", "Which of the following BEST describes an example of how configuration management (CM) supports testing?"]], "fig": null, "after": null, "o": ["Having the version number of the environment, the CM tool can retrieve the version numbers of libraries, stubs and drivers used in that environment", "Having a record of the values of the inputs, the CM tool can execute the test cases for these configurations and calculate the coverage", "Having data about the date of purchase of a software license, the CM tool automatically generates information about the fact that the product license is coming to an end", "Having the version number of the test case, the CM tool can automatically generate test data for this test case"], "a": [0], "e": "CM ghi nhận các thành phần của configuration item phức tạp (vd. test environment) và phiên bản của chúng, nên truy được phiên bản thư viện, stub, driver. CM tool không chạy test, không quản lý license, không sinh test data.", "vq": "Điều nào mô tả TỐT NHẤT ví dụ về cách configuration management (CM) hỗ trợ testing?", "vo": ["Có số phiên bản của môi trường, CM tool có thể truy ra số phiên bản của các thư viện, stub và driver dùng trong môi trường đó", "Có bản ghi giá trị các input, CM tool có thể chạy test case cho các cấu hình này và tính coverage", "Có dữ liệu ngày mua license phần mềm, CM tool tự động cảnh báo license sắp hết hạn", "Có số phiên bản của test case, CM tool có thể tự động sinh test data cho test case đó"]}, {"id": "OFF-B38", "set": "B", "n": 38, "c": 5, "lo": "FL-5.5.1", "k": "K3", "b": [["p", "You are testing a sort function that gets a set of numbers as input and returns the same set of numbers sorted in ascending order. The log from the test execution looks as follows."], ["pre", "Environment configuration: sort function build 2.002.2182, test case set: TCS-3, # of TCs: 5\nTest run ID: 736\nStart 12:43:21.003\n12:43:21.003 Execution of TC1. Input: 3.               Output: 3.           Result: passed\n12:43:21.003 Execution of TC2. Input: 3 11 6 5.        Output: 3 5 6 11.    Result: passed\n12:43:21.004 Execution of TC3. Input: 8 7 3 7 1.       Output: 1 3 7 8.     Result: failed\n12:43:21.005 Execution of TC4. Input: -2 -2 -2 -3 -3.  Output: -3 -2.       Result: failed\n12:43:21.005 Execution of TC5. Input: 0 -2 0 3 4 4.    Output: -2 0 3 4.    Result: failed\nEnd 12:43:21.005\nTotal time of test cycle: 0:00:00.002"], ["p", "Which of the following provides the BEST description of the failure that can be used in a defect report?"]], "fig": null, "after": null, "o": ["The system fails to sort several sets of numbers. Reference: TC3, TC4, TC5.", "The system seems to disregard duplicates while sorting. Reference: TC3, TC4, TC5.", "The system fails to sort negative numbers. Reference: TC4, TC5.", "TC3, TC4 and TC5 have defects (duplicate input data) and should be corrected."], "a": [1], "e": "Kết quả cho thấy hệ thống bỏ qua phần tử trùng lặp khi sắp xếp (TC3, TC4, TC5) → mô tả b giúp developer nhất. Số âm vẫn được sắp đúng.", "vq": "Bạn đang test một hàm sắp xếp nhận vào một tập số và trả về chính tập số đó theo thứ tự tăng dần. Log thực thi test như bên dưới.\n\nĐâu là mô tả failure TỐT NHẤT để dùng trong defect report?", "vo": ["Hệ thống không sắp xếp được một số tập số. Tham chiếu: TC3, TC4, TC5.", "Hệ thống dường như bỏ qua các phần tử trùng lặp khi sắp xếp. Tham chiếu: TC3, TC4, TC5.", "Hệ thống không sắp xếp được số âm. Tham chiếu: TC4, TC5.", "TC3, TC4 và TC5 có defect (dữ liệu input bị trùng) và cần được sửa."]}, {"id": "OFF-B39", "set": "B", "n": 39, "c": 6, "lo": "FL-6.1.1", "k": "K2", "b": [["p", "Given the following descriptions:"], ["list", ["1. Support workflow tracking", "2. Facilitate communication", "3. Virtual machines", "4. Support reviews"]], ["p", "And the following test tool categories:"], ["list", ["A. Static testing tools", "B. Tools supporting scalability and deployment standardization", "C. DevOps tools", "D. Collaboration tools"]], ["p", "Which of the following BEST matches the descriptions and categories?"]], "fig": null, "after": null, "o": ["1A, 2B, 3C, 4D", "1B, 2D, 3C, 4A", "1C, 2D, 3B, 4A", "1D, 2C, 3A, 4B"], "a": [2], "e": "Workflow tracking → DevOps tools (1C); communication → collaboration tools (2D); virtual machines → scalability & deployment standardization (3B); hỗ trợ review → static testing tools (4A).", "vq": "Cho các mô tả:\n1. Hỗ trợ theo dõi workflow\n2. Hỗ trợ giao tiếp\n3. Máy ảo\n4. Hỗ trợ review\n\nVà các nhóm công cụ test:\nA. Static testing tools\nB. Tools supporting scalability and deployment standardization\nC. DevOps tools\nD. Collaboration tools\n\nLựa chọn nào ghép đúng NHẤT mô tả với nhóm công cụ?", "vo": ["1A, 2B, 3C, 4D", "1B, 2D, 3C, 4A", "1C, 2D, 3B, 4A", "1D, 2C, 3A, 4B"]}, {"id": "OFF-B40", "set": "B", "n": 40, "c": 6, "lo": "FL-6.2.1", "k": "K1", "b": [["p", "Which of the following is MOST likely to be a benefit of test automation?"]], "fig": null, "after": null, "o": ["It provides coverage measures that are too complicated for humans to derive", "It shares responsibility for the testing with the tool vendor", "It removes the need for critical thinking when analyzing test results", "It generates test cases from an analysis of the program code"], "a": [0], "e": "Tool có thể tính các metric coverage quá phức tạp để con người tự làm (vd. white-box coverage). Tool không chia sẻ trách nhiệm test, không thay thế tư duy phản biện, không tự sinh test case chỉ từ code.", "vq": "Điều nào sau đây CÓ KHẢ NĂNG NHẤT là lợi ích của test automation?", "vo": ["Cung cấp các thước đo coverage quá phức tạp để con người tự tính", "Chia sẻ trách nhiệm testing với nhà cung cấp tool", "Loại bỏ nhu cầu tư duy phản biện khi phân tích kết quả test", "Sinh test case từ việc phân tích code chương trình"]}, {"id": "OFF-C1", "set": "C", "n": 1, "c": 1, "lo": "FL-1.1.1", "k": "K1", "b": [["p", "Which of the following is a typical test objective?"]], "fig": null, "after": null, "o": ["Validating that documented requirements are met", "Causing failures and identifying defects", "Initiating errors and identifying root causes", "Verifying the test object meets user expectations"], "a": [1], "e": "Gây ra failure và tìm defect là mục tiêu điển hình của testing. a sai chữ (phải là verifying yêu cầu đã ghi); d sai chữ (phải là validating kỳ vọng người dùng); tester không tạo error, và tìm root cause thuộc debugging.", "vq": "Đâu là một test objective điển hình?", "vo": ["Validate rằng các yêu cầu đã ghi trong tài liệu được đáp ứng", "Gây ra failure và xác định defect", "Tạo ra error và xác định root cause", "Verify rằng test object đáp ứng kỳ vọng của người dùng"]}, {"id": "OFF-C2", "set": "C", "n": 2, "c": 1, "lo": "FL-1.1.2", "k": "K2", "b": [["p", "Which of the following statements BEST describes the difference between testing and debugging?"]], "fig": null, "after": null, "o": ["Testing causes failures while debugging fixes failures", "Testing is a negative activity while debugging is a positive activity", "Testing determines that defects exist while debugging removes defects", "Testing finds the cause of defects while debugging fixes the cause of defects"], "a": [2], "e": "Testing xác định có defect (trực tiếp qua static testing hoặc gián tiếp qua failure); debugging loại bỏ defect. Debugging không sửa failure; nguyên nhân của defect là error của con người.", "vq": "Phát biểu nào mô tả TỐT NHẤT sự khác biệt giữa testing và debugging?", "vo": ["Testing gây ra failure còn debugging sửa failure", "Testing là hoạt động tiêu cực còn debugging là hoạt động tích cực", "Testing xác định defect có tồn tại còn debugging loại bỏ defect", "Testing tìm nguyên nhân của defect còn debugging sửa nguyên nhân của defect"]}, {"id": "OFF-C3", "set": "C", "n": 3, "c": 1, "lo": "FL-1.3.1", "k": "K2", "b": [["p", "The ‘absence-of-defects fallacy’ is one of the principles of testing. Which of the following is an example of addressing this principle in practice?"]], "fig": null, "after": null, "o": ["Explaining that it is not possible for testing to show the absence of defects", "Supporting the end users to perform acceptance testing", "Ensuring that no implementation defects remain in the delivered system", "Modifying tests that cause no failures to ensure few defects remain"], "a": [1], "e": "Absence-of-defects fallacy: đúng đặc tả không đảm bảo người dùng hài lòng. Hỗ trợ end user làm acceptance testing giúp validate hệ thống đáp ứng nhu cầu thật.", "vq": "\"Absence-of-defects fallacy\" là một trong các nguyên tắc kiểm thử. Đâu là ví dụ về cách áp dụng nguyên tắc này trong thực tế?", "vo": ["Giải thích rằng testing không thể chứng minh là không có defect", "Hỗ trợ end user thực hiện acceptance testing", "Đảm bảo không còn defect hiện thực nào trong hệ thống được bàn giao", "Sửa đổi các test không gây ra failure để đảm bảo còn ít defect"]}, {"id": "OFF-C4", "set": "C", "n": 4, "c": 1, "lo": "FL-1.4.1", "k": "K2", "b": [["p", "Which of the following test activities are MOST likely to involve the application of boundary value analysis and equivalence partitioning?"]], "fig": null, "after": null, "o": ["Test implementation", "Test design", "Test execution", "Test monitoring", "Test analysis"], "a": [1, 4], "e": "Kỹ thuật test như BVA và EP được dùng trong test analysis (xác định test condition) và test design (tạo test case và coverage item).", "vq": "Những hoạt động test nào CÓ KHẢ NĂNG NHẤT áp dụng boundary value analysis và equivalence partitioning? (chọn 2)", "vo": ["Test implementation", "Test design", "Test execution", "Test monitoring", "Test analysis"]}, {"id": "OFF-C5", "set": "C", "n": 5, "c": 1, "lo": "FL-1.4.3", "k": "K2", "b": [["p", "Given the following testware:"], ["list", ["1. Coverage items", "2. Change requests", "3. Test execution schedule", "4. Prioritized test conditions"]], ["p", "And the following test activities"], ["list", ["A. Test analysis", "B. Test design", "C. Test implementation", "D. Test completion"]], ["p", "Which of the following BEST shows the testware produced by the activities?"]], "fig": null, "after": null, "o": ["1B, 2D, 3C, 4A", "1B, 2D, 3A, 4C", "1D, 2C, 3A, 4B", "1D, 2C, 3B, 4A"], "a": [0], "e": "Coverage items ← test design (1B); change requests ← test completion (2D); test execution schedule ← test implementation (3C); prioritized test conditions ← test analysis (4A).", "vq": "Cho các testware:\n1. Coverage items\n2. Change requests\n3. Test execution schedule\n4. Các test condition đã được ưu tiên\n\nVà các hoạt động test:\nA. Test analysis\nB. Test design\nC. Test implementation\nD. Test completion\n\nLựa chọn nào thể hiện đúng NHẤT testware được tạo ra bởi từng hoạt động?", "vo": ["1B, 2D, 3C, 4A", "1B, 2D, 3A, 4C", "1D, 2C, 3A, 4B", "1D, 2C, 3B, 4A"]}, {"id": "OFF-C6", "set": "C", "n": 6, "c": 1, "lo": "FL-1.4.5", "k": "K2", "b": [["p", "Which of the following statements about the different testing roles is MOST likely to be CORRECT?"]], "fig": null, "after": null, "o": ["In Agile software development, the test management role is the primary responsibility of the team, while the testing role is primarily the responsibility of a single individual from outside the team", "The testing role is primarily responsible for test monitoring and test control, while the test management role is primarily responsible for test planning and test completion", "In Agile software development, test management activities that span multiple teams are handled by a test manager outside the team, while some test management tasks are handled by the team itself", "The test management role is primarily responsible for test analysis and test design, while the testing role is primarily responsible for test implementation and test execution"], "a": [2], "e": "Trong Agile, một số việc quản lý test do team tự làm; việc quản lý test xuyên nhiều team do test manager bên ngoài team đảm nhận. Test management role phụ trách planning, monitoring & control, completion; testing role lo analysis, design, implementation, execution.", "vq": "Phát biểu nào về các vai trò trong testing CÓ KHẢ NĂNG ĐÚNG NHẤT?", "vo": ["Trong Agile, test management role là trách nhiệm chính của team, còn testing role chủ yếu là trách nhiệm của một cá nhân bên ngoài team", "Testing role chịu trách nhiệm chính về test monitoring và test control, còn test management role chịu trách nhiệm chính về test planning và test completion", "Trong Agile, các hoạt động quản lý test trải rộng nhiều team do một test manager bên ngoài team đảm nhận, còn một số việc quản lý test do chính team xử lý", "Test management role chịu trách nhiệm chính về test analysis và test design, còn testing role chịu trách nhiệm chính về test implementation và test execution"]}, {"id": "OFF-C7", "set": "C", "n": 7, "c": 1, "lo": "FL-1.5.2", "k": "K1", "b": [["p", "Which of the following is an advantage of the whole-team approach?"]], "fig": null, "after": null, "o": ["Teams with no testers", "Improved team dynamics", "Specialist team members", "Larger team sizes"], "a": [1], "e": "Whole-team approach cải thiện động lực nhóm (team dynamics), giao tiếp và cộng tác. Không có nghĩa là không cần tester, không nhấn mạnh chuyên gia riêng, không cần team lớn.", "vq": "Điều nào sau đây là ưu điểm của whole-team approach?", "vo": ["Team không có tester", "Cải thiện động lực làm việc nhóm (team dynamics)", "Thành viên là chuyên gia chuyên biệt", "Quy mô team lớn hơn"]}, {"id": "OFF-C8", "set": "C", "n": 8, "c": 1, "lo": "FL-1.5.3", "k": "K2", "b": [["p", "Which of the following statements about the independence of testing is CORRECT?"]], "fig": null, "after": null, "o": ["Independent testers will find defects due to their different technical perspective from developers, but their independence may lead to an adversarial relationship with the developers", "Developers’ familiarity with their own code means they only find a few defects in it, however their shared software background with testers means these defects would also be found by the testers", "Independent testing requires testers who are outside the developer’s team and ideally from outside the organization, however these testers find it difficult to understand the application domain", "Testers from outside the developer’s team are more independent than testers from within the team, but the testers from within the team are more likely to be blamed for delays in product release"], "a": [0], "e": "Tester độc lập tìm được loại defect khác nhờ góc nhìn kỹ thuật khác, nhưng sự độc lập có thể dẫn đến quan hệ đối đầu với developer.", "vq": "Phát biểu nào về independence of testing là ĐÚNG?", "vo": ["Tester độc lập sẽ tìm được defect nhờ góc nhìn kỹ thuật khác với developer, nhưng sự độc lập có thể dẫn đến quan hệ đối đầu với developer", "Developer quen thuộc với code của mình nên chỉ tìm được ít defect, nhưng vì có chung nền tảng phần mềm với tester nên tester cũng sẽ tìm được các defect này", "Independent testing yêu cầu tester ở ngoài team developer và tốt nhất là ngoài tổ chức, nhưng những tester này khó hiểu lĩnh vực ứng dụng", "Tester ngoài team developer độc lập hơn tester trong team, nhưng tester trong team dễ bị đổ lỗi cho việc chậm release hơn"]}, {"id": "OFF-C9", "set": "C", "n": 9, "c": 2, "lo": "FL-2.1.2", "k": "K1", "b": [["p", "Which of the following is a good testing practice that applies to all software development lifecycles?"]], "fig": null, "after": null, "o": ["For each test level, there is a corresponding development level", "For each test objective, there is a corresponding development objective", "For every test activity, there is a corresponding user activity", "For every development activity, there is a corresponding test activity"], "a": [3], "e": "Good practice cho mọi SDLC: với mỗi hoạt động phát triển đều có một hoạt động test tương ứng.", "vq": "Đâu là một good practice về testing áp dụng cho mọi vòng đời phát triển phần mềm?", "vo": ["Với mỗi test level, có một development level tương ứng", "Với mỗi test objective, có một development objective tương ứng", "Với mỗi hoạt động test, có một hoạt động của người dùng tương ứng", "Với mỗi hoạt động phát triển, có một hoạt động test tương ứng"]}, {"id": "OFF-C10", "set": "C", "n": 10, "c": 2, "lo": "FL-2.1.3", "k": "K1", "b": [["p", "Which of the following is an example of a test-first approach to development?"]], "fig": null, "after": null, "o": ["Component Test-Driven Development", "Integration Test-Driven Development", "System Test-Driven Development", "Acceptance Test-Driven Development"], "a": [3], "e": "ATDD là ví dụ nổi tiếng của test-first. Các tên còn lại không phải cách tiếp cận có thật.", "vq": "Đâu là ví dụ về cách tiếp cận phát triển test-first?", "vo": ["Component Test-Driven Development", "Integration Test-Driven Development", "System Test-Driven Development", "Acceptance Test-Driven Development"]}, {"id": "OFF-C11", "set": "C", "n": 11, "c": 2, "lo": "FL-2.1.5", "k": "K2", "b": [["p", "Which of the following provides the BEST description of shift-left?"]], "fig": null, "after": null, "o": ["When agreed by the developers, manual activities on the left-hand side of the test process are automated to support the principle of ‘early testing saves time and money’", "Where cost-effective, test activities are moved earlier in the software development lifecycle (SDLC) to reduce the total cost of quality by reducing the number of defects found later in the SDLC", "When they have spare time available, testers are required to automate tests for regression testing, starting with component tests and component integration tests", "When available, testers are trained to perform tasks early in the SDLC to allow more test activities to be automated later in the SDLC"], "a": [1], "e": "Shift-left: khi hiệu quả về chi phí, đưa các hoạt động test lên sớm hơn trong SDLC để giảm tổng chi phí chất lượng nhờ bớt defect phát hiện muộn.", "vq": "Lựa chọn nào mô tả TỐT NHẤT shift-left?", "vo": ["Khi developer đồng ý, các hoạt động thủ công ở phía bên trái của quy trình test được tự động hóa để hỗ trợ nguyên tắc \"early testing saves time and money\"", "Khi hiệu quả về chi phí, các hoạt động test được đưa lên sớm hơn trong SDLC để giảm tổng chi phí chất lượng nhờ giảm số defect phát hiện muộn", "Khi có thời gian rảnh, tester phải tự động hóa test cho regression testing, bắt đầu từ component test và component integration test", "Khi có thể, tester được đào tạo để làm các việc ở giai đoạn đầu SDLC nhằm tự động hóa được nhiều hoạt động test hơn ở giai đoạn sau"]}, {"id": "OFF-C12", "set": "C", "n": 12, "c": 2, "lo": "FL-2.1.6", "k": "K2", "b": [["p", "Which of the following is LEAST likely to occur as a result of a retrospective?"]], "fig": null, "after": null, "o": ["The quality of future test objects improves by identifying improvements in development practices", "Test efficiency improves by speeding up the configuration of test environments through automation", "End users’ understanding of the development and test processes is improved", "Automated test scripts are enhanced through feedback from developers"], "a": [2], "e": "End user hiếm khi tham gia retrospective và không nhận báo cáo, nên hiểu biết của họ về quy trình khó cải thiện. Các kết quả còn lại (cải tiến quy trình, test environment, test script) đều là lợi ích điển hình.", "vq": "Điều nào sau đây ÍT có khả năng NHẤT xảy ra nhờ một buổi retrospective?", "vo": ["Chất lượng các test object trong tương lai được cải thiện nhờ xác định được cải tiến trong cách phát triển", "Hiệu quả test tăng nhờ tăng tốc cấu hình test environment bằng tự động hóa", "End user hiểu rõ hơn về quy trình phát triển và test", "Automated test script được cải thiện nhờ phản hồi từ developer"]}, {"id": "OFF-C13", "set": "C", "n": 13, "c": 2, "lo": "FL-2.2.1", "k": "K2", "b": [["p", "Which of the following test levels is MOST likely being performed if the testing is focused on validation and is not being performed by testers?"]], "fig": null, "after": null, "o": ["Component testing", "Component integration testing", "System integration testing", "Acceptance testing"], "a": [3], "e": "Tập trung vào validation và không do tester thực hiện → acceptance testing (lý tưởng là do end user làm).", "vq": "Test level nào CÓ KHẢ NĂNG NHẤT đang được thực hiện nếu việc test tập trung vào validation và không do tester thực hiện?", "vo": ["Component testing", "Component integration testing", "System integration testing", "Acceptance testing"]}, {"id": "OFF-C14", "set": "C", "n": 14, "c": 2, "lo": "FL-2.2.3", "k": "K2", "b": [["p", "The navigation system software has been updated due to it suggesting routes that break traffic laws, such as driving the wrong way down one-way streets. Which of the following BEST describes the testing that will be performed?"]], "fig": null, "after": null, "o": ["Only confirmation testing", "Confirmation testing then regression testing", "Only regression testing", "Regression testing then confirmation testing"], "a": [1], "e": "Sau khi cập nhật để sửa lỗi: chạy confirmation testing trước để xác nhận bản sửa đúng, rồi regression testing để đảm bảo không gây lỗi ở phần khác.", "vq": "Phần mềm hệ thống dẫn đường đã được cập nhật vì nó gợi ý các tuyến đường vi phạm luật giao thông, như đi ngược chiều vào đường một chiều. Lựa chọn nào mô tả TỐT NHẤT việc test sẽ được thực hiện?", "vo": ["Chỉ confirmation testing", "Confirmation testing rồi đến regression testing", "Chỉ regression testing", "Regression testing rồi đến confirmation testing"]}, {"id": "OFF-C15", "set": "C", "n": 15, "c": 3, "lo": "FL-3.1.3", "k": "K2", "b": [["p", "Given the following example defects:"], ["list", ["i. Two different parts of the design specification disagree due to the complexity of the design", "ii. A response time is too long and so makes users lose patience", "iii. A path in the code cannot be reached during execution", "iv. A variable is declared but never subsequently used in the program", "v. The amount of memory needed by the program to generate a report is too high"]], ["p", "Which of the following BEST identifies example defects that could be found by static testing (rather than dynamic testing)?"]], "fig": null, "after": null, "o": ["ii, v", "iii, v", "i, ii, iv", "i, iii, iv"], "a": [3], "e": "Static testing tìm dễ: đặc tả mâu thuẫn (i), code không chạy tới được (iii), biến khai báo không dùng (iv). Thời gian phản hồi và dùng bộ nhớ quá mức cần dynamic testing.", "vq": "Cho các ví dụ defect:\ni. Hai phần khác nhau của đặc tả thiết kế mâu thuẫn nhau do thiết kế phức tạp\nii. Thời gian phản hồi quá lâu khiến người dùng mất kiên nhẫn\niii. Một đường đi trong code không thể được chạy tới khi thực thi\niv. Một biến được khai báo nhưng không bao giờ được dùng trong chương trình\nv. Lượng bộ nhớ chương trình cần để tạo báo cáo quá cao\n\nLựa chọn nào xác định đúng NHẤT các defect có thể tìm bằng static testing (thay vì dynamic testing)?", "vo": ["ii, v", "iii, v", "i, ii, iv", "i, iii, iv"]}, {"id": "OFF-C16", "set": "C", "n": 16, "c": 3, "lo": "FL-3.2.1", "k": "K1", "b": [["p", "Which of the following is a benefit of early and frequent stakeholder feedback?"]], "fig": null, "after": null, "o": ["Changes to requirements are understood and implemented earlier", "It ensures business stakeholders understand user requirements", "It allows product owners to change their requirements as often as they want", "End users are told which requirements will not be implemented prior to release"], "a": [0], "e": "Feedback sớm và thường xuyên giúp các thay đổi yêu cầu được hiểu và thực hiện sớm hơn. Không có nghĩa khuyến khích thay đổi yêu cầu tùy ý.", "vq": "Điều nào sau đây là lợi ích của phản hồi sớm và thường xuyên từ stakeholder?", "vo": ["Các thay đổi yêu cầu được hiểu và hiện thực sớm hơn", "Đảm bảo stakeholder nghiệp vụ hiểu yêu cầu người dùng", "Cho phép product owner thay đổi yêu cầu thường xuyên tùy ý", "End user được thông báo yêu cầu nào sẽ không được hiện thực trước khi release"]}, {"id": "OFF-C17", "set": "C", "n": 17, "c": 3, "lo": "FL-3.2.4", "k": "K2", "b": [["p", "Given the following review types:"], ["list", ["1. Technical review", "2. Informal review", "3. Inspection", "4. Walkthrough"]], ["p", "And the following descriptions:"], ["list", ["A. Includes objectives such as gaining consensus, generating new ideas, and motivating authors to improve", "B. Includes objectives such as educating reviewers, gaining consensus, generating new ideas and detecting potential defects", "C. The main objective is detecting potential defects and it requires metrics collection to support process improvement", "D. The main objective is detecting potential defects and it generates no formal documented output"]], ["p", "Which of the following BEST matches the review types and the descriptions?"]], "fig": null, "after": null, "o": ["1A, 2B, 3C, 4D", "1A, 2D, 3C, 4B", "1B, 2C, 3D, 4A", "1C, 2D, 3A, 4B"], "a": [1], "e": "Technical review: đạt đồng thuận, ý tưởng mới, động viên author (1A). Informal: tìm anomaly, không có output chính thức (2D). Inspection: tìm anomaly, thu thập metric (3C). Walkthrough: giáo dục reviewer, đồng thuận… (4B).", "vq": "Cho các loại review:\n1. Technical review\n2. Informal review\n3. Inspection\n4. Walkthrough\n\nVà các mô tả:\nA. Có các mục tiêu như đạt đồng thuận, tạo ý tưởng mới và thúc đẩy author cải thiện\nB. Có các mục tiêu như đào tạo reviewer, đạt đồng thuận, tạo ý tưởng mới và phát hiện defect tiềm ẩn\nC. Mục tiêu chính là phát hiện defect tiềm ẩn và yêu cầu thu thập metric để hỗ trợ cải tiến quy trình\nD. Mục tiêu chính là phát hiện defect tiềm ẩn và không tạo ra output chính thức được ghi lại\n\nLựa chọn nào ghép đúng NHẤT loại review với mô tả?", "vo": ["1A, 2B, 3C, 4D", "1A, 2D, 3C, 4B", "1B, 2C, 3D, 4A", "1C, 2D, 3A, 4B"]}, {"id": "OFF-C18", "set": "C", "n": 18, "c": 3, "lo": "FL-3.2.5", "k": "K1", "b": [["p", "Which of the following is a factor that contributes to a successful review?"]], "fig": null, "after": null, "o": ["Ensure management participate as reviewers", "Split large work products into smaller parts", "Set reviewer evaluation as an objective", "Plan to cover one document per review"], "a": [1], "e": "Chia work product lớn thành phần nhỏ giúp reviewer không mất tập trung. Không cần manager làm reviewer, không đánh giá reviewer, không nên dồn cả tài liệu vào một buổi.", "vq": "Đâu là một yếu tố góp phần làm review thành công?", "vo": ["Đảm bảo quản lý tham gia làm reviewer", "Chia work product lớn thành các phần nhỏ hơn", "Đặt mục tiêu là đánh giá reviewer", "Lên kế hoạch mỗi buổi review một tài liệu"]}, {"id": "OFF-C19", "set": "C", "n": 19, "c": 4, "lo": "FL-4.1.1", "k": "K2", "b": [["p", "What is the MAIN difference between black-box test techniques and experience-based test techniques?"]], "fig": null, "after": null, "o": ["The test object", "The test level at which the test technique is used", "The test basis", "The software development lifecycle (SDLC) in which the test technique can be used"], "a": [2], "e": "Khác biệt chính là test basis: black-box dựa trên đặc tả; experience-based dựa trên kiến thức và kinh nghiệm của tester.", "vq": "Khác biệt CHÍNH giữa kỹ thuật test black-box và kỹ thuật test dựa trên kinh nghiệm là gì?", "vo": ["Test object", "Test level mà kỹ thuật được dùng", "Test basis", "SDLC mà kỹ thuật có thể được dùng"]}, {"id": "OFF-C20", "set": "C", "n": 20, "c": 4, "lo": "FL-4.2.1", "k": "K3", "b": [["p", "You are testing a PIN validator, which accepts valid PINs and rejects invalid PINs. A PIN is a sequence of digits. A PIN is valid if it consists of four digits, which are not all the same digit. You have identified the following valid equivalence partitions:"], ["p", "Variable: PIN code length"], ["list", ["• The partition “length correct” - four-digit PINs", "• The partition “length incorrect” - PINs with length other than 4"]], ["p", "Variable: Number of different digits"], ["list", ["• The partition “number of different digits correct” - PINs with at least two different digits", "• The partition “number of different digits incorrect” - PINs with all digits being the same"]], ["p", "Which of the following is the BEST set of input test data to cover the identified equivalence partitions?"]], "fig": null, "after": null, "o": ["12, 1111, 1234, 12345", "1, 123, 1111, 1234", "11, 12, 1111, 12345", "123, 1222, 12345"], "a": [0], "e": "12 (độ dài sai, ít số), 1111 (đúng độ dài, các chữ số giống nhau), 1234 (hợp lệ), 12345 (độ dài sai, nhiều số) → phủ đủ và tốt nhất. d không có giá trị nào cho \"chữ số giống nhau\"; c thiếu PIN hợp lệ.", "vq": "Bạn đang test một bộ kiểm tra mã PIN, chấp nhận PIN hợp lệ và từ chối PIN không hợp lệ. PIN là một chuỗi chữ số. PIN hợp lệ nếu gồm bốn chữ số và các chữ số không giống hệt nhau. Bạn đã xác định các equivalence partition:\n\nBiến độ dài PIN:\n• \"độ dài đúng\": PIN có 4 chữ số\n• \"độ dài sai\": PIN có độ dài khác 4\nBiến số lượng chữ số khác nhau:\n• \"số chữ số khác nhau đúng\": PIN có ít nhất hai chữ số khác nhau\n• \"số chữ số khác nhau sai\": PIN có mọi chữ số giống nhau\n\nBộ dữ liệu test nào TỐT NHẤT để phủ các equivalence partition đã xác định?", "vo": ["12, 1111, 1234, 12345", "1, 123, 1111, 1234", "11, 12, 1111, 12345", "123, 1222, 12345"]}, {"id": "OFF-C21", "set": "C", "n": 21, "c": 4, "lo": "FL-4.2.2", "k": "K3", "b": [["p", "A developer was asked to implement the following business rule:"], ["pre", "INPUT: value (integer number)\n\nIF (value ≤ 100 OR value ≥ 200) THEN write “value incorrect”\nELSE write “value OK”"], ["p", "You design the test cases using 2-value boundary value analysis."], ["p", "Which of the following sets of test inputs achieves the greatest coverage?"]], "fig": null, "after": null, "o": ["100,             150,         200,          201", "99,              100,         200,          201", "98,              99,          100,          101", "101,             150,         199,          200"], "a": [3], "e": "Partition: ≤100, 101–199, ≥200 → coverage item của 2-value BVA là 100, 101, 199, 200. Bộ d chạm 101, 199, 200 = 75%, cao nhất; các bộ khác chỉ đạt 50%.", "vq": "Một developer được yêu cầu hiện thực quy tắc nghiệp vụ sau:\nINPUT: value (số nguyên)\nIF (value ≤ 100 OR value ≥ 200) THEN ghi \"value incorrect\"\nELSE ghi \"value OK\"\n\nBạn thiết kế test case bằng 2-value boundary value analysis.\n\nBộ test input nào đạt coverage lớn nhất?", "vo": ["100, 150, 200, 201", "99, 100, 200, 201", "98, 99, 100, 101", "101, 150, 199, 200"]}, {"id": "OFF-C22", "set": "C", "n": 22, "c": 4, "lo": "FL-4.2.3", "k": "K3", "b": [["p", "You are working on a project to develop a system to analyze driving test results. You have been asked to design test cases based on the following decision table."], ["table", [["", "R1", "R2", "R3"], ["C1: First attempt at the exam?", "–", "–", "F"], ["C2: Theoretical exam passed?", "T", "F", "–"], ["C3: Practical exam passed?", "T", "–", "F"], ["Issue a driving license?", "X", "", ""], ["Request additional driving lessons?", "", "", "X"], ["Request to take the exam again?", "", "X", ""]]], ["p", "What test data will show that there are contradictory rules in the decision table?"]], "fig": null, "after": null, "o": ["C1 = T, C2 = T, C3 = F", "C1 = T, C2 = F, C3 = T", "C1 = T, C2 = T, C3 = T and C1 = F, C2 = T, C3 = T", "C1 = F, C2 = F, C3 = F"], "a": [3], "e": "Tổ hợp (F, F, F) khớp cả R2 và R3 nhưng hai rule có action khác nhau → mâu thuẫn. (T, T, F) không khớp rule nào là thiếu sót (omission), không phải mâu thuẫn.", "vq": "Bạn làm trong dự án phát triển hệ thống phân tích kết quả thi bằng lái xe và được yêu cầu thiết kế test case dựa trên decision table như bảng (C1: thi lần đầu? C2: đậu lý thuyết? C3: đậu thực hành?; hành động: cấp bằng / yêu cầu học thêm / yêu cầu thi lại).\n\nDữ liệu test nào sẽ cho thấy decision table có các rule mâu thuẫn nhau?", "vo": ["C1 = T, C2 = T, C3 = F", "C1 = T, C2 = F, C3 = T", "C1 = T, C2 = T, C3 = T và C1 = F, C2 = T, C3 = T", "C1 = F, C2 = F, C3 = F"]}, {"id": "OFF-C23", "set": "C", "n": 23, "c": 4, "lo": "FL-4.2.4", "k": "K3", "b": [["p", "You are designing test cases based on the following state transition diagram:"]], "fig": "data:image/png w many coverage items do you need to test?"]], "o": ["2", "4", "8", "7"], "a": [2], "e": "Trong branch testing, coverage item là branch = các cạnh (edge) của control flow graph. Đồ thị có 8 cạnh.", "vq": "Bạn muốn áp dụng branch testing cho đoạn code được biểu diễn bằng control flow graph ở hình.\n\nBạn cần test bao nhiêu coverage item?", "vo": ["2", "4", "8", "7"]}, {"id": "OFF-C25", "set": "C", "n": 25, "c": 4, "lo": "FL-4.3.3", "k": "K2", "b": [["p", "How can white-box testing be useful in support of black-box testing?"]], "fig": null, "after": null, "o": ["White-box coverage measures can help testers evaluate black-box tests in terms of the code coverage achieved by these black-box tests", "White-box coverage analysis can help testers identify unreachable fragments of the source code", "Branch testing subsumes black-box test techniques, so achieving full branch coverage guarantees achieving full coverage of any black-box technique", "White-box test techniques can provide coverage items for black-box techniques"], "a": [0], "e": "Đo white-box coverage giúp đánh giá các black-box test đã phủ bao nhiêu code, từ đó bổ sung test. Branch testing không bao trùm các kỹ thuật black-box.", "vq": "White-box testing có thể hỗ trợ black-box testing như thế nào?", "vo": ["Các thước đo coverage của white-box giúp tester đánh giá các black-box test theo code coverage mà chúng đạt được", "Phân tích coverage của white-box giúp tester xác định các đoạn source code không thể chạy tới", "Branch testing bao trùm các kỹ thuật black-box, nên đạt full branch coverage đảm bảo đạt full coverage của mọi kỹ thuật black-box", "Kỹ thuật white-box có thể cung cấp coverage item cho các kỹ thuật black-box"]}, {"id": "OFF-C26", "set": "C", "n": 26, "c": 4, "lo": "FL-4.4.1", "k": "K2", "b": [["p", "Consider the following list:"], ["list", ["• Correct input not accepted", "• Incorrect input accepted", "• Wrong output format", "• Division by zero"]], ["p", "What test technique is MOST PROBABLY used by the tester who uses this list when performing testing?"]], "fig": null, "after": null, "o": ["Exploratory testing", "Fault attack", "Checklist-based testing", "Boundary value analysis"], "a": [1], "e": "Danh sách các failure có thể xảy ra là đặc trưng của fault attack, một cách áp dụng có hệ thống của error guessing. Checklist-based testing dùng danh sách test condition, không phải danh sách failure.", "vq": "Xét danh sách sau:\n• Input đúng không được chấp nhận\n• Input sai được chấp nhận\n• Định dạng output sai\n• Chia cho 0\n\nTester dùng danh sách này khi test CÓ KHẢ NĂNG NHẤT đang dùng kỹ thuật nào?", "vo": ["Exploratory testing", "Fault attack", "Checklist-based testing", "Boundary value analysis"]}, {"id": "OFF-C27", "set": "C", "n": 27, "c": 4, "lo": "FL-4.4.3", "k": "K2", "b": [["p", "Which of the following BEST describes how using checklist-based testing can result in increased coverage?"]], "fig": null, "after": null, "o": ["Checklist items can be defined at a sufficiently low level of detail, so the tester can implement and execute detailed test cases based on these items", "Checklists can be automated, so each time an automated test execution covers the checklist items, it results in additional coverage", "Each checklist item should be tested separately and independently, so the elements cover different areas of the software", "Two testers designing and executing tests based on the same high-level checklist items will typically perform the testing in slightly different ways"], "a": [3], "e": "Checklist ở mức cao để lại khoảng biến đổi: hai tester sẽ test theo cách hơi khác nhau (data, bước) → tăng coverage, đổi lại giảm khả năng lặp lại.", "vq": "Điều nào mô tả TỐT NHẤT cách checklist-based testing có thể giúp tăng coverage?", "vo": ["Các mục trong checklist có thể được định nghĩa đủ chi tiết để tester hiện thực và chạy các test case chi tiết dựa trên chúng", "Checklist có thể được tự động hóa, nên mỗi lần automated test chạy qua các mục checklist sẽ tăng thêm coverage", "Mỗi mục checklist nên được test riêng biệt và độc lập, nên các mục phủ các vùng khác nhau của phần mềm", "Hai tester thiết kế và chạy test theo cùng các mục checklist mức cao thường sẽ test theo cách hơi khác nhau"]}, {"id": "OFF-C28", "set": "C", "n": 28, "c": 4, "lo": "FL-4.5.2", "k": "K2", "b": [["p", "Which of the following provides the BEST example of a scenario-oriented acceptance criterion?"]], "fig": null, "after": null, "o": ["The application must allow users to delete their account and all associated data upon request", "When a customer adds an item to their cart and proceeds to checkout, they should be prompted to log in or create an account if they haven’t already done so", "IF (contain(product(23).Name, cart.products())) THEN return FALSE", "The website must comply with the ICT Accessibility 508 Standards and ensure that all content is accessible to users with disabilities"], "a": [1], "e": "b mô tả một kịch bản cụ thể (khi… thì…) → scenario-oriented. a và d là rule-oriented; c trông như dòng code, không phải acceptance criterion.", "vq": "Đâu là ví dụ TỐT NHẤT về một acceptance criterion dạng scenario-oriented?", "vo": ["Ứng dụng phải cho phép người dùng xóa tài khoản và mọi dữ liệu liên quan khi có yêu cầu", "Khi khách hàng thêm một mặt hàng vào giỏ và tiến hành thanh toán, họ phải được yêu cầu đăng nhập hoặc tạo tài khoản nếu chưa làm", "IF (contain(product(23).Name, cart.products())) THEN return FALSE", "Website phải tuân thủ tiêu chuẩn ICT Accessibility 508 và đảm bảo mọi nội dung đều truy cập được với người khuyết tật"]}, {"id": "OFF-C29", "set": "C", "n": 29, "c": 4, "lo": "FL-4.5.3", "k": "K3", "b": [["p", "You are using acceptance test-driven development and designing test cases based on the following user story:"], ["quote", "As a Regular or Special user, I want to be able to use my electronic floor card, to access specific floors."], ["p", "Acceptance Criteria:"], ["quote", "AC1: Regular users have access to floors 1 to 3\nAC2: Floor 4 is only accessible to Special users\nAC3: Special users have all the access rights of Regular users"], ["p", "Which test case is the MOST reasonable one to test AC3?"]], "fig": null, "after": null, "o": ["Check that a Regular user can access floors 1 and 3", "Check that a Regular user cannot access floor 4", "Check that a Special user can access floor 5", "Check that a Special user can access floors 1, 2 and 3"], "a": [3], "e": "AC3: Special user có mọi quyền của Regular user → test Special user vào được tầng 1, 2, 3. a, b test Regular user; tầng 5 không có trong AC.", "vq": "Bạn đang dùng acceptance test-driven development và thiết kế test case dựa trên user story:\nLà người dùng Regular hoặc Special, tôi muốn dùng thẻ từ để vào các tầng nhất định.\n\nAcceptance Criteria:\nAC1: Người dùng Regular được vào tầng 1 đến 3\nAC2: Tầng 4 chỉ dành cho người dùng Special\nAC3: Người dùng Special có mọi quyền truy cập của người dùng Regular\n\nTest case nào HỢP LÝ NHẤT để test AC3?", "vo": ["Kiểm tra người dùng Regular vào được tầng 1 và 3", "Kiểm tra người dùng Regular không vào được tầng 4", "Kiểm tra người dùng Special vào được tầng 5", "Kiểm tra người dùng Special vào được tầng 1, 2 và 3"]}, {"id": "OFF-C30", "set": "C", "n": 30, "c": 5, "lo": "FL-5.1.1", "k": "K2", "b": [["p", "Which of the following is NOT a purpose of a test plan?"]], "fig": null, "after": null, "o": ["To define test data and expected results for component tests and component integration tests", "To define as exit criteria from the component test level that “100% statement coverage and 100% branch coverage must be achieved”", "To describe what fields the test progress report shall contain and what should be the form of this report", "To explain why system integration testing will be excluded from testing, although the test strategy requires this test level"], "a": [0], "e": "Test plan không định nghĩa test data và expected result chi tiết cho từng test case; những thứ đó thuộc test case. Exit criteria, mẫu báo cáo, giải thích sai lệch so với test strategy đều thuộc test plan.", "vq": "Điều nào sau đây KHÔNG phải là mục đích của test plan?", "vo": ["Định nghĩa test data và expected result cho component test và component integration test", "Định nghĩa exit criteria của component test level là \"phải đạt 100% statement coverage và 100% branch coverage\"", "Mô tả test progress report gồm những trường nào và hình thức báo cáo ra sao", "Giải thích vì sao system integration testing sẽ bị loại khỏi phạm vi test, dù test strategy yêu cầu test level này"]}, {"id": "OFF-C31", "set": "C", "n": 31, "c": 5, "lo": "FL-5.1.4", "k": "K3", "b": [["p", "At the beginning of each iteration, the team estimates the amount of work (in person-days) they will need to complete during the iteration. Let E(n) be the estimated amount of work for iteration n, and let A(n) be the actual amount of work done in iteration n. From the third iteration, the team uses the following estimation model based on extrapolation:"], ["pre", "E(n) = ( 3 * A(n-1) + A(n-2) ) / 4"], ["p", "The graph shows the estimated and actual amount of work for the first four iterations."]], "fig": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA1IAAAHWCAAAAABY8+c8AAArIklEQVR42u3dWXxU9f3/8ddMkskeCFkghCUg+w6yiSAIKKDiRqtGba1Sa7X+ba21blXrwsOfta1LlaJ1wxVcipVF2XeQnQAhrGFLAtnJvs6c/8VM9knIJEdI5P280GHmzDmffM68z/ecMzNnLAYiYh6rWiCiSIkoUiKKlIgoUiKKlIgiJSKKlIgiJaJIiShSIqJIiShSIoqUiChSIheOt1rQkPy8iCZ0qCSrrb/ZlWTkRjU4z+LEonZdrQApqd5dQzyd/YLM6e1bUN897OCi1Ks7K1I/yoo4HR5k7hwfLrjmTs+f9db2brPM/tv+knvV3Q08vHReCQz/I2S9fhisz3f3bO6HvrTc/KM0sIk87OCp9WcfUaQ8tHxHxa3Ie+qd6LnjAbNtpi62nLImPavU9AY4cDTw6N652DplpwGvHyYy4FSmh5FawqXtfpQGNrnvHnVw4vqdqe0VKc8sTqu45V87Uo7j3l2ct1IpLPLgFVH1xAsnOyPKjHFhGf4vRZINxw9z9a/Ib7gLycVda6739G1MbkIDW4zenZKW/lKR8nQj3X6C81ZY7Yd2vMrLzj3p6bti2ngwz6onXjj/d2rkH0yYzVGGRkIoHIUp0HBK8x/lrik17tlghAxsQgNbjsvnb7rTqkh5KPyGetOG3Xnrxhs9jGnFEy/kpsKUEnIqtjS5brY5bv7uWjuRWxlkaUIDW45B83MP9Gshtegk+k+Bw8DLeauMilseSD3BkNbdgJgQtmrHr3 p", "Which test case should be executed sixth?"]], "o": ["TC 3", "TC 5", "TC 6", "TC 2"], "a": [0], "e": "Ưu tiên chạy TC 5 và TC 7 (priority 1) càng sớm càng tốt nhưng phải theo phụ thuộc: TC 4 → TC 7 → TC 1 → TC 2 → TC 5, sau đó TC 3 (priority 2) rồi TC 6. Test thứ sáu là TC 3.", "vq": "Bạn đang lập test execution schedule cho bảy test case TC 1 đến TC 7.\n\nHình thể hiện mức ưu tiên của các test case (1 = cao nhất, 3 = thấp nhất) và các phụ thuộc bằng mũi tên. Ví dụ, mũi tên từ TC 4 đến TC 5 nghĩa là TC 5 chỉ chạy được nếu TC 4 đã chạy trước.\n\nTest case nào nên được chạy thứ sáu?", "vo": ["TC 3", "TC 5", "TC 6", "TC 2"]}, {"id": "OFF-C33", "set": "C", "n": 33, "c": 5, "lo": "FL-5.1.6", "k": "K1", "b": [["p", "What does the test pyramid model show?"]], "fig": null, "after": null, "o": ["That tests may have different priorities", "That tests may have different granularity", "That tests may require different coverage criteria", "That tests may depend on other tests"], "a": [1], "e": "Test pyramid cho thấy các test có độ chi tiết (granularity) khác nhau ở từng tầng.", "vq": "Mô hình test pyramid thể hiện điều gì?", "vo": ["Các test có thể có mức ưu tiên khác nhau", "Các test có thể có độ chi tiết (granularity) khác nhau", "Các test có thể cần các tiêu chí coverage khác nhau", "Các test có thể phụ thuộc vào test khác"]}, {"id": "OFF-C34", "set": "C", "n": 34, "c": 5, "lo": "FL-5.1.7", "k": "K2", "b": [["p", "What is the relationship between the testing quadrants, test levels and test types?"]], "fig": null, "after": null, "o": ["Testing quadrants represent particular combinations of test levels and test types, defining their location in the software development lifecycle", "Testing quadrants describe the degree of granularity of individual test types performed at each test level", "Testing quadrants assign the test types that can be performed to the test levels", "Testing quadrants group test levels and test types by several criteria such as targeting specific stakeholders"], "a": [3], "e": "Testing quadrants nhóm test level, test type… theo các tiêu chí như hướng business/technology, hỗ trợ team/phản biện sản phẩm.", "vq": "Quan hệ giữa testing quadrants, test level và test type là gì?", "vo": ["Testing quadrants biểu diễn các tổ hợp cụ thể của test level và test type, xác định vị trí của chúng trong SDLC", "Testing quadrants mô tả độ chi tiết của từng test type được thực hiện ở mỗi test level", "Testing quadrants gán các test type có thể thực hiện cho các test level", "Testing quadrants nhóm các test level và test type theo nhiều tiêu chí, như hướng tới các stakeholder cụ thể"]}, {"id": "OFF-C35", "set": "C", "n": 35, "c": 5, "lo": "FL-5.2.3", "k": "K2", "b": [["p", "Which of the following is an example of how product risk analysis may influence the thoroughness and scope of testing?"]], "fig": null, "after": null, "o": ["Continuous risk monitoring allows us to identify an emerging risk as soon as possible", "Risk identification allows us to implement risk mitigation activities and reduce the risk level", "The assessed risk level helps us to select the rigor of testing", "Risk analysis allows us to derive coverage items"], "a": [2], "e": "Mức rủi ro đánh giá được giúp chọn độ kỹ lưỡng (rigor) của testing → risk analysis ảnh hưởng đến độ kỹ lưỡng và phạm vi test. Risk monitoring thuộc risk control; coverage item đến từ test technique.", "vq": "Đâu là ví dụ về cách product risk analysis có thể ảnh hưởng đến độ kỹ lưỡng và phạm vi test?", "vo": ["Theo dõi rủi ro liên tục giúp phát hiện rủi ro mới càng sớm càng tốt", "Xác định rủi ro giúp ta thực hiện các biện pháp giảm thiểu và hạ mức rủi ro", "Mức rủi ro đã đánh giá giúp ta chọn mức độ nghiêm ngặt (rigor) của testing", "Phân tích rủi ro giúp ta suy ra coverage item"]}, {"id": "OFF-C36", "set": "C", "n": 36, "c": 5, "lo": "FL-5.3.2", "k": "K2", "b": [["p", "Which of the following activities in the test process makes the MOST use of test progress reports?"]], "fig": null, "after
