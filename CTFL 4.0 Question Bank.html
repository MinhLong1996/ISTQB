const BYID = Object.fromEntries(ALL.map(q=>[q.id,q]));

/* ---------- storage (per-viewer convenience) ---------- */
const KEY="ctfl40-quiz-v1";
function load(){ try{ return JSON.parse(localStorage.getItem(KEY))||{}; }catch(e){ return {}; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){} }
const store = Object.assign({wrong:[], history:[], chapters:[1,2,3,4,5,6], extraTime:false, source:"all", best:{}, bi:true}, load());
store.wrong = store.wrong.filter(id=>BYID[id]);

let S = {view:"home"};
let tick = null;
const $app = document.getElementById("app");
const L = ["A","B","C","D","E"];
const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
const same = (x,y) => x && x.length===y.length && [...x].sort().join()===[...y].sort().join();
function markWrong(id, isWrong){
  const set = new Set(store.wrong);
  isWrong ? set.add(id) : set.delete(id);
  store.wrong = [...set]; save();
}
function srcFilter(q){ return store.source==="all" || q.src===store.source; }

function start(mode, setKey){
  let list, exam=false, minutes=store.extraTime?75:60, title;
  if(mode==="practice"){ list = shuffle(ALL.filter(q=>store.chapters.includes(q.c) && srcFilter(q))); title="Luyện theo chương"; }
  else if(mode==="wrong"){ list = shuffle(ALL.filter(q=>store.wrong.includes(q.id))); title="Ôn câu sai"; }
  else if(mode==="mock"){ exam=true; title="Thi thử ngẫu nhiên"; list=[]; for(const c in EXAM_DIST){ list = list.concat(shuffle(OWN.filter(q=>q.c==c)).slice(0,EXAM_DIST[c])); } }
  else if(mode==="set"){
    const st = SETS[setKey]; exam = st.exam; title = st.name;
    list = OFF.filter(q=>q.set===setKey).sort((a,b)=>a.n-b.n);
  }
  if(!list || !list.length) return;
  clearInterval(tick);
  S = {view:"quiz", mode, setKey, title, exam, list, idx:0, ans:{}, revealed:{}, confirm:false,
       end: exam ? Date.now() + minutes*60000 : null};
  if(exam){ tick = setInterval(()=>{ if(S.view!=="quiz"){clearInterval(tick);return;} if(S.end-Date.now()<=0){ finish(); } else updTimer(); },1000); }
  render(); window.scrollTo({top:0});
}

function finish(){
  clearInterval(tick);
  const res = S.list.map((q,i)=>({q, pick:S.ans[i]||[], ok:same(S.ans[i], q.a)}));
  if(S.exam){ res.forEach(r=>markWrong(r.q.id, !r.ok)); }
  const correct = res.filter(r=>r.ok).length;
  if(S.exam){
    store.history = [{d:Date.now(), s:correct, n:res.length, t:S.title}].concat(store.history||[]).slice(0,20);
    if(S.mode==="set"){ const b=store.best[S.setKey]; if(b===undefined || correct>b) store.best[S.setKey]=correct; }
    save();
  }
  S = {view:"result", mode:S.mode, setKey:S.setKey, title:S.title, exam:S.exam, res, correct};
  render(); window.scrollTo({top:0});
}

function fmt(ms){ ms=Math.max(0,ms); const m=Math.floor(ms/60000), s=Math.floor(ms%60000/1000); return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0"); }
function updTimer(){ const t=document.getElementById("timer"); if(!t) return; const left=S.end-Date.now(); t.textContent=fmt(left); t.classList.toggle("low", left<5*60000); }

/* ---------- question rendering ---------- */
function renderBlocks(bs){
  return bs.map(b=>{
    const [t,v]=b;
    if(t==="p") return `<p class="qp">${esc(v)}</p>`;
    if(t==="quote") return `<blockquote class="qq">${esc(v)}</blockquote>`;
    if(t==="pre") return `<pre class="code">${esc(v)}</pre>`;
    if(t==="list") return `<ul class="ql">${v.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`;
    if(t==="table"){ const [h,...rows]=v; return `<div class="tbl"><table><thead><tr>${h.map(x=>`<th>${esc(x)}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((x,i)=>i?`<td>${esc(x)}</td>`:`<th scope="row">${esc(x)}</th>`).join("")}</tr>`).join("")}</tbody></table></div>`; }
    return "";
  }).join("");
}
function stem(q){
  if(q.src==="own") return `<p class="qtext">${esc(q.q)}</p>${q.code?`<pre class="code">${esc(q.code)}</pre>`:""}`;
  const en = `<div class="qtext official" lang="en">${renderBlocks(q.b)}${q.fig?`<figure class="fig"><img src="${q.fig}" alt="Hình minh họa của câu hỏi"></figure>`:""}${q.after?renderBlocks(q.after):""}</div>`;
  if(!store.bi || !q.vq) return en;
  return `<div class="bil"><div><div class="langtag">English</div>${en}</div><div class="vi-col" lang="vi"><div class="langtag">Tiếng Việt</div><div class="vi-text">${esc(q.vq)}</div></div></div>`;
}
function tags(q){
  if(q.src==="own") return `<span class="tag">${q.id}</span><span class="tag">§${q.s}</span><span class="tag">${CH[q.c]}</span>`;
  return `<span class="tag off">ISTQB · ${SETS[q.set].name} #${q.n}</span><span class="tag">${q.lo}</span><span class="tag">${q.k}</span>`;
}

/* ---------- views ---------- */
function home(){
  const own = {}, off = {}; OWN.forEach(q=>own[q.c]=(own[q.c]||0)+1); OFF.forEach(q=>off[q.c]=(off[q.c]||0)+1);
  const selCount = ALL.filter(q=>store.chapters.includes(q.c) && srcFilter(q)).length;
  const last = (store.history||[])[0];
  const setCard = k => { const st=SETS[k], b=store.best[k]; return `
    <div class="setc">
      <div class="row between"><h3>${st.name}</h3><span class="mono muted">${st.ver}</span></div>
      <p>${st.n} câu · ${st.exam? (store.extraTime?"75":"60")+" phút, chấm điểm khi nộp" : "không tính giờ, xem giải thích ngay"}</p>
      <div class="row between"><span class="mono muted">${st.exam? (b!==undefined? "Cao nhất: "+b+"/40" : "Chưa làm") : ""}</span>
      <button class="btn ${st.exam?"primary":""}" data-set="${k}">${st.exam?"Làm đề":"Luyện"}</button></div>
    </div>`; };
  return `
  <header class="top">
    <div>
      <div class="eyebrow">ISTQB · Certified Tester Foundation Level v4.0</div>
      <h1>Ngân hàng câu hỏi CTFL</h1>
      <p>${OWN.length} câu tự soạn theo syllabus và ${OFF.length} câu từ đề mẫu chính thức của ISTQB, tất cả có giải thích tiếng Việt. Cần 26/40 câu (65%) để đậu.</p>
    </div>
    <div class="stamp">
      <div><span class="eyebrow">Tổng câu hỏi</span><b>${ALL.length}</b></div>
      <div><span class="eyebrow">Câu sai đã lưu</span><b>${store.wrong.length}</b></div>
      <div><span class="eyebrow">Lần thi gần nhất</span><b>${last? last.s+"/"+last.n : "—"}</b></div>
    </div>
  </header>

  <section>
    <div class="section-h first"><h2>Đề mẫu chính thức ISTQB</h2><span class="muted" style="font-size:13px">Tiếng Anh như đề thật, kèm bản dịch tiếng Việt</span></div>
    <div class="sets">${["A","B","C","AX"].map(setCard).join("")}</div>
    <div class="row" style="margin-top:10px"><span class="muted" style="font-size:13px">Thời gian làm đề:</span>
      <button class="chip" id="t60" aria-pressed="${!store.extraTime}">60 phút</button>
      <button class="chip" id="t75" aria-pressed="${store.extraTime}">75 phút (không phải tiếng mẹ đẻ)</button>
      <span class="muted" style="font-size:13px;margin-left:8px">Hiển thị:</span>
      <button class="chip" id="bi" aria-pressed="${store.bi}">Song ngữ Anh–Việt</button>
    </div>
  </section>

  <div class="section-h"><h2>Luyện tập</h2></div>
  <section class="modes">
    <div class="mode">
      <div class="eyebrow">Theo chương</div>
      <h2>Luyện theo chương</h2>
      <p>Chọn chương và nguồn câu hỏi, trả lời từng câu và xem giải thích ngay.</p>
      <div class="chips" role="group" aria-label="Chọn chương">
        ${[1,2,3,4,5,6].map(c=>`<button class="chip" data-ch="${c}" aria-pressed="${store.chapters.includes(c)}">Ch.${c}</button>`).join("")}
      </div>
      <div class="chips" role="group" aria-label="Nguồn câu hỏi">
        <button class="chip" data-src="all" aria-pressed="${store.source==="all"}">Tất cả</button>
        <button class="chip" data-src="own" aria-pressed="${store.source==="own"}">Tự soạn</button>
        <button class="chip" data-src="off" aria-pressed="${store.source==="off"}">Đề chính thức</button>
      </div>
      <div class="spacer"></div>
      <button class="btn primary" id="go-practice" ${selCount?"":"disabled"}>Bắt đầu ${selCount} câu</button>
    </div>
    <div class="mode">
      <div class="eyebrow">Thi thử</div>
      <h2>Đề ngẫu nhiên 40 câu</h2>
      <p>Rút từ câu tự soạn theo phân bổ đề thật: Ch1 8 · Ch2 6 · Ch3 4 · Ch4 11 · Ch5 9 · Ch6 2. Mỗi lần làm là một đề khác.</p>
      <div class="spacer"></div>
      <button class="btn primary" id="go-mock">Bắt đầu thi thử</button>
    </div>
    <div class="mode">
      <div class="eyebrow">Sửa sai</div>
      <h2>Ôn câu sai</h2>
      <p>Câu trả lời sai ở mọi chế độ được lưu trên trình duyệt này. Trả lời đúng thì câu đó được gỡ khỏi danh sách.</p>
      <div class="spacer"></div>
      <button class="btn primary" id="go-wrong" ${store.wrong.length?"":"disabled"}>${store.wrong.length? "Ôn "+store.wrong.length+" câu sai" : "Chưa có câu sai"}</button>
    </div>
  </section>

  <section class="syl">
    <h3>Số câu theo chương</h3>
    <div class="syl-row syl-head"><span>Ch.</span><span>Chương</span><span class="num">Tự soạn</span><span class="num">Chính thức</span><span class="num">Đề thi</span></div>
    ${[1,2,3,4,5,6].map(c=>`<div class="syl-row"><span class="n">${c}</span><span>${CH[c]}</span><span class="num">${own[c]||0}</span><span class="num">${off[c]||0}</span><span class="num">${EXAM_DIST[c]}</span></div>`).join("")}
  </section>
  <p class="note">Câu hỏi đề mẫu A, B, C và câu bổ sung © International Software Testing Qualifications Board (ISTQB®), trích từ bộ Sample Exam CTFL v4.0 cho mục đích học tập phi thương mại. Giải thích tiếng Việt được tóm lược từ đáp án chính thức. Phím tắt khi làm bài: A–E hoặc 1–5 để chọn, Enter hoặc → sang câu tiếp.</p>`;
}

function quiz(){
  const q = S.list[S.idx], n = S.list.length, pick = S.ans[S.idx]||[];
  const exam = S.exam, shown = !exam && S.revealed[S.idx];
  const multi = q.a.length>1;
  const answered = Object.keys(S.ans).filter(k=>(S.ans[k]||[]).length).length;
  const optCls = i => {
    if(shown){ if(q.a.includes(i)) return "ok"; if(pick.includes(i)) return "bad"; return ""; }
    return pick.includes(i) ? "sel" : "";
  };
  const gridCls = i => {
    let c = i===S.idx ? "cur" : "";
    if(!exam && S.revealed[i]) c += same(S.ans[i], S.list[i].a) ? " g-ok" : " g-bad";
    else if((S.ans[i]||[]).length) c += " done";
    return c;
  };
  const ok = same(pick, q.a);
  return `
  <div class="qbar">
    <div class="left">
      <button class="btn ghost" id="quit">← Thoát</button>
      <strong>${esc(S.title)}</strong>
      <span class="mono muted">Câu ${S.idx+1}/${n}</span>
      <span class="progress" aria-hidden="true"><i style="width:${answered/n*100}%"></i></span>
    </div>
    <div class="left">${q.src==="off" ? `<button class="chip" id="bi" aria-pressed="${store.bi}">Song ngữ Anh–Việt</button>` : ""}${exam ? `<span class="timer" id="timer">${fmt(S.end-Date.now())}</span>` : ""}</div>
  </div>
  <div class="qlayout">
    <article class="card">
      <div class="qmeta">${tags(q)}</div>
      ${stem(q)}
      ${multi ? `<p class="pick2">Chọn HAI đáp án${!shown && pick.length? " · đã chọn "+pick.length+"/2":""}</p>` : ""}
      <div class="opts">
        ${q.o.map((t,i)=>`<button class="opt ${optCls(i)}" data-opt="${i}" ${shown?"disabled":""}><span class="k">${L[i]}</span><span>${esc(t)}${store.bi && q.vo && q.vo[i]!==t ? `<span class="vi-opt" lang="vi">${esc(q.vo[i])}</span>` : ""}</span></button>`).join("")}
      </div>
      ${shown ? `<div class="explain"><div class="verdict ${ok?"ok":"bad"}">${ok?"Chính xác":"Chưa đúng · đáp án "+q.a.map(i=>L[i]).join(", ")}</div>${esc(q.e)}</div>` : ""}
      <div class="qfoot">
        <button class="btn" id="prev" ${S.idx===0?"disabled":""}>← Câu trước</button>
        ${S.idx<n-1
          ? `<button class="btn primary" id="next">Câu tiếp →</button>`
          : `<button class="btn primary" id="submit">${exam?"Nộp bài":"Xem kết quả"}</button>`}
      </div>
    </article>
    <aside class="nav">
      <div class="eyebrow">Đã trả lời ${answered}/${n}</div>
      <div class="grid">${S.list.map((_,i)=>`<button class="${gridCls(i)}" data-go="${i}" aria-label="Câu ${i+1}">${i+1}</button>`).join("")}</div>
      ${exam ? `<div style="margin-top:12px"><button class="btn" id="submit2" style="width:100%">Nộp bài</button></div>` : ""}
      ${S.confirm ? `<div class="confirm"><span>${n-answered>0? "Còn "+(n-answered)+" câu chưa trả lời. ":""}Nộp bài ngay?</span><div class="row"><button class="btn primary" id="yes">Nộp</button><button class="btn" id="no">Làm tiếp</button></div></div>` : ""}
      <div class="kbd">Phím: A–E chọn · Enter / → câu tiếp · ← câu trước</div>
    </aside>
  </div>`;
}

function result(){
  const {res, correct} = S, n = res.length, pct = Math.round(correct/n*100);
  const pass = correct/n >= 0.65;
  const by = {}; res.forEach(r=>{ (by[r.q.c] ||= {ok:0,n:0}); by[r.q.c].n++; if(r.ok) by[r.q.c].ok++; });
  const wrong = res.filter(r=>!r.ok);
  const fmtPick = (q,p) => p.length ? p.map(i=>L[i]+". "+esc(q.o[i])+(store.bi&&q.vo&&q.vo[i]!==q.o[i]?` <span class="muted">(${esc(q.vo[i])})</span>`:"")).join("<br>") : "(bỏ trống)";
  return `
  <div class="qbar"><div class="left"><button class="btn ghost" id="home">← Trang chính</button><strong>Kết quả · ${esc(S.title)}</strong></div></div>
  <section class="card">
    <div class="score">
      <div><div class="eyebrow">Số câu đúng</div><div class="big">${correct}/${n}</div></div>
      <div><div class="eyebrow">Tỉ lệ</div><div class="big">${pct}%</div></div>
      <div><span class="pill ${pass?"ok":"bad"}">${pass?"ĐẠT":"CHƯA ĐẠT"}</span><div class="muted" style="font-size:13px;margin-top:6px">Ngưỡng đậu 65%${n===40?" (26/40)":""}</div></div>
    </div>
    <div class="bars">
      ${Object.keys(by).sort().map(c=>{ const b=by[c], p=b.ok/b.n; return `<div class="bar"><span>Ch.${c} · ${CH[c]}</span><span class="track"><i style="width:${p*100}%;background:${p>=.65?"var(--pass)":"var(--fail)"}"></i></span><span class="num">${b.ok}/${b.n}</span></div>`; }).join("")}
    </div>
    <div class="row" style="margin-top:20px">
      <button class="btn primary" id="again">Làm lại</button>
      ${store.wrong.length? `<button class="btn" id="go-wrong">Ôn ${store.wrong.length} câu sai</button>`:""}
    </div>
  </section>
  <div class="section-h"><h2>${wrong.length? "Các câu cần xem lại" : "Không có câu sai"}</h2><span class="mono muted">${wrong.length} câu</span></div>
  <div class="review">
    ${wrong.map(r=>`<article class="card">
      <div class="qmeta">${tags(r.q)}</div>
      ${stem(r.q)}
      <div class="ans">
        <span class="you">Bạn chọn: ${fmtPick(r.q, r.pick)}</span>
        <span class="right">Đáp án: ${fmtPick(r.q, r.q.a)}</span>
      </div>
      <div class="explain">${esc(r.q.e)}</div>
    </article>`).join("")}
  </div>`;
}

function render(){
  $app.innerHTML = S.view==="home" ? home() : S.view==="quiz" ? quiz() : result();
}

/* ---------- actions ---------- */
function choose(i){
  if(S.view!=="quiz") return;
  const q = S.list[S.idx];
  if(i>=q.o.length) return;
  const need = q.a.length;
  if(!S.exam && S.revealed[S.idx]) return;
  let cur = (S.ans[S.idx]||[]).slice();
  if(need===1) cur=[i];
  else if(cur.includes(i)) cur=cur.filter(x=>x!==i);
  else { cur.push(i); if(cur.length>need) cur.shift(); }
  S.ans[S.idx] = cur;
  if(!S.exam && cur.length===need){
    S.revealed[S.idx] = true;
    markWrong(q.id, !same(cur, q.a));
  }
  render();
}
function go(i){ if(i<0||i>=S.list.length) return; S.idx=i; S.confirm=false; render(); }

$app.addEventListener("click", e=>{
  const t = e.target.closest("button"); if(!t) return;
  if(t.dataset.ch){ const c=+t.dataset.ch; const set=new Set(store.chapters); set.has(c)?set.delete(c):set.add(c); store.chapters=[...set].sort(); save(); render(); return; }
  if(t.dataset.src){ store.source=t.dataset.src; save(); render(); return; }
  if(t.dataset.set){ start("set", t.dataset.set); return; }
  if(t.dataset.opt!==undefined){ choose(+t.dataset.opt); return; }
  if(t.dataset.go!==undefined){ go(+t.dataset.go); return; }
  switch(t.id){
    case "bi": store.bi=!store.bi; save(); render(); break;
    case "t60": store.extraTime=false; save(); render(); break;
    case "t75": store.extraTime=true; save(); render(); break;
    case "go-practice": start("practice"); break;
    case "go-mock": start("mock"); break;
    case "go-wrong": start("wrong"); break;
    case "again": start(S.mode, S.setKey); break;
    case "home": case "quit": clearInterval(tick); S={view:"home"}; render(); window.scrollTo({top:0}); break;
    case "prev": go(S.idx-1); break;
    case "next": go(S.idx+1); break;
    case "submit": case "submit2": if(S.exam){ S.confirm=true; render(); } else finish(); break;
    case "yes": finish(); break;
    case "no": S.confirm=false; render(); break;
  }
});
document.addEventListener("keydown", e=>{
  if(S.view!=="quiz" || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  const map = {a:0,b:1,c:2,d:3,e:4,"1":0,"2":1,"3":2,"4":3,"5":4};
  if(k in map){ e.preventDefault(); choose(map[k]); }
  else if(k==="enter"||k==="arrowright"){ if(k==="enter" && document.activeElement && document.activeElement.tagName==="BUTTON") return; e.preventDefault(); go(S.idx+1); }
  else if(k==="arrowleft"){ e.preventDefault(); go(S.idx-1); }
});

render();
</script>

</body></html>
