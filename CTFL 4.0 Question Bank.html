<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>CTFL 4.0 Question Bank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#F3F5F9; --surface:#FFFFFF; --sunk:#E9EDF3; --ink:#14202C; --muted:#586677; --line:#D8DFE8;
  --accent:#2A4ED6; --accent-ink:#FFFFFF; --accent-soft:#E3E9FF;
  --pass:#16825A; --pass-soft:#DDF3E9; --fail:#C23A2A; --fail-soft:#FBE3DF; --warn:#A86A12;
  --sans:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0E141B; --surface:#161F29; --sunk:#1D2834; --ink:#E5EBF2; --muted:#94A3B5; --line:#2A3644;
    --accent:#7F98FF; --accent-ink:#0E141B; --accent-soft:#222E52;
    --pass:#45C28C; --pass-soft:#16362A; --fail:#F2786A; --fail-soft:#3F1F1B; --warn:#E3A845;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0E141B; --surface:#161F29; --sunk:#1D2834; --ink:#E5EBF2; --muted:#94A3B5; --line:#2A3644;
  --accent:#7F98FF; --accent-ink:#0E141B; --accent-soft:#222E52;
  --pass:#45C28C; --pass-soft:#16362A; --fail:#F2786A; --fail-soft:#3F1F1B; --warn:#E3A845;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:28px 64px}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.2}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:.02em}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin-bottom:28px}
.top h1{font-size:clamp(26px,4.4vw,36px);font-weight:800;letter-spacing:-.02em}
.top p{margin:6px 0 0;max-width:60ch;color:var(--muted)}
.stamp{display:flex;gap:18px;flex-wrap:wrap}
.stamp div{display:grid}
.stamp b{font-size:22px;font-variant-numeric:tabular-nums}

/* modes */
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:760px){.modes{grid-template-columns:1fr}}
.mode{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:12px}
.mode h2{font-size:18px;font-weight:700}
.mode p{margin:0;color:var(--muted);font-size:14px}
.mode .spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 16px;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--sunk);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}

/* syllabus table */
.syl{margin-top:28px;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.syl h3{font-size:14px;padding:14px 18px;border-bottom:1px solid var(--line)}
.syl-row{display:grid;grid-template-columns:44px 1fr 80px 80px 70px;gap:10px;align-items:center;padding:10px 18px;border-bottom:1px solid var(--line);font-size:14px}
.syl-row:last-child{border-bottom:0}
.syl-row .n{font-family:var(--mono);color:var(--muted)}
.syl-row .num{text-align:right;font-variant-numeric:tabular-nums}
.syl-head{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--sunk)}
@media (max-width:560px){.syl-row{grid-template-columns:26px 1fr 50px 58px 44px;padding:10px 12px;gap:6px}}
.note{margin-top:18px;font-size:13px;color:var(--muted);max-width:75ch}
.note a{color:var(--accent)}

/* quiz */
.qbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ground);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding-block:10px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.qbar .left{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.timer{font-family:var(--mono);font-size:15px;font-variant-numeric:tabular-nums;padding:5px 10px;border-radius:6px;background:var(--sunk)}
.timer.low{color:var(--fail);background:var(--fail-soft)}
.progress{height:4px;background:var(--sunk);border-radius:4px;overflow:hidden;width:160px}
.progress i{display:block;height:100%;background:var(--accent)}
.qlayout{display:grid;grid-template-columns:1fr 220px;gap:18px;align-items:start}
@media (max-width:820px){.qlayout{grid-template-columns:1fr}.nav{order:2}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px}
.qmeta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.tag{font-family:var(--mono);font-size:11.5px;padding:2px 8px;border-radius:4px;background:var(--sunk);color:var(--muted)}
.qtext{font-size:17px;font-weight:500;margin:0 0 14px;white-space:pre-line}
pre.code{font-family:var(--mono);font-size:13px;background:var(--sunk);border-radius:6px;padding:12px 14px;overflow-x:auto;margin:0 0 16px;line-height:1.5}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:11px 12px;width:100%}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{font-family:var(--mono);font-weight:500;width:26px;height:26px;border-radius:6px;display:grid;place-items:center;background:var(--sunk);font-size:13px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .k{background:var(--accent);color:var(--accent-ink)}
.opt.ok{border-color:var(--pass);background:var(--pass-soft)}
.opt.ok .k{background:var(--pass);color:var(--surface)}
.opt.bad{border-color:var(--fail);background:var(--fail-soft)}
.opt.bad .k{background:var(--fail);color:var(--surface)}
.opt:disabled{cursor:default}
.explain{margin-top:16px;border-top:1px dashed var(--line);padding-top:14px;font-size:14.5px}
.verdict{font-weight:700;margin-bottom:4px}
.verdict.ok{color:var(--pass)} .verdict.bad{color:var(--fail)}
.qfoot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;margin-top:18px}
.nav{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:5px;margin-top:10px}
.grid button{border:1px solid var(--line);background:var(--surface);border-radius:5px;height:32px;font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;padding:0}
.grid button.done{background:var(--sunk)}
.grid button.g-ok{background:var(--pass-soft);border-color:var(--pass)}
.grid button.g-bad{background:var(--fail-soft);border-color:var(--fail)}
.grid button.cur{outline:2px solid var(--accent);outline-offset:1px}
.kbd{font-size:12px;color:var(--muted);margin-top:12px}
.confirm{margin-top:12px;padding:12px;border-radius:8px;background:var(--sunk);font-size:14px;display:grid;gap:10px}

/* result */
.score{display:flex;flex-wrap:wrap;align-items:center;gap:18px 32px}
.big{font-size:56px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.pill{display:inline-block;font-weight:700;font-size:13px;letter-spacing:.04em;padding:5px 12px;border-radius:999px}
.pill.ok{background:var(--pass-soft);color:var(--pass)}
.pill.bad{background:var(--fail-soft);color:var(--fail)}
.bars{display:grid;gap:10px;margin-top:22px}
.bar{display:grid;grid-template-columns:minmax(120px,240px) 1fr 64px;gap:12px;align-items:center;font-size:14px}
@media (max-width:520px){.bar{grid-template-columns:1fr 56px}.bar .track{grid-column:1/-1;grid-row:2}}
.track{height:10px;background:var(--sunk);border-radius:6px;overflow:hidden;position:relative}
.track i{display:block;height:100%}
.track::after{content:"";position:absolute;left:65%;top:-2px;bottom:-2px;width:1px;background:var(--muted)}
.bar .num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:13px}
.review{display:grid;gap:12px;margin-top:14px}
.review .card{padding:16px 18px}
.review .qtext{font-size:15px}
.ans{font-size:14px;display:grid;gap:4px;margin-top:6px}
.ans .you{color:var(--fail)} .ans .right{color:var(--pass)}
.section-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:30px}
.section-h h2{font-size:18px}
@media (prefers-reduced-motion:no-preference){.opt,.btn,.chip{transition:border-color .12s,background .12s}}

.section-h.first{margin-top:0}
.row.between{justify-content:space-between}
.sets{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:12px}
@media (max-width:860px){.sets{grid-template-columns:repeat(2,1fr)}}
@media (max-width:460px){.sets{grid-template-columns:1fr}}
.setc{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:10px;padding:14px 16px;display:grid;gap:10px}
.setc h3{font-size:17px;font-weight:700}
.setc p{margin:0;font-size:13.5px;color:var(--muted)}
.modes{margin-top:12px}
.tag.off{background:var(--accent-soft);color:var(--ink);font-family:var(--sans);font-weight:500}
.qtext.official{font-size:15.5px;font-weight:400}
.qtext.official .qp{margin:0 0 10px}
.qq{margin:0 0 12px;padding:10px 14px;border-left:3px solid var(--line);background:var(--sunk);border-radius:0 6px 6px 0;white-space:pre-line;font-size:14.5px}
.ql{margin:0 0 12px;padding-left:4px;list-style:none;display:grid;gap:3px}
.tbl{overflow-x:auto;margin:0 0 12px}
.tbl table{border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums;min-width:100%}
.tbl th,.tbl td{border:1px solid var(--line);padding:5px 9px;text-align:center;white-space:nowrap}
.tbl thead th{background:var(--sunk);font-weight:600}
.tbl tbody th{text-align:left;font-weight:500}
.fig{margin:4px 0 14px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px;overflow-x:auto}
.fig img{display:block;max-width:100%;height:auto;margin:0 auto}
.pick2{font-size:13px;font-weight:600;color:var(--accent);margin:0 0 8px;letter-spacing:.02em}
.qtext{white-space:normal}
p.qtext{white-space:pre-line}

.wrap{max-width:1200px}
.bil{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:6px}
@media (max-width:1000px){.bil{grid-template-columns:1fr;gap:10px}}
.langtag{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.vi-col{border-left:2px solid var(--accent-soft);padding-left:16px}
@media (max-width:1000px){.vi-col{border-left:0;padding-left:0;border-top:1px dashed var(--line);padding-top:10px}}
.vi-text{white-space:pre-line;font-size:15px;line-height:1.6;margin-bottom:12px}
.vi-opt{display:block;color:var(--muted);font-size:13.5px;margin-top:3px}
.opt.ok .vi-opt,.opt.bad .vi-opt,.opt.sel .vi-opt{color:var(--ink);opacity:.75}
.qbar .left .chip{white-space:nowrap}
</style>

<div class="wrap" id="app"></div>

<script>
const OWN = [
/* ---------- Chapter 1 ---------- */
{c:1,s:"1.2.3",q:"Developer đọc sai yêu cầu và viết công thức tính thuế sai. Khi khách hàng chạy báo cáo, số tiền hiển thị sai. \"Số tiền hiển thị sai\" là gì?",o:["Error","Defect","Failure","Root cause"],a:2,e:"Failure là hành vi sai quan sát được khi chạy hệ thống. Đọc sai yêu cầu là error, công thức sai trong code là defect."},
{c:1,s:"1.3",q:"Nhóm test dồn nhiều công sức hơn vào module thanh toán vì các đợt trước module này có nhiều lỗi nhất. Việc này dựa trên nguyên tắc nào?",o:["Early testing saves time and money","Defects cluster together","Tests wear out","Testing is context dependent"],a:1,e:"Defects cluster together: phần lớn defect tập trung ở một số ít module (Pareto). Dữ liệu lỗi quá khứ giúp dự đoán cụm lỗi."},
{c:1,s:"1.1.2",q:"Hoạt động nào là debugging, không phải testing?",o:["Chạy lại test case để xác nhận lỗi đã được sửa","Tìm dòng code gây lỗi và sửa nó","Review tài liệu yêu cầu","Chạy regression test"],a:1,e:"Debugging = tìm nguyên nhân, sửa, kiểm tra bản sửa (thường do developer). Chạy lại test (confirmation), review, regression đều là testing."},
{c:1,s:"1.2.2",q:"Phát biểu nào ĐÚNG về testing và quality assurance (QA)?",o:["Testing có thể chứng minh phần mềm không còn lỗi","QA tập trung vào quy trình, testing tập trung vào sản phẩm","Testing và QA là một","QA là một dạng testing"],a:1,e:"QA hướng quy trình, mang tính phòng ngừa. Testing là một dạng quality control (QC), hướng sản phẩm, mang tính khắc phục."},
{c:1,s:"1.1.1",q:"Đâu là một mục tiêu điển hình của testing?",o:["Sửa các defect tìm được","Chứng minh phần mềm không còn defect","Đánh giá các work product như yêu cầu, user story, thiết kế và code","Thay thế hoàn toàn việc review code"],a:2,e:"Đánh giá work product là một test objective. Sửa defect là debugging; chứng minh không còn lỗi là bất khả thi (nguyên tắc 1)."},
{c:1,s:"1.3",q:"Bộ regression test chạy lại mỗi sprint suốt một năm nhưng gần đây không còn phát hiện defect mới, dù người dùng vẫn báo lỗi. Nguyên tắc nào mô tả tình huống này?",o:["Exhaustive testing is impossible","Absence-of-defects fallacy","Tests wear out","Defects cluster together"],a:2,e:"Tests wear out (trước đây gọi là pesticide paradox): lặp lại cùng test thì hiệu quả giảm dần, cần cập nhật hoặc bổ sung test."},
{c:1,s:"1.3",q:"Hệ thống vượt qua toàn bộ test case và không còn defect đã biết, nhưng người dùng từ chối sử dụng vì quy trình quá rườm rà so với cách họ làm việc. Nguyên tắc nào phù hợp nhất?",o:["Absence-of-defects fallacy","Testing shows the presence of defects","Early testing saves time and money","Tests wear out"],a:0,e:"Absence-of-defects fallacy: sửa hết lỗi không đảm bảo hệ thống đáp ứng nhu cầu người dùng. Cần cả validation, không chỉ verification."},
{c:1,s:"1.4.1",q:"Hoạt động test nào trả lời câu hỏi \"test cái gì?\" bằng cách xác định test condition từ test basis?",o:["Test planning","Test analysis","Test design","Test implementation"],a:1,e:"Test analysis: phân tích test basis để xác định và ưu tiên test condition (\"what to test\"). Test design trả lời \"how to test\" (test case, coverage items)."},
{c:1,s:"1.4.1",q:"Sắp xếp test case thành test procedure, gom thành test suite và chuẩn bị test environment thuộc hoạt động nào?",o:["Test design","Test implementation","Test execution","Test completion"],a:1,e:"Test implementation: tạo/đặt được testware cần cho thực thi như test data, test procedure, test suite, test environment."},
{c:1,s:"1.4.1",q:"Lưu trữ testware, rút bài học kinh nghiệm (lessons learned) và viết test completion report thuộc hoạt động nào?",o:["Test monitoring and control","Test execution","Test completion","Test planning"],a:2,e:"Test completion diễn ra ở các mốc dự án: lưu trữ testware, đóng/ghi nhận defect còn mở, retrospective, báo cáo tổng kết."},
{c:1,s:"1.4.4",q:"Traceability giữa test basis, testware và kết quả test mang lại lợi ích nào?",o:["Loại bỏ nhu cầu viết test plan","Hỗ trợ đánh giá coverage và phân tích ảnh hưởng của thay đổi","Đảm bảo phần mềm không còn defect","Thay thế cho configuration management"],a:1,e:"Traceability giúp đánh giá coverage, phân tích impact khi yêu cầu thay đổi, hỗ trợ audit và báo cáo dễ hiểu cho stakeholder."},
{c:1,s:"1.5.3",q:"Đâu là một hạn chế tiềm ẩn của independence of testing (kiểm thử độc lập)?",o:["Tester độc lập nhận ra các loại failure khác với developer","Tester độc lập có thể kiểm chứng giả định của stakeholder","Developer có thể giảm ý thức trách nhiệm về chất lượng","Tester độc lập ít thiên kiến hơn"],a:2,e:"Nhược điểm: tester có thể bị cô lập với team, thành nút cổ chai, và developer có thể ỷ lại. Các lựa chọn còn lại là lợi ích."},
{c:1,s:"1.5.2",q:"Đặc điểm nào thuộc whole-team approach?",o:["Chỉ tester chịu trách nhiệm về chất lượng","Tester làm việc với đại diện nghiệp vụ để tạo acceptance test phù hợp","Tester không tham gia planning","Developer không viết test"],a:1,e:"Whole-team approach: mọi thành viên có thể làm mọi việc, cả team cùng chịu trách nhiệm chất lượng; tester cộng tác với business và developer."},
{c:1,s:"1.2.3",q:"Phân tích root cause của defect chủ yếu nhằm mục đích gì?",o:["Tìm ra người phải chịu trách nhiệm","Ngăn ngừa các defect tương tự trong tương lai","Tăng số lượng test case","Đo năng suất của developer"],a:1,e:"Root cause là lý do gốc dẫn đến error (vd. áp lực thời gian, thiếu đào tạo). Xử lý root cause giúp phòng ngừa defect tương tự và cải tiến quy trình."},
{c:1,s:"1.4.5",q:"Theo CTFL 4.0, vai trò nào (role) chịu trách nhiệm chính cho các khía cạnh kỹ thuật như test analysis, test design, test implementation và test execution?",o:["Test management role","Testing role","Product owner","Scrum master"],a:1,e:"Testing role lo khía cạnh kỹ thuật/engineering. Test management role lo test process, team và các hoạt động quản lý (planning, monitoring, control, completion)."},

/* ---------- Chapter 2 ---------- */
{c:2,s:"2.1.2",q:"Đâu là một good practice áp dụng cho MỌI mô hình SDLC?",o:["Chỉ test sau khi code hoàn tất","Mỗi hoạt động phát triển đều có một hoạt động test tương ứng","Chỉ dùng dynamic testing","Tester chỉ tham gia ở giai đoạn acceptance"],a:1,e:"Các good practice: mỗi hoạt động dev có hoạt động test tương ứng; mỗi test level có mục tiêu riêng; test analysis/design bắt đầu sớm; tester review work product ngay khi có bản nháp."},
{c:2,s:"2.1.3",q:"Cách tiếp cận nào viết test theo định dạng Given/When/Then, dễ hiểu với stakeholder?",o:["TDD","ATDD","BDD","DevOps"],a:2,e:"BDD (Behavior-Driven Development) diễn đạt hành vi mong muốn bằng ngôn ngữ tự nhiên, thường theo Given/When/Then."},
{c:2,s:"2.1.3",q:"Trong TDD (Test-Driven Development), trình tự nào đúng?",o:["Viết code → viết test → refactor","Viết test → viết code để test pass → refactor","Viết acceptance criteria → viết code → viết test","Refactor → viết test → viết code"],a:1,e:"TDD: test được viết trước (và fail), rồi viết code vừa đủ để pass, sau đó refactor. Tập trung ở mức component/code."},
{c:2,s:"2.1.5",q:"Hoạt động nào KHÔNG phải là shift-left?",o:["Review đặc tả từ góc nhìn tester","Viết test case trước khi viết code","Chạy static analysis trước dynamic testing","Chỉ bắt đầu test sau khi toàn bộ hệ thống đã được code xong"],a:3,e:"Shift-left là đưa testing về sớm hơn trong SDLC. Chờ code xong mới test là ngược lại."},
{c:2,s:"2.1.6",q:"Retrospective chủ yếu nhằm mục đích gì?",o:["Đánh giá hiệu suất từng cá nhân","Thảo luận điều gì làm tốt, điều gì cần cải thiện và cách áp dụng cải tiến","Lập kế hoạch sprint tiếp theo","Phê duyệt phát hành sản phẩm"],a:1,e:"Retrospective: nhìn lại điều gì thành công và nên giữ, điều gì chưa tốt và cách cải thiện. Kết quả giúp cải tiến quy trình và chất lượng test."},
{c:2,s:"2.2.1",q:"Nhóm test kiểm tra luồng dữ liệu giữa module Đặt hàng và module Kho trong cùng một ứng dụng. Đây là test level nào?",o:["Component testing","Component integration testing","System integration testing","Acceptance testing"],a:1,e:"Component integration testing tập trung vào interface và tương tác giữa các component trong cùng hệ thống."},
{c:2,s:"2.2.1",q:"Kiểm tra tương tác giữa ứng dụng thương mại điện tử và cổng thanh toán của bên thứ ba thuộc test level nào?",o:["Component testing","Component integration testing","System integration testing","System testing"],a:2,e:"System integration testing tập trung vào interface giữa hệ thống với các hệ thống/dịch vụ bên ngoài."},
{c:2,s:"2.2.1",q:"Nhân viên vận hành kiểm tra backup/restore, khôi phục sau thảm họa và cài đặt lại hệ thống trước khi go-live. Đây là loại acceptance testing nào?",o:["User acceptance testing","Operational acceptance testing","Contractual acceptance testing","Beta testing"],a:1,e:"Operational acceptance testing (OAT) kiểm tra khía cạnh vận hành: backup/restore, disaster recovery, cài đặt, bảo trì."},
{c:2,s:"2.2.1",q:"Khác biệt chính giữa alpha testing và beta testing là gì?",o:["Alpha do developer thực hiện, beta do tester","Alpha thực hiện tại nơi của tổ chức phát triển, beta thực hiện tại nơi của khách hàng","Alpha là non-functional, beta là functional","Alpha diễn ra sau beta"],a:1,e:"Alpha testing: tại site của tổ chức phát triển. Beta testing: người dùng tiềm năng hoặc khách hàng tự test tại địa điểm của họ."},
{c:2,s:"2.2.2",q:"Test nào là non-functional testing?",o:["Kiểm tra tính đúng của công thức tính lãi","Đo thời gian phản hồi khi có 1.000 người dùng truy cập đồng thời","Kiểm tra đăng nhập với mật khẩu sai","Kiểm tra quy tắc giảm giá cho khách VIP"],a:1,e:"Performance efficiency là đặc tính non-functional (\"hệ thống hoạt động tốt thế nào\"). Các lựa chọn khác kiểm tra \"hệ thống làm gì\"."},
{c:2,s:"2.2.3",q:"Sau khi developer sửa lỗi, tester chạy lại chính test case đã fail để xác nhận lỗi đã hết. Đây là gì?",o:["Regression testing","Confirmation testing","Smoke testing","Maintenance testing"],a:1,e:"Confirmation testing (re-testing) xác nhận defect đã được sửa. Regression testing kiểm tra thay đổi không gây lỗi mới ở chỗ khác."},
{c:2,s:"2.3",q:"Tình huống nào là trigger cho maintenance testing?",o:["Viết user story mới cho sprint đầu tiên","Chuyển dữ liệu của hệ thống đang vận hành sang nền tảng mới","Review tài liệu yêu cầu ban đầu","Phát triển prototype"],a:1,e:"Trigger của maintenance testing: modification (sửa đổi, hotfix), upgrade/migration, và retirement (ngừng hệ thống, lưu trữ dữ liệu)."},
{c:2,s:"2.1.4",q:"Đâu là một lợi ích của DevOps đối với testing?",o:["Không cần manual testing nữa","Phản hồi nhanh về chất lượng code nhờ CI/CD và test tự động","Không cần regression test","Loại bỏ nhu cầu có test environment"],a:1,e:"DevOps mang lại fast feedback, khuyến khích shift-left, giảm rủi ro regression nhờ test tự động. Manual testing vẫn cần, đặc biệt từ góc nhìn người dùng."},

/* ---------- Chapter 3 ---------- */
{c:3,s:"3.1.1",q:"Work product nào KHÔNG phù hợp để static testing?",o:["Đặc tả yêu cầu","Source code","Test plan","Mã thực thi của bên thứ ba bị hạn chế phân tích vì lý do pháp lý"],a:3,e:"Hầu hết work product đọc hiểu được đều có thể static testing. Ngoại lệ: thứ khó để con người hiểu và không được phép phân tích bằng tool, vd. mã thực thi của bên thứ ba."},
{c:3,s:"3.1.2",q:"Loại defect nào static testing thường phát hiện dễ hơn dynamic testing?",o:["Rò rỉ bộ nhớ khi chạy lâu","Yêu cầu mơ hồ hoặc mâu thuẫn trong đặc tả","Thời gian phản hồi chậm","Lỗi hiển thị trên trình duyệt cụ thể"],a:1,e:"Static testing tìm defect trong work product không thực thi được (yêu cầu mơ hồ, mâu thuẫn, thiếu sót), code không thể chạy tới, vi phạm coding standard…"},
{c:3,s:"3.1.3",q:"Khác biệt giữa static testing và dynamic testing là gì?",o:["Static testing tìm defect trực tiếp; dynamic testing gây ra failure rồi mới phân tích tìm defect","Static testing chỉ dùng cho code","Dynamic testing không cần test case","Static testing luôn cần tool"],a:0,e:"Static testing phát hiện defect trực tiếp trong work product. Dynamic testing làm lộ failure, từ đó mới truy ra defect."},
{c:3,s:"3.2.2",q:"Trong review process, hoạt động nào mà mỗi reviewer tự đánh giá chất lượng work product và ghi nhận các anomaly?",o:["Planning","Review initiation","Individual review","Fixing and reporting"],a:2,e:"Các hoạt động review: planning → review initiation → individual review → communication and analysis → fixing and reporting."},
{c:3,s:"3.2.3",q:"Ai đảm bảo buổi review diễn ra hiệu quả, điều phối thảo luận và tạo môi trường an toàn để mọi người phát biểu?",o:["Author","Scribe (recorder)","Moderator (facilitator)","Manager"],a:2,e:"Moderator/facilitator điều phối buổi họp. Scribe ghi lại anomaly. Manager quyết định review cái gì và cấp nguồn lực. Review leader chịu trách nhiệm tổng thể."},
{c:3,s:"3.2.4",q:"Loại review nào trang trọng nhất, tuân theo quy trình chặt chẽ và thu thập metric để cải tiến quy trình?",o:["Informal review","Walkthrough","Technical review","Inspection"],a:3,e:"Inspection là loại review formal nhất, có thu thập metric; author không được làm review leader hay scribe."},
{c:3,s:"3.2.4",q:"Loại review do chính author dẫn dắt, với mục tiêu bao gồm đào tạo người tham gia và đạt đồng thuận?",o:["Walkthrough","Inspection","Technical review","Audit"],a:0,e:"Walkthrough do author dẫn. Mục tiêu có thể gồm: đánh giá chất lượng, tạo niềm tin, giáo dục reviewer, đạt đồng thuận, sinh ý tưởng mới."},
{c:3,s:"3.2.5",q:"Yếu tố nào góp phần làm review thành công?",o:["Review toàn bộ tài liệu 300 trang trong một buổi","Chia work product thành phần nhỏ để reviewer không mất tập trung","Dùng kết quả review để đánh giá hiệu suất của author","Không đặt mục tiêu rõ ràng để reviewer tự do"],a:1,e:"Success factors: mục tiêu rõ ràng, chọn đúng loại review, chia nhỏ, đủ thời gian chuẩn bị, sự hỗ trợ của quản lý, không dùng review để đánh giá cá nhân, đào tạo."},

/* ---------- Chapter 4 ---------- */
{c:4,s:"4.2.1",q:"Trường \"Tuổi\" chỉ chấp nhận số nguyên từ 18 đến 60. Dùng equivalence partitioning (cả valid và invalid), cần tối thiểu bao nhiêu test case để đạt 100% EP coverage?",o:["2","3","4","6"],a:1,e:"Có 3 partition: <18 (invalid), 18–60 (valid), >60 (invalid). Mỗi partition một giá trị → 3 test case."},
{c:4,s:"4.2.2",q:"Trường \"Tuổi\" chấp nhận số nguyên 18–60. Bộ giá trị nào đạt 100% coverage với 2-value boundary value analysis?",o:["18, 60","17, 18, 60, 61","17, 18, 19, 59, 60, 61","0, 18, 60, 100"],a:1,e:"2-value BVA: mỗi boundary lấy chính nó và giá trị kề ở partition bên cạnh. Boundary là 18 và 60 → 17, 18, 60, 61."},
{c:4,s:"4.2.2",q:"Với 3-value boundary value analysis, những giá trị nào cần test cho biên dưới 18 (miền hợp lệ 18–60)?",o:["17, 18","18, 19","17, 18, 19","16, 17, 18"],a:2,e:"3-value BVA: giá trị biên và hai giá trị kề hai bên → 17, 18, 19."},
{c:4,s:"4.2.1",q:"Phí giao hàng: đơn < 500.000đ phí 30.000đ; từ 500.000đ đến 1.000.000đ phí 15.000đ; > 1.000.000đ miễn phí. Bộ giá trị đơn hàng nào bao phủ tất cả valid partition với ít test nhất?",o:["300.000; 450.000; 1.200.000","200.000; 700.000; 1.500.000","500.000; 1.000.000","499.000; 501.000; 999.000"],a:1,e:"Cần một giá trị trong mỗi partition: <500k, 500k–1M, >1M. Chỉ đáp án B chạm cả 3."},
{c:4,s:"4.2.1",q:"Hạng thành viên gồm 4 partition: Bronze, Silver, Gold, Platinum. Các test đã chạy dùng: Silver, Gold, Silver, Gold. EP coverage đạt bao nhiêu?",o:["25%","50%","75%","100%"],a:1,e:"Coverage = số partition được test / tổng partition = 2/4 = 50%. Test lặp lại cùng partition không tăng coverage."},
{c:4,s:"4.2.3",q:"Một decision table đầy đủ có 3 điều kiện, mỗi điều kiện chỉ có giá trị Đúng/Sai. Bảng có tối đa bao nhiêu cột (rule)?",o:["3","6","8","9"],a:2,e:"Số rule đầy đủ = 2³ = 8. Có thể rút gọn nếu có tổ hợp không khả thi hoặc không ảnh hưởng kết quả."},
{c:4,s:"4.2.3",q:"Cho decision table:\nR1: Thành viên = Y, Đơn > 1 triệu = Y → Giảm 20%\nR2: Thành viên = Y, Đơn > 1 triệu = N → Giảm 10%\nR3: Thành viên = N, Đơn > 1 triệu = Y → Giảm 5%\nR4: Thành viên = N, Đơn > 1 triệu = N → Không giảm\nKhách không phải thành viên, đơn 2 triệu được giảm bao nhiêu?",o:["20%","10%","5%","0%"],a:2,e:"Không thành viên (N) và đơn > 1 triệu (Y) khớp rule R3 → giảm 5%."},
{c:4,s:"4.2.4",q:"Máy ATM có các chuyển trạng thái:\nIdle → (đưa thẻ) → Chờ PIN\nChờ PIN → (PIN đúng) → Sẵn sàng\nChờ PIN → (PIN sai, lần < 3) → Chờ PIN\nChờ PIN → (PIN sai lần 3) → Khóa thẻ\nSẵn sàng → (rút thẻ) → Idle\nCó bao nhiêu valid transition cần bao phủ để đạt 100% valid transitions coverage?",o:["3","4","5","6"],a:2,e:"Đếm các mũi tên hợp lệ: 5 transition (kể cả transition quay về chính Chờ PIN)."},
{c:4,s:"4.2.4",q:"Tiêu chí coverage nào của state transition testing yêu cầu phải test cả các invalid transition?",o:["All states coverage","Valid transitions coverage (0-switch)","All transitions coverage","Statement coverage"],a:2,e:"All transitions coverage bao phủ tất cả valid transition và thử cả invalid transition. Nó mạnh hơn valid transitions coverage."},
{c:4,s:"4.3.1",q:"Cần tối thiểu bao nhiêu test case để đạt 100% statement coverage cho đoạn code sau?",code:"if (a > 10) {\n    x = 1;\n}\nif (b > 5) {\n    y = 2;\n}",o:["1","2","3","4"],a:0,e:"Một test với a = 11, b = 6 chạy qua mọi statement (x = 1 và y = 2)."},
{c:4,s:"4.3.2",q:"Với cùng đoạn code, cần tối thiểu bao nhiêu test case để đạt 100% branch coverage?",code:"if (a > 10) {\n    x = 1;\n}\nif (b > 5) {\n    y = 2;\n}",o:["1","2","3","4"],a:1,e:"Mỗi if có nhánh true và false. Test 1: a = 11, b = 6 (true/true). Test 2: a = 5, b = 1 (false/false) → 2 test đủ phủ 4 nhánh."},
{c:4,s:"4.3.2",q:"Phát biểu nào ĐÚNG về statement coverage và branch coverage?",o:["100% statement coverage đảm bảo 100% branch coverage","100% branch coverage đảm bảo 100% statement coverage","Hai loại coverage luôn bằng nhau","Branch coverage chỉ áp dụng cho black-box"],a:1,e:"Branch coverage mạnh hơn: đạt 100% branch coverage thì chắc chắn 100% statement coverage, chiều ngược lại thì không."},
{c:4,s:"4.3.3",q:"Hạn chế cơ bản của white-box testing là gì?",o:["Không đo được coverage","Không phát hiện được chức năng bị thiếu (yêu cầu chưa được hiện thực)","Chỉ dùng được ở acceptance testing","Không thể tự động hóa"],a:1,e:"White-box dựa trên code có sẵn, nên không phát hiện được requirement bị bỏ sót (omission). Ưu điểm: có thể dùng ngay cả khi đặc tả mơ hồ."},
{c:4,s:"4.4.1",q:"Tester dựa vào kinh nghiệm về các lỗi hay gặp (chia cho 0, chuỗi rỗng, trường null) để thiết kế test. Đây là kỹ thuật nào?",o:["Error guessing","Checklist-based testing","Equivalence partitioning","Decision table testing"],a:0,e:"Error guessing dự đoán error/defect/failure dựa trên kiến thức của tester; một cách có hệ thống là fault attacks."},
{c:4,s:"4.4.2",q:"Kỹ thuật nào đặc biệt hữu ích khi đặc tả ít hoặc kém, thời gian gấp, và thường tổ chức theo session với test charter?",o:["Exploratory testing","Branch testing","Boundary value analysis","State transition testing"],a:0,e:"Exploratory testing: thiết kế, thực thi và đánh giá đồng thời; session-based dùng test charter và time-box."},
{c:4,s:"4.4.3",q:"Kỹ thuật dùng danh sách câu hỏi/điều kiện kiểm tra được xây dựng từ kinh nghiệm để thiết kế và thực thi test?",o:["Checklist-based testing","Error guessing","Exploratory testing","ATDD"],a:0,e:"Checklist-based testing: checklist chứa các điều kiện cần kiểm tra, được xây dựng từ kinh nghiệm và cần cập nhật định kỳ."},
{c:4,s:"4.5.1",q:"Ba khía cạnh \"3C\" của user story là gì?",o:["Code, Commit, Confirm","Card, Conversation, Confirmation","Criteria, Coverage, Completion","Customer, Contract, Change"],a:1,e:"Card (thẻ mô tả story), Conversation (trao đổi làm rõ), Confirmation (acceptance criteria)."},
{c:4,s:"4.5.2",q:"Hai định dạng phổ biến của acceptance criteria là gì?",o:["Scenario-oriented (Given/When/Then) và rule-oriented (danh sách, bảng input-output)","Black-box và white-box","Functional và non-functional","Static và dynamic"],a:0,e:"Acceptance criteria thường viết dạng scenario-oriented (Given/When/Then, dùng trong BDD) hoặc rule-oriented (bullet list, bảng ánh xạ input–output)."},
{c:4,s:"4.5.3",q:"Trong ATDD, phát biểu nào đúng?",o:["Test được viết sau khi story đã được code xong","Test được viết trước khi hiện thực story, thường bắt đầu với positive test rồi đến negative test","Chỉ developer viết acceptance test","ATDD không dùng acceptance criteria"],a:1,e:"ATDD là test-first: team (có đại diện business) viết test từ acceptance criteria trước khi code; thường bắt đầu với positive, sau đó negative và non-functional."},

/* ---------- Chapter 5 ---------- */
{c:5,s:"5.1.1",q:"Nội dung nào thường KHÔNG nằm trong test plan?",o:["Test approach và phạm vi test","Rủi ro, giả định và ràng buộc","Ngân sách và lịch trình","Danh sách chi tiết các defect tìm được trong lần chạy test hôm qua"],a:3,e:"Test plan mô tả context, stakeholder, test approach, rủi ro, budget, schedule… Danh sách defect thuộc báo cáo tiến độ, không phải kế hoạch."},
{c:5,s:"5.1.3",q:"\"Test environment đã sẵn sàng và yêu cầu đã được review\" là ví dụ của gì?",o:["Exit criteria","Entry criteria","Test completion report","Acceptance criteria"],a:1,e:"Entry criteria là điều kiện để bắt đầu một hoạt động test. Exit criteria là điều kiện để kết thúc (vd. đạt coverage, không còn defect nghiêm trọng). Trong Agile tương ứng Definition of Ready / Definition of Done."},
{c:5,s:"5.1.4",q:"Dùng three-point estimation với a (lạc quan) = 6, m (khả năng nhất) = 9, b (bi quan) = 18 người-ngày. Kết quả ước lượng E ± SD là?",o:["9 ± 2","10 ± 2","11 ± 3","10 ± 4"],a:1,e:"E = (a + 4m + b) / 6 = (6 + 36 + 18) / 6 = 10. SD = (b − a) / 6 = 12 / 6 = 2 → 10 ± 2."},
{c:5,s:"5.1.4",q:"Ở dự án trước, tỉ lệ effort development : test là 3 : 2. Dự án mới ước lượng development 600 người-ngày. Theo estimation based on ratios, effort test là?",o:["200","300","400","900"],a:2,e:"Test = 600 × 2 / 3 = 400 người-ngày."},
{c:5,s:"5.1.5",q:"Có 4 test case: TC1 (ưu tiên Cao, phụ thuộc TC3), TC2 (Trung bình), TC3 (Thấp), TC4 (Thấp, chạy sau TC2). Thứ tự thực thi nào hợp lý nhất?",o:["TC1, TC2, TC3, TC4","TC3, TC1, TC2, TC4","TC1, TC3, TC2, TC4","TC2, TC4, TC3, TC1"],a:1,e:"Chạy theo độ ưu tiên nhưng phải tôn trọng phụ thuộc: TC1 cao nhất nhưng cần TC3 trước → TC3, TC1; sau đó TC2 (trung bình) rồi TC4."},
{c:5,s:"5.1.6",q:"Theo test pyramid, phát biểu nào đúng?",o:["Tầng trên cùng có nhiều test nhất","Test ở tầng dưới nhỏ, cô lập, chạy nhanh và số lượng nhiều","UI test nên chiếm đa số","Test pyramid chỉ áp dụng cho manual test"],a:1,e:"Tầng dưới (unit/component): nhiều test, nhỏ, nhanh. Càng lên cao (end-to-end, UI): ít test hơn, phức tạp và chậm hơn."},
{c:5,s:"5.1.7",q:"Theo testing quadrants, usability testing thuộc quadrant nào?",o:["Q1: technology-facing, hỗ trợ team","Q2: business-facing, hỗ trợ team","Q3: business-facing, phản biện sản phẩm","Q4: technology-facing, phản biện sản phẩm"],a:2,e:"Q3 (business-facing, critique the product) gồm exploratory, usability, UAT. Q4 gồm smoke test và non-functional test (trừ usability)."},
{c:5,s:"5.2.1",q:"Risk level thường được xác định bởi yếu tố nào?",o:["Chỉ số lượng defect","Risk likelihood và risk impact","Số tester trong team","Số test case"],a:1,e:"Risk level = likelihood (khả năng xảy ra) × impact (mức ảnh hưởng)."},
{c:5,s:"5.2.2",q:"Đâu là project risk (không phải product risk)?",o:["Hệ thống phản hồi chậm khi tải cao","Tính toán sai tổng tiền hóa đơn","Nhà cung cấp giao component trễ hạn","Giao diện khó sử dụng"],a:2,e:"Project risk ảnh hưởng đến việc quản lý và kiểm soát dự án (tiến độ, nhân sự, nhà cung cấp). Product risk liên quan đến đặc tính chất lượng của sản phẩm."},
{c:5,s:"5.2.4",q:"Công ty mua bảo hiểm để bù đắp thiệt hại nếu hệ thống sự cố. Đây là phản ứng nào với rủi ro?",o:["Risk mitigation by testing","Risk acceptance","Risk transfer","Contingency plan"],a:2,e:"Risk control options: mitigation by testing, acceptance, transfer (chuyển rủi ro sang bên khác, vd. bảo hiểm), contingency plans."},
{c:5,s:"5.3.1",q:"Test manager quyết định ưu tiên lại test vì một rủi ro mới được phát hiện. Đây là hoạt động nào?",o:["Test monitoring","Test control","Test completion","Test analysis"],a:1,e:"Test monitoring thu thập thông tin về tiến độ; test control dùng thông tin đó để đưa ra hành động điều chỉnh (vd. ưu tiên lại test, thay đổi lịch)."},
{c:5,s:"5.3.2",q:"Khác biệt giữa test progress report và test completion report là gì?",o:["Progress report lập định kỳ trong quá trình test; completion report lập khi kết thúc một giai đoạn/level test","Hai báo cáo là một","Completion report lập hằng ngày","Progress report chỉ dành cho khách hàng"],a:0,e:"Test progress report hỗ trợ monitoring/control liên tục. Test completion report tổng kết khi đạt exit criteria, gồm deviation, defect còn mở, lessons learned."},
{c:5,s:"5.4",q:"Configuration management hỗ trợ testing như thế nào?",o:["Tự động sinh test case","Xác định, quản lý phiên bản các item như test object và testware, đảm bảo traceability","Thay thế defect management","Ước lượng effort test"],a:1,e:"Configuration management định danh, kiểm soát phiên bản và theo dõi thay đổi của các configuration item (test object, testware), giúp tái lập kết quả test."},
{c:5,s:"5.5",q:"Logo công ty trên trang chủ bị sai chính tả. Chức năng không bị ảnh hưởng. Cách đánh giá hợp lý nhất?",o:["Severity cao, priority thấp","Severity thấp, priority cao","Severity cao, priority cao","Severity thấp, priority thấp"],a:1,e:"Severity = mức ảnh hưởng kỹ thuật (thấp). Priority = mức cấp bách cần sửa về mặt kinh doanh (cao, vì ảnh hưởng hình ảnh công ty)."},
{c:5,s:"5.5",q:"Thông tin nào trong defect report giúp developer tái hiện (reproduce) lỗi nhiều nhất?",o:["Tên người báo cáo","Các bước tái hiện, kết quả mong đợi, kết quả thực tế và môi trường test","Ngày tạo báo cáo","Mức priority"],a:1,e:"Steps to reproduce, expected vs actual result, test environment là những thông tin cốt lõi để tái hiện và phân tích lỗi."},

/* ---------- Chapter 6 ---------- */
{c:6,s:"6.1",q:"Một pipeline Jenkins tự động build, chạy test và triển khai khi có commit mới. Đây là loại tool nào?",o:["Test management tools","Static testing tools","DevOps tools","Collaboration tools"],a:2,e:"DevOps tools hỗ trợ delivery pipeline, CI/CD, workflow tracking và tự động hóa build."},
{c:6,s:"6.2",q:"Đâu là một LỢI ÍCH của test automation?",o:["Không cần bảo trì test script","Giảm công việc thủ công lặp lại và tăng tính nhất quán","Tool luôn thay thế được tư duy của tester","Chi phí ban đầu thấp"],a:1,e:"Lợi ích: giảm việc lặp lại, nhất quán, đánh giá khách quan (coverage), truy cập thông tin dễ, giảm thời gian thực thi."},
{c:6,s:"6.2",q:"Đâu là một RỦI RO của test automation?",o:["Giảm thời gian chạy regression","Kỳ vọng không thực tế về những gì tool làm được","Tính nhất quán cao hơn","Phản hồi sớm hơn về chất lượng"],a:1,e:"Rủi ro: kỳ vọng phi thực tế, ước lượng sai chi phí thời gian để triển khai và bảo trì, phụ thuộc quá mức vào tool hoặc vendor, tool mã nguồn mở bị bỏ dở…"},
{c:6,s:"6.1",q:"Tool đo statement coverage khi chạy test thuộc nhóm nào?",o:["Test execution and coverage tools","Static testing tools","Test design and implementation tools","Non-functional testing tools"],a:0,e:"Test execution and coverage tools hỗ trợ chạy test tự động và đo coverage."},
{c:6,s:"6.1",q:"Docker và máy ảo (VM) dùng để dựng test environment đồng nhất thuộc nhóm tool nào?",o:["Collaboration tools","Tools supporting scalability and deployment standardization","Test management tools","Static testing tools"],a:1,e:"CTFL 4.0 liệt kê nhóm tools supporting scalability and deployment standardization (vd. virtual machines, containerization tools)."}
];
const OFF = [{"id": "OFF-A1", "set": "A", "n": 1, "c": 1, "lo": "FL-1.1.1", "k": "K1", "b": [["p", "Which of the following statements describe a valid test objective?"]], "fig": null, "after": null, "o": ["To prove that there are no unfixed defects in the system under test", "To prove that there will be no failures after the implementation of the system into production", "To reduce the risk level of the test object and to build confidence in the quality level", "To verify that there are no untested combinations of inputs"], "a": [2], "e": "Testing giúp giảm mức rủi ro và tăng niềm tin vào chất lượng. Không thể chứng minh không còn defect (nguyên tắc 1), không thể đảm bảo không có failure sau khi triển khai (nguyên tắc 7), và không thể test mọi tổ hợp input (nguyên tắc 2).", "vq": "Phát biểu nào sau đây mô tả một test objective hợp lệ?", "vo": ["Chứng minh rằng không còn defect nào chưa được sửa trong hệ thống đang test", "Chứng minh rằng sẽ không có failure nào sau khi triển khai hệ thống lên production", "Giảm mức rủi ro của test object và tạo niềm tin vào mức chất lượng", "Xác minh rằng không còn tổ hợp input nào chưa được test"]}, {"id": "OFF-A2", "set": "A", "n": 2, "c": 1, "lo": "FL-1.2.1", "k": "K2", "b": [["p", "Which of the following options shows an example of test activities that contribute to success?"]], "fig": null, "after": null, "o": ["Having testers involved during various software development lifecycle (SDLC) activities will help to detect defects in work products", "Testers try not to disturb the developers while coding, so that the developers write better code", "Testers collaborating with end users help to improve the quality of defect reports during component integration and system testing", "Certified testers will design much better test cases than non-certified testers"], "a": [0], "e": "Tester tham gia từ sớm trong các hoạt động SDLC giúp hiểu rõ quyết định thiết kế và phát hiện defect sớm trong work product. Người dùng cuối thường không tham gia các level thấp như integration testing; có chứng chỉ không tự động làm test case tốt hơn.", "vq": "Lựa chọn nào sau đây là ví dụ về hoạt động test góp phần vào thành công?", "vo": ["Để tester tham gia vào nhiều hoạt động khác nhau của SDLC sẽ giúp phát hiện defect trong các work product", "Tester cố gắng không làm phiền developer khi họ đang code, để developer viết code tốt hơn", "Tester cộng tác với end user giúp cải thiện chất lượng defect report trong component integration testing và system testing", "Tester có chứng chỉ sẽ thiết kế test case tốt hơn nhiều so với tester không có chứng chỉ"]}, {"id": "OFF-A3", "set": "A", "n": 3, "c": 1, "lo": "FL-1.3.1", "k": "K2", "b": [["p", "You have been assigned as a tester to a team producing a new system incrementally. You have noticed that no changes have been made to the existing regression test cases for several iterations and no new regression defects were identified. Your manager is happy, but you are not. Which testing principle explains your skepticism?"]], "fig": null, "after": null, "o": ["Tests wear out", "Absence-of-defects fallacy", "Defects cluster together", "Exhaustive testing is impossible"], "a": [0], "e": "Tests wear out: lặp lại cùng một bộ test qua nhiều vòng thì dần không còn tìm ra defect mới. Việc bộ regression không đổi và không phát hiện lỗi là dấu hiệu cần cập nhật test.", "vq": "Bạn được phân công làm tester trong một team phát triển hệ thống mới theo kiểu incremental. Bạn nhận thấy các regression test case hiện có không hề được thay đổi qua nhiều iteration và cũng không phát hiện thêm regression defect nào. Quản lý của bạn thì vui, nhưng bạn thì không. Nguyên tắc kiểm thử nào giải thích sự hoài nghi của bạn?", "vo": ["Tests wear out (test bị mòn)", "Absence-of-defects fallacy (ngộ nhận không có lỗi)", "Defects cluster together (lỗi tập trung thành cụm)", "Exhaustive testing is impossible (không thể test toàn bộ)"]}, {"id": "OFF-A4", "set": "A", "n": 4, "c": 1, "lo": "FL-1.4.1", "k": "K2", "b": [["p", "You work in a team that develops a mobile application for food ordering. In the current iteration the team decided to implement the payment functionality."], ["p", "Which of the following activities is a part of test analysis?"]], "fig": null, "after": null, "o": ["Estimating that testing the integration with the payment service will take 8 person-days", "Deciding that the team should test if it is possible to properly share payment between many users", "Using boundary value analysis (BVA) to derive the test data for the test cases that check the correct payment processing for the minimum allowed amount to be paid", "Analyzing the discrepancy between the actual result and expected result after executing a test case that checks the process of payment with a credit card, and reporting a defect"], "a": [1], "e": "Quyết định test \"có chia được thanh toán cho nhiều người không\" là xác định test condition → test analysis. Ước lượng effort là test planning; dùng BVA để suy ra coverage item là test design; phân tích sai khác và báo defect là test execution.", "vq": "Bạn làm trong team phát triển ứng dụng di động đặt đồ ăn. Trong iteration hiện tại, team quyết định hiện thực chức năng thanh toán.\n\nHoạt động nào sau đây thuộc test analysis?", "vo": ["Ước lượng việc test tích hợp với dịch vụ thanh toán sẽ mất 8 người-ngày", "Quyết định rằng team nên test xem có thể chia sẻ khoản thanh toán giữa nhiều người dùng đúng cách hay không", "Dùng boundary value analysis (BVA) để suy ra test data cho các test case kiểm tra xử lý thanh toán đúng với số tiền tối thiểu được phép", "Phân tích sự khác biệt giữa kết quả thực tế và kết quả mong đợi sau khi chạy test case kiểm tra thanh toán bằng thẻ tín dụng, rồi báo cáo defect"]}, {"id": "OFF-A5", "set": "A", "n": 5, "c": 1, "lo": "FL-1.4.2", "k": "K2", "b": [["p", "Which of the following factors have a SIGNIFICANT influence on the test approach?"], ["list", ["i. The SDLC", "ii. The number of defects detected in previous projects", "iii. The identified product risks", "iv. New regulatory requirements forcing formal white-box testing", "v. The test environment setup"]]], "fig": null, "after": null, "o": ["i, ii have significant influence", "i, iii, iv have significant influence", "ii, iv, v have significant influence", "iii, v have significant influence"], "a": [1], "e": "Các yếu tố ảnh hưởng lớn đến test approach: SDLC (i), product risk (iii), yêu cầu quy định (iv). Số defect dự án trước có ảnh hưởng nhưng không đáng kể; test environment không ảnh hưởng đáng kể.", "vq": "Những yếu tố nào sau đây có ảnh hưởng ĐÁNG KỂ đến test approach?\n\ni. SDLC\nii. Số lượng defect phát hiện ở các dự án trước\niii. Các product risk đã xác định\niv. Yêu cầu pháp lý mới bắt buộc thực hiện white-box testing chính thức\nv. Việc thiết lập test environment", "vo": ["i, ii có ảnh hưởng đáng kể", "i, iii, iv có ảnh hưởng đáng kể", "ii, iv, v có ảnh hưởng đáng kể", "iii, v có ảnh hưởng đáng kể"]}, {"id": "OFF-A6", "set": "A", "n": 6, "c": 1, "lo": "FL-1.4.5", "k": "K2", "b": [["p", "Which TWO of the following tasks belong MAINLY to a testing role?"]], "fig": null, "after": null, "o": ["Configure test environments", "Maintain the product backlog", "Design solutions to new requirements", "Create the test plan", "Analyze the test basis"], "a": [0, 4], "e": "Cấu hình test environment (a) và phân tích test basis (e) là việc kỹ thuật của testing role. Product backlog do product owner quản lý; thiết kế giải pháp là việc của dev team; tạo test plan thuộc test management role.", "vq": "HAI nhiệm vụ nào sau đây CHỦ YẾU thuộc về testing role?", "vo": ["Cấu hình test environment", "Duy trì product backlog", "Thiết kế giải pháp cho các yêu cầu mới", "Tạo test plan", "Phân tích test basis"]}, {"id": "OFF-A7", "set": "A", "n": 7, "c": 1, "lo": "FL-1.5.1", "k": "K2", "b": [["p", "Which of the following skills (i-v) are the MOST important skills of a tester?"], ["list", ["i. Having domain knowledge", "ii. Creating a product vision", "iii. Being a good team player", "iv. Planning and organizing the work of the team", "v. Critical thinking"]]], "fig": null, "after": null, "o": ["ii and iv are important", "i, iii and v are important", "i, ii and v are important", "iii and iv are important"], "a": [1], "e": "Kỹ năng quan trọng của tester: domain knowledge (i), làm việc nhóm tốt (iii), tư duy phản biện (v). Tạo product vision là việc của BA/business; lập kế hoạch cho team là việc của test manager hoặc cả team.", "vq": "Những kỹ năng nào (i-v) là QUAN TRỌNG NHẤT của một tester?\n\ni. Có kiến thức về lĩnh vực nghiệp vụ (domain knowledge)\nii. Xây dựng tầm nhìn sản phẩm (product vision)\niii. Là người làm việc nhóm tốt\niv. Lập kế hoạch và tổ chức công việc cho team\nv. Tư duy phản biện", "vo": ["ii và iv là quan trọng", "i, iii và v là quan trọng", "i, ii và v là quan trọng", "iii và iv là quan trọng"]}, {"id": "OFF-A8", "set": "A", "n": 8, "c": 1, "lo": "FL-1.5.2", "k": "K1", "b": [["p", "How is the whole team approach present in the interactions between testers and business representatives?"]], "fig": null, "after": null, "o": ["Business representatives decide on test automation approaches", "Testers help business representatives to define a test strategy", "Business representatives are not part of the whole team approach", "Testers help business representatives to create suitable acceptance tests"], "a": [3], "e": "Trong whole-team approach, tester cộng tác với đại diện nghiệp vụ để giúp họ tạo acceptance test phù hợp. Business representatives là một phần của whole team; chiến lược test và cách tự động hóa được quyết định cùng developer.", "vq": "Whole team approach thể hiện như thế nào trong tương tác giữa tester và đại diện nghiệp vụ (business representatives)?", "vo": ["Đại diện nghiệp vụ quyết định cách tiếp cận test automation", "Tester giúp đại diện nghiệp vụ xác định test strategy", "Đại diện nghiệp vụ không thuộc whole team approach", "Tester giúp đại diện nghiệp vụ tạo ra các acceptance test phù hợp"]}, {"id": "OFF-A9", "set": "A", "n": 9, "c": 2, "lo": "FL-2.1.2", "k": "K1", "b": [["p", "Consider the following rule: “for every SDLC activity there is a corresponding test activity”. In which SDLC models does this rule hold?"]], "fig": null, "after": null, "o": ["Only in sequential development models", "Only in iterative development models", "Only in iterative and incremental development models", "In sequential, incremental, and iterative development models"], "a": [3], "e": "Quy tắc \"mỗi hoạt động SDLC có một hoạt động test tương ứng\" là good practice áp dụng cho mọi mô hình: sequential, incremental và iterative.", "vq": "Xét quy tắc: \"với mỗi hoạt động của SDLC đều có một hoạt động test tương ứng\". Quy tắc này đúng với những mô hình SDLC nào?", "vo": ["Chỉ trong các mô hình phát triển tuần tự (sequential)", "Chỉ trong các mô hình phát triển lặp (iterative)", "Chỉ trong các mô hình phát triển lặp và tăng dần (iterative và incremental)", "Trong các mô hình tuần tự, tăng dần và lặp"]}, {"id": "OFF-A10", "set": "A", "n": 10, "c": 2, "lo": "FL-2.1.3", "k": "K1", "b": [["p", "Which of the following statements BEST describes the acceptance test-driven development (ATDD) approach?"]], "fig": null, "after": null, "o": ["In ATDD, acceptance criteria are typically created based on the given/when/then format", "In ATDD, test cases are mainly created at component testing and are code-oriented", "In ATDD, tests are created, based on acceptance criteria to drive the development of the related software", "in ATDD, tests are based on the desired behavior of the software, which makes it easier for team members to understand them"], "a": [2], "e": "ATDD: test được viết từ acceptance criteria như một phần của thiết kế để dẫn dắt việc phát triển. Given/When/Then và \"dựa trên hành vi mong muốn\" là đặc trưng của BDD; test ở mức component, hướng code là TDD.", "vq": "Phát biểu nào sau đây mô tả TỐT NHẤT cách tiếp cận acceptance test-driven development (ATDD)?", "vo": ["Trong ATDD, acceptance criteria thường được tạo theo định dạng given/when/then", "Trong ATDD, test case chủ yếu được tạo ở component testing và hướng về code", "Trong ATDD, test được tạo dựa trên acceptance criteria để dẫn dắt việc phát triển phần mềm liên quan", "Trong ATDD, test dựa trên hành vi mong muốn của phần mềm, giúp các thành viên trong team dễ hiểu hơn"]}, {"id": "OFF-A11", "set": "A", "n": 11, "c": 2, "lo": "FL-2.1.5", "k": "K2", "b": [["p", "Which of the following is NOT an example of the shift-left approach?"]], "fig": null, "after": null, "o": ["Reviewing the user requirements before they are formally accepted by the stakeholders", "Writing a component test before the corresponding code is written", "Executing a performance efficiency test for a component during component testing", "Writing a test script before setting up the configuration management process"], "a": [3], "e": "Test script phải nằm dưới configuration management, nên viết script trước khi có quy trình CM không phải là shift-left. Review yêu cầu sớm, TDD, và test hiệu năng sớm ở component testing đều là shift-left.", "vq": "Hoạt động nào sau đây KHÔNG phải là ví dụ của cách tiếp cận shift-left?", "vo": ["Review các yêu cầu người dùng trước khi chúng được stakeholder chính thức chấp nhận", "Viết component test trước khi viết code tương ứng", "Thực hiện performance efficiency test cho một component trong giai đoạn component testing", "Viết test script trước khi thiết lập quy trình configuration management"]}, {"id": "OFF-A12", "set": "A", "n": 12, "c": 2, "lo": "FL-2.1.6", "k": "K2", "b": [["p", "Which of the arguments below would you use to convince your manager to organize retrospectives at the end of each release cycle?"]], "fig": null, "after": null, "o": ["Retrospectives are very popular these days and clients would appreciate it if we added them to our processes", "Organizing retrospectives will save the organization money because without them end user representatives do not provide immediate feedback about the product", "Process weaknesses identified during the retrospective can be analyzed and serve as a to do list for the organization’s continuous process improvement program", "Retrospectives embrace five values including courage and respect, which are crucial to maintain continuous improvement in the organization"], "a": [2], "e": "Retrospective xác định điểm yếu của quy trình, làm đầu vào cho cải tiến liên tục. Retrospective không nhằm lấy feedback về sản phẩm từ end user; courage và respect là giá trị của Extreme Programming.", "vq": "Bạn sẽ dùng lập luận nào dưới đây để thuyết phục quản lý tổ chức retrospective vào cuối mỗi chu kỳ release?", "vo": ["Retrospective đang rất phổ biến và khách hàng sẽ đánh giá cao nếu ta đưa chúng vào quy trình", "Tổ chức retrospective sẽ tiết kiệm tiền vì nếu không có chúng, đại diện end user sẽ không phản hồi ngay về sản phẩm", "Các điểm yếu của quy trình được xác định trong retrospective có thể được phân tích và dùng làm danh sách việc cần làm cho chương trình cải tiến quy trình liên tục của tổ chức", "Retrospective đề cao năm giá trị gồm sự dũng cảm và tôn trọng, vốn rất quan trọng để duy trì cải tiến liên tục trong tổ chức"]}, {"id": "OFF-A13", "set": "A", "n": 13, "c": 2, "lo": "FL-2.2.1", "k": "K2", "b": [["p", "Which types of failures (1-4) fit which test levels (A-D) BEST?"], ["list", ["1. Failures in system behavior as it deviates from the user’s business needs", "2. Failures in communication between components", "3. Failures in logic in the code", "4. Failures in not correctly implemented business rules"]], ["list", ["A. Component testing", "B. Component integration testing", "C. System testing", "D. Acceptance testing"]]], "fig": null, "after": null, "o": ["1D, 2B, 3A, 4C", "1D, 2B, 3C, 4A", "1B, 2A, 3D, 4C", "1C, 2B, 3A, 4D"], "a": [0], "e": "Sai lệch so với nhu cầu nghiệp vụ → acceptance testing (1D); giao tiếp giữa component → component integration (2B); lỗi logic trong code → component testing (3A); business rule sai → system testing (4C).", "vq": "Loại failure nào (1-4) phù hợp NHẤT với test level nào (A-D)?\n\n1. Failure khi hành vi hệ thống lệch khỏi nhu cầu nghiệp vụ của người dùng\n2. Failure trong giao tiếp giữa các component\n3. Failure trong logic của code\n4. Failure do business rule được hiện thực không đúng\n\nA. Component testing\nB. Component integration testing\nC. System testing\nD. Acceptance testing", "vo": ["1D, 2B, 3A, 4C", "1D, 2B, 3C, 4A", "1B, 2A, 3D, 4C", "1C, 2B, 3A, 4D"]}, {"id": "OFF-A14", "set": "A", "n": 14, "c": 2, "lo": "FL-2.2.3", "k": "K2", "b": [["p", "You are testing a user story with three acceptance criteria: AC1, AC2 and AC3. AC1 is covered by test case TC1, AC2 by TC2, and AC3 by TC3. The test execution history had three test runs on three consecutive versions of the software as follows:"], ["table", [["", "Execution 1", "Execution 2", "Execution 3"], ["TC1", "(1) Failed", "(4) Passed", "(7) Passed"], ["TC2", "(2) Passed", "(5) Failed", "(8) Passed"], ["TC3", "(3) Failed", "(6) Failed", "(9) Passed"]]], ["p", "Tests are repeated once you are informed that all defects found in the test run are corrected and a new version of the software is available. Which of the above tests are executed as regression tests?"]], "fig": null, "after": null, "o": ["Only 4, 7, 8, 9", "Only 5, 7", "Only 4, 6, 8, 9", "Only 5, 6"], "a": [1], "e": "Test chạy lại sau khi đã fail là confirmation test: (4), (6) vì (1), (3) fail; (8), (9) vì (5), (6) fail. Test chạy lại sau khi đã pass là regression test: (5) vì (2) pass, (7) vì (4) pass.", "vq": "Bạn đang test một user story có ba acceptance criteria: AC1, AC2 và AC3. AC1 được phủ bởi test case TC1, AC2 bởi TC2, AC3 bởi TC3. Lịch sử thực thi gồm ba lần chạy trên ba phiên bản liên tiếp của phần mềm như bảng.\n\nCác test được chạy lại khi bạn được thông báo rằng mọi defect tìm thấy trong lần chạy trước đã được sửa và có phiên bản phần mềm mới.\n\nNhững test nào ở trên được thực hiện như regression test?", "vo": ["Chỉ 4, 7, 8, 9", "Chỉ 5, 7", "Chỉ 4, 6, 8, 9", "Chỉ 5, 6"]}, {"id": "OFF-A15", "set": "A", "n": 15, "c": 3, "lo": "FL-3.1.2", "k": "K2", "b": [["p", "Which of the following is NOT a benefit of static testing?"]], "fig": null, "after": null, "o": ["Having less expensive defect management due to the ease of detecting defects later in the SDLC", "Fixing defects found during static testing is generally much less expensive than fixing defects found during dynamic testing", "Finding coding defects that might not have been found by only performing dynamic testing", "Detecting gaps and inconsistencies in requirements"], "a": [0], "e": "Phát hiện defect muộn thì tốn kém hơn, nên \"defect management rẻ hơn nhờ dễ phát hiện lỗi muộn\" KHÔNG phải lợi ích. Các lựa chọn còn lại đều là lợi ích của static testing.", "vq": "Điều nào sau đây KHÔNG phải là lợi ích của static testing?", "vo": ["Quản lý defect ít tốn kém hơn nhờ dễ phát hiện defect ở giai đoạn muộn của SDLC", "Sửa defect tìm được bằng static testing thường rẻ hơn nhiều so với sửa defect tìm được bằng dynamic testing", "Tìm ra các defect trong code mà có thể sẽ không được phát hiện nếu chỉ làm dynamic testing", "Phát hiện thiếu sót và mâu thuẫn trong yêu cầu"]}, {"id": "OFF-A16", "set": "A", "n": 16, "c": 3, "lo": "FL-3.2.1", "k": "K1", "b": [["p", "Which of the following is a benefit of early and frequent feedback?"]], "fig": null, "after": null, "o": ["It improves the test process for future projects", "It forces customers to prioritize their requirements based on agreed risks", "It provides a measure for the quality of changes", "It helps avoid requirements misunderstandings"], "a": [3], "e": "Feedback sớm và thường xuyên giúp tránh hiểu sai yêu cầu. Nó không dùng để ép khách hàng ưu tiên yêu cầu, và không phải là thước đo chất lượng thay đổi.", "vq": "Điều nào sau đây là lợi ích của việc phản hồi sớm và thường xuyên (early and frequent feedback)?", "vo": ["Cải thiện quy trình test cho các dự án sau", "Buộc khách hàng phải ưu tiên yêu cầu dựa trên các rủi ro đã thống nhất", "Cung cấp thước đo cho chất lượng của các thay đổi", "Giúp tránh hiểu sai yêu cầu"]}, {"id": "OFF-A17", "set": "A", "n": 17, "c": 3, "lo": "FL-3.2.4", "k": "K2", "b": [["p", "The reviews being used in your organization have the following attributes:"], ["list", ["• There is the role of a scribe", "• The main purpose is to evaluate quality", "• The meeting is led by the author of the work product", "• There is individual preparation", "• A review report is produced"]], ["p", "Which of the following review types is MOST likely being used?"]], "fig": null, "after": null, "o": ["Informal review", "Walkthrough", "Technical review", "Inspection"], "a": [1], "e": "Có scribe → không phải informal review. Author dẫn dắt buổi họp → không thể là inspection, hiếm gặp ở technical review. Mục đích đánh giá chất lượng là một mục tiêu chính của walkthrough.", "vq": "Các buổi review trong tổ chức của bạn có các đặc điểm sau:\n• Có vai trò scribe (thư ký)\n• Mục đích chính là đánh giá chất lượng\n• Buổi họp do chính author của work product dẫn dắt\n• Có chuẩn bị cá nhân (individual preparation)\n• Có tạo review report\n\nLoại review nào CÓ KHẢ NĂNG NHẤT đang được sử dụng?", "vo": ["Informal review", "Walkthrough", "Technical review", "Inspection"]}, {"id": "OFF-A18", "set": "A", "n": 18, "c": 3, "lo": "FL-3.2.5", "k": "K1", "b": [["p", "Which of these statements is NOT a factor that contributes to successful reviews?"]], "fig": null, "after": null, "o": ["Participants should dedicate adequate time for the review", "Splitting large work products into small parts to make the required effort less intense", "Participants should avoid behaviors that might indicate boredom, exasperation, or hostility to other participants", "Failures found should be acknowledged, appreciated, and handled objectively"], "a": [3], "e": "Review tìm ra defect chứ không phải failure, nên câu d sai về khái niệm và không phải yếu tố thành công. Đủ thời gian, chia nhỏ work product, tránh thái độ tiêu cực đều là success factors.", "vq": "Phát biểu nào sau đây KHÔNG phải là yếu tố góp phần làm review thành công?", "vo": ["Người tham gia nên dành đủ thời gian cho việc review", "Chia work product lớn thành phần nhỏ để giảm cường độ công sức cần bỏ ra", "Người tham gia nên tránh các hành vi thể hiện sự chán nản, bực bội hoặc thù địch với người khác", "Các failure tìm được cần được ghi nhận, trân trọng và xử lý khách quan"]}, {"id": "OFF-A19", "set": "A", "n": 19, "c": 4, "lo": "FL-4.1.1", "k": "K2", "b": [["p", "Which of the following is a characteristic of experience-based test techniques?"]], "fig": null, "after": null, "o": ["Test cases are created based on detailed design information", "Items tested within the interface code section are used to measure coverage", "The test techniques heavily rely on the tester’s knowledge of the software and the business domain", "The test cases are used to identify deviations from the requirements"], "a": [2], "e": "Kỹ thuật dựa trên kinh nghiệm phụ thuộc nhiều vào kiến thức của tester về phần mềm và domain. Dựa trên thiết kế chi tiết hoặc đo coverage theo cấu trúc là white-box; phát hiện sai lệch so với yêu cầu là black-box.", "vq": "Điều nào sau đây là đặc điểm của các kỹ thuật test dựa trên kinh nghiệm (experience-based test techniques)?", "vo": ["Test case được tạo dựa trên thông tin thiết kế chi tiết", "Các mục được test trong phần code giao diện được dùng để đo coverage", "Kỹ thuật test phụ thuộc nhiều vào kiến thức của tester về phần mềm và lĩnh vực nghiệp vụ", "Test case được dùng để xác định các sai lệch so với yêu cầu"]}, {"id": "OFF-A20", "set": "A", "n": 20, "c": 4, "lo": "FL-4.2.1", "k": "K3", "b": [["p", "You are testing a simplified apartment search form which has only two search criteria:"], ["list", ["• floor (with three possible options: ground floor; first floor; second or higher floor)", "• garden type (with three possible options: no garden; small garden; large garden)"]], ["p", "Each of the apartment on the ground floor has a garden, apartments on higher floors don’t. The form has a built-in validation mechanism that will not allow you to use the search criteria which violate this rule."], ["p", "Each test has two input values: floor and garden type. You want to apply equivalence partitioning (EP) to cover each floor and each garden type in your tests."], ["p", "What is the minimal number of test cases to achieve 100% EP coverage for valid partitions?"]], "fig": null, "after": null, "o": ["3", "4", "5", "6"], "a": [1], "e": "\"Small garden\" và \"large garden\" chỉ đi với tầng trệt → cần 2 test cho tầng trệt. Thêm 2 test cho tầng 1 và tầng 2+ (với \"no garden\"). Tổng 4 test case.", "vq": "Bạn đang test một form tìm căn hộ đơn giản chỉ có hai tiêu chí tìm kiếm:\n• tầng (ba lựa chọn: tầng trệt; tầng một; tầng hai trở lên)\n• loại vườn (ba lựa chọn: không có vườn; vườn nhỏ; vườn lớn)\n\nMọi căn hộ ở tầng trệt đều có vườn, các căn ở tầng cao hơn thì không. Form có cơ chế kiểm tra sẵn, không cho phép dùng tiêu chí tìm kiếm vi phạm quy tắc này.\n\nMỗi test có hai giá trị input: tầng và loại vườn. Bạn muốn áp dụng equivalence partitioning (EP) để phủ mỗi loại tầng và mỗi loại vườn trong các test.\n\nSố test case tối thiểu để đạt 100% EP coverage cho các valid partition là bao nhiêu?", "vo": ["3", "4", "5", "6"]}, {"id": "OFF-A21", "set": "A", "n": 21, "c": 4, "lo": "FL-4.2.2", "k": "K3", "b": [["p", "You are testing a system that calculates the final course grade for a given student."], ["p", "The final grade is assigned based on the final result, according to the following rules:"], ["list", ["• 0 – 50 points: failed", "• 51 – 60 points: fair", "• 61 – 70 points: satisfactory", "• 71 – 80 points: good", "• 81 – 90 points: very good", "• 91 – 100 points: excellent"]], ["p", "You have prepared the following set of test cases:"], ["table", [["", "Final result", "Final grade"], ["TC1", "91", "excellent"], ["TC2", "50", "failed"], ["TC3", "81", "very good"], ["TC4", "60", "fair"], ["TC5", "70", "satisfactory"], ["TC6", "80", "good"]]], ["p", "What is the 2-value boundary value analysis (BVA) coverage for the final result that is achieved with the existing test cases?"]], "fig": null, "after": null, "o": ["50%", "60%", "33.3%", "100%"], "a": [0], "e": "Có 12 giá trị biên: 0, 50, 51, 60, 61, 70, 71, 80, 81, 90, 91, 100. Các test chạm 6 giá trị biên (91, 50, 81, 60, 70, 80) → 6/12 = 50%.", "vq": "Bạn đang test hệ thống tính điểm tổng kết môn học cho sinh viên. Xếp loại dựa trên điểm cuối cùng theo quy tắc:\n• 0 – 50 điểm: trượt (failed)\n• 51 – 60: trung bình (fair)\n• 61 – 70: khá (satisfactory)\n• 71 – 80: tốt (good)\n• 81 – 90: rất tốt (very good)\n• 91 – 100: xuất sắc (excellent)\n\nBạn đã chuẩn bị bộ test case như bảng.\n\n2-value boundary value analysis (BVA) coverage cho điểm cuối cùng mà các test case hiện có đạt được là bao nhiêu?", "vo": ["50%", "60%", "33.3%", "100%"]}, {"id": "OFF-A22", "set": "A", "n": 22, "c": 4, "lo": "FL-4.2.3", "k": "K3", "b": [["p", "Your favorite bicycle daily rental store has just introduced a new Customer Relationship Management system and asked you, one of their most loyal members, to test it."], ["p", "The implemented features are as follows:"], ["list", ["• Anyone can rent a bicycle, but members receive a 20% discount", "• However, if the return deadline is missed, the discount is no longer available", "• After 15 rentals, members get a gift: a T-Shirt"]], ["p", "Decision table describing the implemented features looks as follows:"], ["table", [["Conditions", "R1", "R2", "R3", "R4", "R5", "R6", "R7", "R8"], ["Being a member", "T", "T", "T", "T", "F", "F", "F", "F"], ["Missed deadline", "T", "F", "T", "F", "T", "F", "F", "T"], ["15th rental", "F", "F", "T", "T", "F", "F", "T", "T"], ["Actions", "", "", "", "", "", "", "", ""], ["20% discount", "", "X", "", "X", "", "", "", ""], ["Gift T-Shirt", "", "", "X", "X", "", "", "", "X"]]], ["p", "Based ONLY on the feature description of the Customer Relationship Management system, which of the above rules describes an impossible situation?"]], "fig": null, "after": null, "o": ["R4", "R2", "R6", "R8"], "a": [3], "e": "R8: không phải thành viên nhưng lại nhận áo T-shirt, trong khi chỉ thành viên mới được quà → tình huống không thể xảy ra theo đặc tả. R4, R2 hợp lệ; R6 không giảm giá là đúng.", "vq": "Cửa hàng cho thuê xe đạp theo ngày mà bạn yêu thích vừa đưa vào dùng hệ thống Quản lý quan hệ khách hàng (CRM) mới và nhờ bạn, một trong những thành viên trung thành nhất, test nó.\n\nCác tính năng đã hiện thực:\n• Ai cũng có thể thuê xe, nhưng thành viên được giảm 20%\n• Tuy nhiên, nếu trễ hạn trả xe thì không còn được giảm giá\n• Sau 15 lần thuê, thành viên được tặng một áo T-shirt\n\nDecision table mô tả các tính năng như bảng.\n\nChỉ dựa vào mô tả tính năng của hệ thống CRM, rule nào ở trên mô tả một tình huống không thể xảy ra?", "vo": ["R4", "R2", "R6", "R8"]}, {"id": "OFF-A23", "set": "A", "n": 23, "c": 4, "lo": "FL-4.2.4", "k": "K3", "b": [["p", "You test a system whose lifecycle is modeled by the state transition diagram shown below. The system starts in the INIT state and ends its operation in the OFF state."]], "fig": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAmIAAADiCAAAAADIEvTLAAAjdUlEQVR42u2dZ0BUxxqG37N9F3bpXYqABRRRFBG7sRsjqNiNxuiNJjH2Go1Rr12judYYa+zGijERY48Va6woIljove3C1rk/FrxK9Erdw7Lz/hA8ZerDzDfflMMQUFFVpTi0CKgoYlQUMSoqihgVRYyKIkZFRRGjoohRUcSoqChiVBQxKqo3xTPGRGc+Tc3L0RkwQpmTo4slw3a2U5+ky3MMGaG1g5udRcWDIUYn3f6Ghq9eps5uHbvZztvoYfhs8/0iKpxw40Msqp+AlTbE7D+5bP5dXQnis5Jtq6PKCiadMbbFPOm9InXc2h08ahuyxJ+fjczRSkcsLxvcREVElZWC2C6xhNewnVNtAxrPJPrPWwU6h9lfcYylo1Sp331dqSlDIJqh4LU7oTV4K1JwqQeDHslleiejfa3USope2Qlmn1wyfOOZdSoYwuE6I+kolZM3vvO6ot/+MoRyRMT/hp2uKs0X2FC2N9o6VxJiuhUQb2Yn27HWgLxCIRiu3VVeePjO6wUnn5Y+EPlmZasZ7PTQtgvNcYEl6yBuNzNoADtRu08RoNDo/GLFA29NnKLM4/bz5Ctnluq5QxcmqgwJzlYX/6ZOfO1gKSyuLU1CWZwu9x6JvjRnyXE6rC7UxuEXm781Ofo3641NH6+7ZJ3FhE0WZCy4ap đạt valid transitions coverage là bao nhiêu?", "vo": ["4", "2", "7", "3"]}, {"id": "OFF-A24", "set": "A", "n": 24, "c": 4, "lo": "FL-4.3.1", "k": "K2", "b": [["p", "Your test suite achieved 100% statement coverage. What is the consequence of this fact?"]], "fig": null, "after": null, "o": ["Each instruction in the code that contains a defect has been executed at least once", "Any test suite containing more test cases than your test suite will also achieve 100% statement coverage", "Each path in the code has been executed at least once", "Every combination of input values has been tested at least once"], "a": [0], "e": "100% statement coverage nghĩa là mọi statement, kể cả statement chứa defect, đều được chạy ít nhất một lần. Không đảm bảo mọi path hay mọi tổ hợp input; nhiều test hơn chưa chắc coverage cao hơn.", "vq": "Bộ test của bạn đạt 100% statement coverage. Hệ quả của điều này là gì?", "vo": ["Mọi lệnh trong code có chứa defect đều đã được thực thi ít nhất một lần", "Bất kỳ bộ test nào có nhiều test case hơn bộ test của bạn cũng sẽ đạt 100% statement coverage", "Mọi đường đi (path) trong code đều đã được thực thi ít nhất một lần", "Mọi tổ hợp giá trị input đều đã được test ít nhất một lần"]}, {"id": "OFF-A25", "set": "A", "n": 25, "c": 4, "lo": "FL-4.3.3", "k": "K2", "b": [["p", "Which of the following is NOT true for white-box testing?"]], "fig": null, "after": null, "o": ["During white-box testing the entire software implementation is considered", "White-box coverage metrics can help identify additional tests to increase code coverage", "White-box test techniques can be used in static testing", "White-box testing can help identify gaps in requirements implementation"], "a": [3], "e": "White-box không phát hiện được phần yêu cầu chưa được hiện thực vì nó chỉ dựa trên cấu trúc code. Các phát biểu còn lại đều đúng về white-box.", "vq": "Điều nào sau đây KHÔNG đúng với white-box testing?", "vo": ["Trong white-box testing, toàn bộ phần hiện thực của phần mềm được xem xét", "Các metric coverage của white-box có thể giúp xác định thêm test để tăng code coverage", "Kỹ thuật white-box có thể được dùng trong static testing", "White-box testing có thể giúp xác định những thiếu sót trong việc hiện thực yêu cầu"]}, {"id": "OFF-A26", "set": "A", "n": 26, "c": 4, "lo": "FL-4.4.1", "k": "K2", "b": [["p", "Which of the following BEST describes the concept behind error guessing?"]], "fig": null, "after": null, "o": ["Error guessing involves using your knowledge and experience of defects found in the past and typical errors made by developers", "Error guessing involves using your personal experience of development and the errors you made as a developer", "Error guessing requires you to imagine that you are the user of the test object and to guess errors the user could make interacting with it", "Error guessing requires you to rapidly duplicate the development task to identify the sort of errors a developer might make"], "a": [0], "e": "Error guessing dựa trên kiến thức và kinh nghiệm về các defect đã gặp và lỗi điển hình của developer. Không phải dựa trên kinh nghiệm code của chính mình, không phải đoán lỗi thao tác của user.", "vq": "Điều nào sau đây mô tả TỐT NHẤT ý tưởng đằng sau error guessing?", "vo": ["Error guessing là dùng kiến thức và kinh nghiệm của bạn về các defect đã gặp trước đây và các lỗi điển hình mà developer hay mắc", "Error guessing là dùng kinh nghiệm cá nhân khi làm phát triển và các lỗi chính bạn từng mắc khi còn là developer", "Error guessing yêu cầu bạn tưởng tượng mình là người dùng test object và đoán các lỗi người dùng có thể mắc khi tương tác với nó", "Error guessing yêu cầu bạn nhanh chóng làm lại công việc phát triển để xác định những loại lỗi developer có thể mắc"]}, {"id": "OFF-A27", "set": "A", "n": 27, "c": 4, "lo": "FL-4.4.2", "k": "K2", "b": [["p", "In your project there has been a delay in the release of a brand-new application and test execution started late, but you have very detailed domain knowledge and good analytical skills. The full list of requirements has not yet been shared with the team, but management is asking for some test results to be presented."], ["p", "Which test technique fits BEST in this situation?"]], "fig": null, "after": null, "o": ["Checklist-based testing", "Error guessing", "Exploratory testing", "Branch testing"], "a": [2], "e": "Exploratory testing phù hợp khi đặc tả chưa đủ và thời gian gấp, đặc biệt với tester có domain knowledge và kỹ năng phân tích tốt. Sản phẩm mới nên chưa có checklist hay kinh nghiệm để error guessing.", "vq": "Trong dự án của bạn, việc release một ứng dụng hoàn toàn mới bị trễ và test execution bắt đầu muộn, nhưng bạn có kiến thức nghiệp vụ rất sâu và kỹ năng phân tích tốt. Danh sách đầy đủ yêu cầu chưa được chia sẻ với team, nhưng ban quản lý đang yêu cầu trình bày một số kết quả test.\n\nKỹ thuật test nào phù hợp NHẤT trong tình huống này?", "vo": ["Checklist-based testing", "Error guessing", "Exploratory testing", "Branch testing"]}, {"id": "OFF-A28", "set": "A", "n": 28, "c": 4, "lo": "FL-4.5.2", "k": "K2", "b": [["p", "Which of the following BEST describes the way acceptance criteria can be documented?"]], "fig": null, "after": null, "o": ["Performing retrospectives to determine the actual needs of the stakeholders regarding a given user story", "Using the given/when/then format to describe an example test condition related to a given user story", "Using verbal communication to reduce the risk of misunderstanding the acceptance criteria by others", "Documenting risks related to a given user story in a test plan to facilitate the risk-based testing of a given user story"], "a": [1], "e": "Acceptance criteria thường được viết theo định dạng Given/When/Then để mô tả ví dụ. Retrospective, trao đổi miệng hay rủi ro trong test plan không phải cách ghi lại acceptance criteria.", "vq": "Điều nào sau đây mô tả TỐT NHẤT cách có thể ghi lại (document) acceptance criteria?", "vo": ["Tổ chức retrospective để xác định nhu cầu thực tế của stakeholder đối với một user story", "Dùng định dạng given/when/then để mô tả một test condition ví dụ liên quan đến user story", "Dùng trao đổi bằng lời để giảm rủi ro người khác hiểu sai acceptance criteria", "Ghi lại các rủi ro liên quan đến user story trong test plan để hỗ trợ risk-based testing cho user story đó"]}, {"id": "OFF-A29", "set": "A", "n": 29, "c": 4, "lo": "FL-4.5.3", "k": "K3", "b": [["p", "Consider the following user story:"], ["quote", "As an Editor\nI want to review content before it is published\nso that I can ensure the grammar is correct"], ["p", "and its acceptance criteria:"], ["list", ["• The user can log in to the content management system with \"Editor\" role", "• The editor can view existing content pages", "• The editor can edit the page content", "• The editor can add markup comments", "• The editor can save changes", "• The editor can reassign to the \"content owner\" role to make updates"]], ["p", "Which of the following is the BEST example of an ATDD test for this user story?"]], "fig": null, "after": null, "o": ["Test if the editor can save the document after edit the page content", "Test if the content owner can log in and make updates to the content", "Test if the editor can schedule the edited content for publication", "Test if the editor can reassign to another editor to make updates"], "a": [0], "e": "Test a bao phủ 2 acceptance criteria: editor sửa nội dung và lưu thay đổi. b nói về content owner; c (lên lịch xuất bản) không có trong AC; d giao cho editor khác, trong khi AC nói giao cho content owner.", "vq": "Xét user story sau:\nLà một Editor, tôi muốn review nội dung trước khi xuất bản để đảm bảo ngữ pháp chính xác.\n\nvà các acceptance criteria:\n• Người dùng có thể đăng nhập hệ thống quản lý nội dung với vai trò \"Editor\"\n• Editor có thể xem các trang nội dung hiện có\n• Editor có thể chỉnh sửa nội dung trang\n• Editor có thể thêm bình luận đánh dấu\n• Editor có thể lưu thay đổi\n• Editor có thể chuyển giao cho vai trò \"content owner\" để cập nhật\n\nĐâu là ví dụ TỐT NHẤT về một ATDD test cho user story này?", "vo": ["Test xem editor có thể lưu tài liệu sau khi chỉnh sửa nội dung trang hay không", "Test xem content owner có thể đăng nhập và cập nhật nội dung hay không", "Test xem editor có thể lên lịch xuất bản nội dung đã chỉnh sửa hay không", "Test xem editor có thể chuyển giao cho một editor khác để cập nhật hay không"]}, {"id": "OFF-A30", "set": "A", "n": 30, "c": 5, "lo": "FL-5.1.2", "k": "K1", "b": [["p", "How do testers add value to iteration and release planning?"]], "fig": null, "after": null, "o": ["Testers determine the priority of the user stories to be developed", "Testers focus only on the functional aspects of the system to be tested", "Testers participate in the detailed risk identification and risk assessment of user stories", "Testers guarantee the release of high-quality software through early test design during the release planning"], "a": [2], "e": "Tester góp giá trị vào iteration/release planning bằng cách tham gia xác định và đánh giá rủi ro chi tiết của user story. Ưu tiên story do business và team quyết định; tester xem xét cả functional và non-functional.", "vq": "Tester đóng góp giá trị như thế nào vào iteration planning và release planning?", "vo": ["Tester xác định mức ưu tiên của các user story sẽ được phát triển", "Tester chỉ tập trung vào khía cạnh functional của hệ thống cần test", "Tester tham gia vào việc xác định rủi ro chi tiết và đánh giá rủi ro của các user story", "Tester đảm bảo release phần mềm chất lượng cao nhờ thiết kế test sớm trong release planning"]}, {"id": "OFF-A31", "set": "A", "n": 31, "c": 5, "lo": "FL-5.1.3", "k": "K2", "b": [["p", "Which TWO of the following options are the exit criteria for testing a system?"]], "fig": null, "after": null, "o": ["Test environment readiness", "The ability to log in to the test object by the tester", "Estimated defect density is reached", "Requirements are translated
